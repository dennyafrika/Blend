<script>
/* ===== AI assistant (reaches Claude for now; partner to be announced) ===== */
(function(){
const AI_NAME='Claude';
IC.spark=IC.spark||'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.7 2.1 2.1.7-2.1.7-.7 2.1-.7-2.1-2.1-.7 2.1-.7z"/>';
const el=()=>document.getElementById('aip');
let turns=[],ctl=null,busy=false,smp;
const RULES=()=>'You are the in-app assistant inside Blend, a global social network prototype with Home, Videos, Market (shop, jobs, services) and You tabs, an earnings wallet, DMs and calls. Help people write posts, captions, bios and job profiles, translate text, explain how features work, and answer general questions. Be friendly and brief. Plain text only, no markdown tables. The person is currently on the "'+(S&&S.tab||'home')+'" page and prefers the interface language "'+(window.__LG?__LG.name():'English')+'". Answer in that language unless they write in another.';
const SUGS=['Help me write a post','Write my job profile bio','Translate this to Zulu','What can Blend do?'];
function open(){
 if(el())return;
 const o=document.createElement('div');o.id='aip';o.className='aip';o.setAttribute('role','dialog');o.setAttribute('aria-label','Assistant');
 o.innerHTML=`<div class="ah"><button class="ib" data-ai="close" aria-label="Close assistant">${I('back')}</button><span class="t"><b>Assistant</b><small>Powered by ${AI_NAME} · AI partner coming soon</small></span><button class="ib" data-ai="new" aria-label="New chat">${I('plus')}</button></div><div class="alog" id="alog"></div><form class="af" id="aform"><textarea id="ain" rows="1" placeholder="Ask anything" aria-label="Message the assistant"></textarea><button id="asend" type="submit" aria-label="Send">${I('send',20)}</button></form>`;
 $('#app').appendChild(o);draw();
 const t=$('#ain');t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
 t.addEventListener('input',()=>{t.style.height='auto';t.style.height=Math.min(110,t.scrollHeight)+'px'});
 $('#aform').addEventListener('submit',e=>{e.preventDefault();busy&&ctl?ctl.abort():send()});
 setTimeout(()=>t.focus(),60);
}
function close(){if(ctl)ctl.abort();const o=el();if(o)o.remove()}
function draw(){
 const l=$('#alog');if(!l)return;
 if(!turns.length){l.innerHTML=`<div class="ahi"><span class="sth" style="display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--surface)">${I('spark',28)}</span><h3>How can I help?</h3><p>Ask for ideas, a caption, a translation or help using Blend.</p><div class="achips">${SUGS.map(s=>`<button data-ai="sug" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`;return}
 l.innerHTML=turns.map(m=>`<div class="am ${m.role==='user'?'u':m.err?'e':'a'}">${esc(m.content)}</div>`).join('')+(busy&&!turns[turns.length-1].live?'<div class="am a adots"></div>':'');
 l.scrollTop=l.scrollHeight;
}
const COPY={not_granted:'Access was not allowed. You can allow it from this page\'s permissions menu.',sampling_disabled:'The assistant is not available for this account.',rate_limited:'Too many questions too fast. Please wait a moment and try again.',session_expired:'Please sign in again to keep chatting.',upstream_error:'Something interrupted the answer. Tap send to try again.',refused:'I can\'t help with that one. Try asking something different.',prompt_too_large:'That message is too long. Try a shorter one.'};
async function send(q){
 const t=$('#ain');const text=(q||(t&&t.value)||'').trim();if(!text||busy)return;
 if(t){t.value='';t.style.height='auto'}
 if(smp===undefined){try{smp=await (window.claude&&claude.use?claude.use('sample'):null)}catch(_){smp=null}}
 turns.push({role:'user',content:text});
 if(!smp){turns.push({role:'assistant',content:'The assistant works when Blend is opened inside Claude. It is not connected in this view.',err:true});draw();return}
 busy=true;ctl=new AbortController();draw();
 const hist=turns.filter(m=>!m.err&&!m.live).slice(-14).map(m=>({role:m.role,content:m.content}));
 const input=[{role:'user',content:RULES()},...hist];
 try{
  const r=await smp(input,{cache:false,signal:ctl.signal,modelTier:'quick',onText:({text})=>{const last=turns[turns.length-1];if(last&&last.live){last.content=text}else turns.push({role:'assistant',content:text,live:true});draw()}});
  const last=turns[turns.length-1];if(last&&last.live){last.content=r.text;delete last.live}else turns.push({role:'assistant',content:r.text});
 }catch(e){
  const last=turns[turns.length-1];
  if(last&&last.live){if(e.text){last.content=e.text;delete last.live}else turns.pop()}
  if(e&&e.code==='cancelled'){}
  else turns.push({role:'assistant',content:COPY[e&&e.code]||COPY.upstream_error,err:true});
 }
 busy=false;ctl=null;draw();const i=$('#ain');if(i)i.focus();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-ai]');if(!b)return;
 const a=b.dataset.ai;
 if(a==='open')open();else if(a==='close')close();
 else if(a==='new'){if(ctl)ctl.abort();turns=[];busy=false;draw()}
 else if(a==='sug')send(b.dataset.q);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&el())close()});
window.__AI={open,close,send,turns:()=>turns};
})();

</script>

function shrink(file){
 return new Promise(res=>{
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size<400000)return res(file);
  const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b&&b.size<file.size?new File([b],'p.jpg',{type:'image/jpeg'}):file),'image/jpeg',.85)};
  im.onerror=()=>{URL.revokeObjectURL(u);res(file)};im.src=u})
}
async function sendFiles(files){
 if(!thread)return;
 const list=[...files].slice(0,10),out=[];
 if(!window.__SB||!__SB.upload)return toast('Sending files is not available here.');
 toast('Sending…');
 for(const f0 of list){
  const k=/^image\//.test(f0.type)?'image':/^video\//.test(f0.type)?'video':/^audio\//.test(f0.type)?'audio':'';
  if(!k){toast('That file type can’t be sent.');continue}
  if(f0.size>52428800){toast('That file is over 50 MB. Try a shorter one.');continue}
  try{const f=k==='image'?await shrink(f0):f0;out.push({k,u:await __SB.upload(f,'dm')})}catch(e){toast('Could not send: '+((e&&(e.message||e.error))||'unknown error').toString().slice(0,90))}
 }
 if(out.length)await sendMsg('',out)
}
let rec=null;
const recSecs=()=>rec?Math.min(120,(Date.now()-rec.t0)/1000):0;
async function recStart(){
 if(!navigator.mediaDevices||!window.MediaRecorder)return toast('Voice notes are not supported on this browser.');
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mt=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  const mr=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream),chunks=[];
  rec={mr,stream,t0:Date.now(),send:false,chunks};
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=async()=>{
   const r=rec;stream.getTracks().forEach(t=>t.stop());clearInterval(r.timer);rec=null;paint();
   if(!r.send||!chunks.length)return;
   const type=(mr.mimeType||mt||'audio/mp4').split(';')[0];
   await sendFiles([new File([new Blob(chunks,{type})],'voice',{type})]);
  };
  mr.start();
  rec.timer=setInterval(()=>{const t=document.getElementById('bkrt');if(t)t.textContent=fmtT(recSecs());if(recSecs()>=120)recStop(true)},500);
  paint();
 }catch(e){rec=null;toast('Allow the microphone to record a voice note.')}
}
function recStop(send){if(!rec)return;rec.send=!!send;try{rec.mr.stop()}catch(e){rec.stream.getTracks().forEach(t=>t.stop());clearInterval(rec.timer);rec=null;paint()}}

 const P=window.__PS,CP=P.CP(),q=PT.msq.trim().toLowerCase(),M=P.Mus;
 const list=Object.entries(P.TR).filter(([k,t])=>!q||(t.n+' '+(t.g||'')).toLowerCase().includes(q));
 const playing=id=>M.cur&&M.cur.tag==='draft'&&M.cur.m&&M.cur.m.id===id;
 const hasV=PT.items.some(x=>x.k==='v'),m=CP.mix,fo=(k)=>`<select data-psf="${k}" aria-label="${k}">${[0,1,2,4].map(s=>`<option value="${s}" ${m[k]===s?'selected':''}>${s?s+' s':'Off'}</option>`).join('')}</select>`;
 const row=(lab,k)=>`<label class="psr"><span>${lab}</span><b id="pv_${k}">${m[k]}%</b><input type="range" min="0" max="100" value="${m[k]}" data-psr="${k}" aria-label="${lab}"></label>`;
 b.innerHTML=`<div class="ptc"><b>Background music</b>
 ${CP.music?`<div class="ptsel"><span>${I('music',16)} <b>${esc(CP.music.name)}</b></span><button class="mkbtn sm ghost" data-pt="mrm">Remove</button></div>`:'<small>Pick a song to play behind your post. You can add it to any kind of post.</small>'}
 <input class="ptt" id="ptms" type="search" placeholder="Search songs, moods and genres" value="${esc(PT.msq)}" aria-label="Search songs">
 <div class="ptlist">${list.length?list.map(([k,t])=>`<div class="ptsong"><button class="ptpl" data-pt="mprev" data-id="${k}" aria-label="${playing(k)?'Stop':'Play'} ${esc(t.n)}">${I(playing(k)?'close':'play',18)}</button><div class="t"><b>${esc(t.n)}</b><small>${esc(t.g||'Loop')} · ${t.bpm} BPM</small></div><button class="mkbtn sm ${CP.music&&CP.music.k==='s'&&CP.music.id===k?'':'ghost'}" data-pt="muse" data-id="${k}">${CP.music&&CP.music.k==='s'&&CP.music.id===k?'Selected':'Use'}</button></div>`).join(''):'<p class="q">No songs match that search.</p>'}</div>
 <button class="mkbtn ghost" data-pt="maud">${I('music',16)}${CP.music&&CP.music.k==='f'?'Change my own audio':'Use my own audio file'}</button><input type="file" id="psaud" accept="audio/*" hidden>
 <small class="ptn">These are free loops made inside Blend. Commercial songs need a licensed music catalogue.</small>
 ${CP.music?`<div class="ptmix"><b>Sound mix</b>${hasV?`<div class="mkopts"><button data-pt="mixpre" data-vv="100" data-mv="20">Video first</button><button data-pt="mixpre" data-vv="70" data-mv="50">Balanced</button><button data-pt="mixpre" data-vv="30" data-mv="100">Music first</button></div>${row('Video sound','vv')}<div class="psf">Fade in ${fo('vin')} Fade out ${fo('vout')}</div>`:''}${row('Background music','mv')}<div class="psf">Fade in ${fo('min')} Fade out ${fo('mout')}</div></div>`:''}</div>`;
}
/* ---------- state updates ---------- */
const _oc=openCreate;
openCreate=function(){_oc();S.newType='text';PT.cap=false;PT.view=null;PT.mode='cap';PT.items=[];PT.cur=0;PT.cropOpen=false;PT.msq='';PT.ts={f:'clean',sz:'m',al:'left',b:false,i:false,u:false,caps:false,c:null};syncVfile();draw()};
function updGo(){const g=document.getElementById('goPost'),t=$('#newText');if(!g||!t)return;g.disabled=!(t.value.trim()||(S.newType==='media'&&PT.items.length))}
const closeSongs=()=>{const M=window.__PS.Mus;if(M.cur&&M.cur.tag==='draft')M.stop(0)};
document.addEventListener('click',e=>{
 if(e.target.closest('[data-a=ntype]')){e.stopImmediatePropagation();return}
 const b=e.target.closest('[data-pt]');if(!b)return;const a=b.dataset.pt,it=cur(),P=window.__PS;
 if(a==='tab'){if(b.dataset.k!=='music')closeSongs();setView(b.dataset.k)}
 else if(a==='font'){PT.ts.f=b.dataset.k;draw()}
 else if(a==='size'){PT.ts.sz=b.dataset.k;draw()}
 else if(a==='align'){PT.ts.al=b.dataset.k;draw()}
 else if(a==='emph'){PT.ts[b.dataset.k]=!PT.ts[b.dataset.k];draw()}
 else if(a==='tcol'){PT.ts.c=b.dataset.c||null;draw()}
 else if(a==='add')document.getElementById('ptfile').click();
 else if(a==='sel'){PT.cur=+b.dataset.i;PT.cropOpen=false;draw()}
 else if(a==='del'){PT.items.splice(PT.cur,1);PT.cur=Math.max(0,Math.min(PT.cur,PT.items.length-1));syncVfile();draw()}
 else if(a==='mvl'&&PT.cur>0){[PT.items[PT.cur-1],PT.items[PT.cur]]=[PT.items[PT.cur],PT.items[PT.cur-1]];PT.cur--;draw()}
 else if(a==='mvr'&&PT.cur<PT.items.length-1){[PT.items[PT.cur+1],PT.items[PT.cur]]=[PT.items[PT.cur],PT.items[PT.cur+1]];PT.cur++;draw()}
 else if(a==='mode'){PT.mode=b.dataset.m;if(PT.mode!=='cap'&&S.tag)PT.items.forEach(x=>{if(!x.ovl.t)x.ovl.t='#'+S.tag+' '});draw()}
 else if(a==='pre'){it.adj={...PRE[+b.dataset.i][1]};document.querySelectorAll('[data-pta]').forEach(i=>{i.value=it.adj[i.dataset.pta];$('#pa_'+i.dataset.pta).textContent=it.adj[i.dataset.pta]});paint()}
 else if(a==='crop'){PT.cropOpen=!PT.cropOpen;draw()}
 else if(a==='ar'){it.crop.ar=+b.dataset.v;it.crop.z=Math.max(1,it.crop.z);draw()}
 else if(a==='rot'){it.rot=(it.rot+1)%4;draw()}
 else if(a==='reset'){it.adj={b:0,c:0,s:0,w:0};it.crop={ar:0,z:1,x:50,y:50};it.rot=0;draw()}
 else if(a==='opos'){it.ovl.x=+b.dataset.x;it.ovl.y=+b.dataset.y;draw()}
 else if(a==='osize'){it.ovl.s=+b.dataset.v;draw()}
 else if(a==='tpos'){PT.ts.px=+b.dataset.x;PT.ts.py=+b.dataset.y;PT.ts.al=PT.ts.px<30?'left':PT.ts.px>70?'right':'center';draw()}
 else if(a==='tfree'){PT.ts.px=null;PT.ts.py=null;draw()}
 else if(a==='col'){it.ovl.c=b.dataset.c;PT.ts.c=b.dataset.c;applyTs();document.querySelectorAll('.ptsw').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===it.ovl.c));const o=$('#ptov');if(o){o.style.color=it.ovl.c;o.dataset.c=it.ovl.c}}
 else if(a==='play'){const v=$('#ptvid');if(!v)return;if(v.paused){if(v.currentTime<it.vs||v.currentTime>=it.ve-.1)v.currentTime=it.vs;v.play();setPlay(true)}else{v.pause();setPlay(false)}}
 else if(a==='mprev'){const M=P.Mus,id=b.dataset.id;if(M.cur&&M.cur.tag==='draft'&&M.cur.m.id===id)M.stop(.1);else M.start({k:'s',id,name:P.TR[id].n},.45,0,'draft');draw()}
 else if(a==='muse'){const id=b.dataset.id;P.CP().music={k:'s',id,name:P.TR[id].n};draw()}
 else if(a==='mrm'){closeSongs();P.CP().music=null;draw()}
 else if(a==='maud')document.getElementById('psaud').click();
 else if(a==='mixpre'){const m=P.CP().mix;m.vv=+b.dataset.vv;m.mv=+b.dataset.mv;draw()}
},true);
document.addEventListener('input',e=>{
 const t=e.target,it=cur();
 if(t.id==='newText'){const q=$('#ptpt');if(q)q.textContent=t.value||'Your words'}
 if(t.dataset&&t.dataset.pta&&it){it.adj[t.dataset.pta]=+t.value;$('#pa_'+t.dataset.pta).textContent=t.value;paint()}
 else if(t.dataset&&t.dataset.ptc&&it){const k=t.dataset.ptc;it.crop[k]=k==='z'?+t.value/100:+t.value;const o=$('#pc_'+k);if(o)o.textContent=k==='z'?t.value+'%':t.value;paint()}
 else if(t.id==='ptot'&&it){it.ovl.t=t.value;const o=$('#ptov');if(o)o.textContent=t.value}
 else if(t.dataset&&t.dataset.ptv&&it){
  if(!it.vd)return;const v=$('#ptvid'),p=+t.value/100*it.vd;
  if(t.dataset.ptv==='s')it.vs=Math.min(p,it.ve-.5);else it.ve=Math.max(p,it.vs+.5);
  it.vs=Math.max(0,it.vs);it.ve=Math.min(it.vd,it.ve);upRange(it);v.currentTime=t.dataset.ptv==='s'?it.vs:Math.max(it.vs,it.ve-.3);
 }
 else if(t.id==='ptms'){PT.msq=t.value;const list=document.querySelector('.ptlist');const pos=t.selectionStart;drawMusic(document.getElementById('ptbox'));const n=document.getElementById('ptms');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
 else if(t.id==='newText'){setTimeout(()=>{updGo();const pv=$('#pspv');if(pv)applyTs()},0)}
});
document.addEventListener('change',e=>{
 if(e.target.id==='ptfile'){addFiles(e.target.files)}
 else if(e.target.id==='psaud')setTimeout(draw,80);
 else if(e.target.dataset&&e.target.dataset.psf)setTimeout(()=>{},0);
});
document.addEventListener('click',e=>{if(e.target.closest('#psbox'))setTimeout(applyTs,20)});
document.addEventListener('pointerdown',e=>{if(e.target.id==='newText')PT.tapped=true},true);
/* ---------- posting ---------- */
let before=null,pending=null;
document.addEventListener('click',e=>{
 if(!e.target.closest('[data-a=post2]'))return;
 closeSongs();pending=null;
 const ta=$('#newText');
 if(S.newType==='media'){
  if(!PT.items.length){e.stopImmediatePropagation();e.preventDefault();toast('Add a photo or video, or use the Text tab');return}
  const photosOnly=PT.items.every(x=>x.k==='p'),ovs=PT.mode==='cap'?[]:PT.items.map(x=>x.ovl.t.trim()).filter(Boolean),onlyOn=PT.mode==='on'&&ovs.length>0;
  if(onlyOn)ta.value=ovs.join(' ');
  else if(!ta.value.trim())ta.value=ovs[0]||(PT.items.length>1?'Shared '+PT.items.length+' items':photosOnly?'Shared a photo':'Shared a video');
  S.newType=photosOnly?'photo':'video';syncVfile();
  pending={media:PT.items.map(x=>{
   if(x.k==='p'){const cv=document.createElement('canvas');renderItem(x,cv,900,true);return{k:'p',img:cv.toDataURL('image/jpeg',.74)}}
   const o={k:'v',url:x.url,name:x.name};if(PT.mode!=='cap'&&x.ovl.t.trim())o.ovl={...x.ovl,st:{...PT.ts}};if(x.vd&&(x.vs>.05||x.ve<x.vd-.05))o.trim={s:+x.vs.toFixed(2),e:+x.ve.toFixed(2)};return o}),noCap:onlyOn,ts:{...PT.ts,px:null,py:null}};
 }else if(S.newType==='text')pending={ts:{...PT.ts}};
 before=POSTS[0];
},true);
document.addEventListener('click',e=>{
 if(!e.target.closest('[data-a=post2]'))return;
 const p=POSTS[0];if(!p||p===before||p.u!=='me'||!pending)return;
 if(pending.media){p.media=pending.media;const ph=pending.media.filter(x=>x.k==='p');if(ph.length===pending.media.length){p.img=ph[0].img;p.imgs=ph.map(x=>x.img)}if(pending.noCap)p.noCap=true}
 if(pending.ts)p.ts=pending.ts;
 pending=null;PT.items=[];renderHome()
});
/* ---------- the feed ---------- */
const tsStyle=(t,big)=>{const f=FONTS[t.f]||FONTS.clean;return cssTs(t,SIZES[t.sz][1]).replace(/;$/,'').replace(/"/g,"'")};
function slide(p,x){
 if(x.k==='p')return '<div class="pms"><img src="'+x.img+'" alt="Photo by '+esc(P[p.u]?P[p.u].n:'user')+'" loading="lazy"></div>';
 return '<div class="pms"><video data-pv="'+p.id+'" src="'+x.url+'" controls playsinline preload="metadata"'+(x.trim?' data-ts="'+x.trim.s+'" data-te="'+x.trim.e+'"':'')+'></video>'+(x.ovl?'<div class="ptovl fix" data-c="'+x.ovl.c+'" style="left:'+x.ovl.x+'%;top:'+x.ovl.y+'%;color:'+x.ovl.c+';'+ovStyle(x.ovl.st,x.ovl.s)+';max-width:'+mwOf(x.ovl.x)+'%">'+esc(x.ovl.t)+'</div>':'')+'</div>';
}
const _ph=postHTML;
postHTML=function(p){
 let h=_ph(p);
 const m=p.media||(p.imgs&&p.imgs.length?p.imgs.map(i=>({k:'p',img:i})):p.img?[{k:'p',img:p.img}]:null);
 if(p.noCap&&m)h=h.replace(/<div class="ptext">[\s\S]*?<\/div>/,'');
 if(m&&m.length&&p.type!=='capsule')h=h.replace(/<div class="(?:pvid|art|pimg)"[^>]*>[\s\S]*?<\/div>/,m.length===1?'<div class="pmed">'+slide(p,m[0])+'</div>':'<div class="pmed" data-n="'+m.length+'"><div class="pmt">'+m.map(x=>slide(p,x)).join('')+'</div><span class="pmc">1/'+m.length+'</span></div>');
 if(p.ts&&(p.type==='text'||m)){
  const at=p.type==='text'&&p.ts.px!=null&&p.ts.py!=null;
  h=h.replace(/<div class="ptext( big)?"( style="([^"]*)")?>/,(mm,big,_a,st)=>'<div class="ptext'+(big||'')+(at?' ptat':'')+'" style="'+(st?st+';':'')+tsStyle(p.ts)+(at?';left:'+p.ts.px+'%;top:'+p.ts.py+'%;max-width:'+mwOf(p.ts.px)+'%':'')+'">');
  if(at){
   if(h.indexOf('<div class="pcard"')>=0)h=h.replace('<div class="pcard"','<div class="pcard ptpos"');
   else h=h.replace(/(<div class="ptext[^"]*ptat"[\s\S]*?<\/div>)/,'<div class="pcard ptpos nobg">$1</div>');
  }
 }
 return h;
};
document.addEventListener('scroll',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('pmt')){const i=Math.round(t.scrollLeft/Math.max(1,t.clientWidth)),c=t.parentNode.querySelector('.pmc');if(c)c.textContent=(i+1)+'/'+t.parentNode.dataset.n}},true);
/* trimmed playback in the feed */
document.addEventListener('loadedmetadata',e=>{const v=e.target;if(v instanceof HTMLVideoElement&&v.dataset.ts&&!v.dataset.tinit){v.dataset.tinit='1';v.currentTime=+v.dataset.ts}},true);
document.addEventListener('play',e=>{const v=e.target;if(v instanceof HTMLVideoElement&&v.dataset.ts&&(v.currentTime<+v.dataset.ts||v.currentTime>=+v.dataset.te))v.currentTime=+v.dataset.ts},true);
document.addEventListener('timeupdate',e=>{const v=e.target;if(v instanceof HTMLVideoElement&&v.dataset.te&&v.currentTime>=+v.dataset.te){v.pause();v.currentTime=+v.dataset.ts}},true);
PT.api={draw,setView,addFiles,thumb,syncVfile,updGo,closeSongs,FONTS};
window.__PT=PT;
})();

<script>
/* ===== Explore that works: hashtags, near you, people, groups ===== */
(function(){
const $=s=>document.querySelector(s);
S.tag=null;
const XP={go:new Set(),help:new Set(),rep:new Set()};
const BASE={n1:{go:24},n6:{go:63},n5:{help:31},n4:{help:9}};
const TAGRE=t=>new RegExp('#'+String(t).replace(/\W/g,'')+'(?!\\w)','i');
const txtOf=p=>[p.text,p.title,p.cap].filter(Boolean).join(' ');
const tagsIn=()=>{const m={};POSTS.forEach(p=>{(txtOf(p).match(/#\w+/g)||[]).forEach(t=>{const k=t.toLowerCase();m[k]=(m[k]||0)+1})});return m};
const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const closeAll=()=>{try{closeSheet()}catch(_){}try{const pn=$('#panel');if(pn&&!pn.hidden)closePanel()}catch(_){}};
/* ---------- hashtag feed ---------- */
function openTag(t){
 S.tag=String(t).replace(/^#/,'').toLowerCase().replace(/\W/g,'');if(!S.tag)return;
 closeAll();S.feed='foryou';setTab('home');const h=$('#homeScroll');if(h)h.scrollTop=0;
}
function clearTag(){S.tag=null;if(S.tab==='home')renderHome()}
const _rh=renderHome;
renderHome=function(){
 if(!S.tag)return _rh();
 const re=TAGRE(S.tag),list=POSTS.filter(p=>re.test(txtOf(p))).sort((a,b)=>mins(a.t)-mins(b.t));
 $('#homeBody').innerHTML=`<div class="xtb"><button class="xtbk" data-xp="untag" aria-label="Back to all posts">${I('back',20)}</button><div class="t"><small>Hashtag</small><b>#${esc(S.tag)}</b><small>${list.length} post${list.length===1?'':'s'} in your feed</small></div><button class="mkbtn sm" data-xp="tagpost">New post</button></div><div class="seg nv3" role="tablist" aria-label="Home sections"><button role="tab" data-nv="feed" data-f="foryou" aria-selected="false">For you</button><button role="tab" data-nv="feed" data-f="following" aria-selected="false">Following</button><button role="tab" data-nv="explore" aria-selected="false">Explore</button></div>`+
  (list.length?list.map(postHTML).join(''):`<div class="empty">No posts with #${esc(S.tag)} yet.<br><button class="mkbtn" data-xp="tagpost" style="margin-top:12px">Be the first to post</button></div>`);
};
const _oc=openCreate;
openCreate=function(){
 _oc();
 const ta=$('#newText');
 if(ta&&S.tag&&!ta.value){ta.value='#'+S.tag+' ';ta.dispatchEvent(new Event('input',{bubbles:true}));try{ta.setSelectionRange(ta.value.length,ta.value.length)}catch(_){}}
 const pl=$('#pinPlace');
 if(pl&&!$('#xpKindRow')){
  pl.closest('label').insertAdjacentHTML('afterend','<label class="line" id="xpKindRow" hidden>Pin as <select id="pinKind" class="sel"><option>Tip</option><option>Event</option><option>Lost pet</option><option>Open now</option></select></label>');
  pl.addEventListener('change',()=>{$('#xpKindRow').hidden=!pl.value});
  if(S.pinPre){pl.value=S.pinPre.place;$('#xpKindRow').hidden=false;if(S.pinPre.kind)$('#pinKind').value=S.pinPre.kind;S.pinPre=null}
 }
 if(S.gpre){const a=$('#aud');if(a){if(![...a.options].some(o=>o.value===S.gpre))a.insertAdjacentHTML('beforeend','<option>'+esc(S.gpre)+'</option>');a.value=S.gpre}S.gpre=null}
};
/* pinned kind + return to Explore */
let nb0=null,kd0='';
document.addEventListener('click',e=>{if(e.target.closest('[data-a=post2]')){nb0=NEAR[0];kd0=($('#pinKind')||{}).value||''}},true);
document.addEventListener('click',e=>{
 if(!e.target.closest('[data-a=post2]'))return;
 if(NEAR[0]&&NEAR[0]!==nb0){if(kd0)NEAR[0].kind=kd0;NEAR[0].mine=true;if(S.fromNear){S.fromNear=false;setTimeout(()=>setTab('explore'),30)}}
});
/* ---------- near you ---------- */
const cnt=x=>x.kind==='Event'?((BASE[x.id]||{}).go||0)+(XP.go.has(x.id)?1:0):x.kind==='Tip'?((BASE[x.id]||{}).help||0)+(XP.help.has(x.id)?1:0):x.kind==='Lost pet'?(x.sightings||[]).length:0;
const cntTxt=x=>{const n=cnt(x);return !n?'':x.kind==='Event'?n+' going':x.kind==='Tip'?n+' found this helpful':n+' sighting'+(n===1?'':'s')};
nearHTML=function(){
 const kinds=['All','Event','Lost pet','Open now','Tip'];
 const list=NEAR.filter(x=>x.place===S.nearPlace&&(S.nk==='All'||x.kind===S.nk));
 return `<div class="sec"><h3>Near you</h3><select class="place" id="nbPlace" aria-label="Your area">${PLACES.map(p=>`<option ${p===S.nearPlace?'selected':''}>${p}</option>`).join('')}</select><div class="cats" style="padding:0 0 8px;border:0">${kinds.map(k=>`<button class="chip" data-a="nbkind" data-k="${k}" aria-pressed="${S.nk===k}">${k}</button>`).join('')}</div>
 <button class="mkbtn sm ghost xpnewpin" data-xp="pinhere">+ Pin something in ${esc(S.nearPlace)}</button>
 ${list.length?list.map(x=>`<div class="nb" role="button" tabindex="0" data-xp="near" data-id="${x.id}">${av(x.u,40)}<div class="t"><div><span class="badge ${x.kind==='Open now'?'live':''}">${x.kind}</span> <span class="q">${x.dist} away</span></div><b>${esc(x.title)}</b><span class="q">${esc(x.text)}<br>${esc(x.t)}${cntTxt(x)?' · '+cntTxt(x):''}</span></div></div>`).join(''):`<div class="empty" style="padding:20px">Nothing pinned here yet.${S.nk!=='All'?'<br>Try All.':''}</div>`}
 <p class="q">Prototype: pick an area to simulate where you are. Pinned posts only show to people nearby.</p></div>`;
};
function nearSheet(id){
 const x=NEAR.find(n=>n.id===id);if(!x)return;
 const who=P[x.u]||{n:'You',h:'denny'},going=XP.go.has(id),help=XP.help.has(id);
 let act='';
 if(x.kind==='Event')act=`<button class="mkbtn ${going?'':'ghost'}" data-xp="go" data-id="${id}">${going?'You are going':'I am going'}${cnt(x)?' · '+cnt(x):''}</button>`;
 else if(x.kind==='Tip')act=`<button class="mkbtn ${help?'':'ghost'}" data-xp="help" data-id="${id}">${help?'Marked helpful':'Helpful'}${cnt(x)?' · '+cnt(x):''}</button>`;
 else if(x.kind==='Lost pet')act=`<div class="xpsight"><b>Have you seen it?</b><textarea id="xpSight" placeholder="Where and when did you see it?" maxlength="200"></textarea><button class="mkbtn" data-xp="sight" data-id="${id}">I have seen it</button>${(x.sightings||[]).length?`<h4>Sightings (${x.sightings.length})</h4>`+x.sightings.map(s=>`<div class="xps"><b>${s.u==='me'?'You':esc(P[s.u].n)}</b><span>${esc(s.text)}</span><small>${esc(s.t)}</small></div>`).join(''):''}</div>`;
 else act=`<p class="q">Open times can change. Check before you go.</p>`;
 openSheet(`<h3>${esc(x.title)}</h3><div class="lb"><div class="xpd"><div><span class="badge ${x.kind==='Open now'?'live':''}">${x.kind}</span> <span class="q">${x.dist} away · ${esc(x.place)}</span></div>
 <p>${esc(x.text)}</p><small class="q">${esc(x.t)} · posted by ${av(x.u,18)} @${esc(who.h)}</small>${act}
 <div class="xpr"><button class="mkbtn sm ghost" data-xp="dir" data-id="${id}">Directions</button><button class="mkbtn sm ghost" data-xp="share" data-id="${id}">Share</button><button class="mkbtn sm ghost" data-xp="rep" data-id="${id}">${XP.rep.has(id)?'Reported':'Report'}</button>${x.mine?`<button class="mkbtn sm ghost" data-xp="del" data-id="${id}">Delete my pin</button>`:''}</div></div></div>`);
}
/* ---------- people and groups ---------- */
function personSheet(u){
 const p=P[u];if(!p)return;const posts=POSTS.filter(x=>x.u===u),fol=S.following.has(u),followers=500+hash(u)%9000;

  const tg=tagsIn();Object.keys(tg).filter(k=>!known.has(k)&&(!q||k.includes(q))).slice(0,6).forEach(k=>{tr.insertAdjacentHTML('beforeend',`<button class="row trend" data-xp="tag" data-t="${esc(k)}"><div class="t"><small>New in your community</small><b>${esc(k)}</b><small>${tg[k]} post${tg[k]===1?'':'s'}</small></div></button>`)});

document.addEventListener('click',e=>{

 else if(a==='sight'){const t=($('#xpSight')||{}).value||'';if(!t.trim())return toast('Say where you saw it');const x=NEAR.find(n=>n.id===id);(x.sightings=x.sightings||[]).push({u:'me',text:t.trim(),t:'Just now'});nearSheet(id);if(S.tab==='explore')renderExplore();toast('Thanks. The owner can see your sighting')}
 else if(a==='dir'){const x=NEAR.find(n=>n.id===id);try{window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.title+' '+x.place+' Johannesburg'),'_blank','noopener')}catch(_){toast('Maps could not open')}}
 else if(a==='share'){const x=NEAR.find(n=>n.id===id),link='https://blend.example/near/'+id;try{navigator.clipboard.writeText(x.title+' ('+x.place+') '+link).then(()=>toast('Link copied'),()=>toast('Copy not available here'))}catch(_){toast('Copy not available here')}}
 else if(a==='rep'){XP.rep.add(id);toast('Thanks. We will review this');nearSheet(id)}
 else if(a==='del'){const i=NEAR.findIndex(n=>n.id===id);if(i>=0)NEAR.splice(i,1);closeSheet();renderExplore();toast('Pin deleted')}
 else if(a==='pinhere'){S.pinPre={place:S.nearPlace,kind:S.nk!=='All'?S.nk:'Tip'};S.fromNear=true;openCreate()}
 else if(a==='person')personSheet(b.dataset.u);
 else if(a==='group')groupSheet(b.dataset.g);
 else if(a==='open'){closeSheet();setTimeout(()=>openComments(id),20)}
 else if(a==='gpost'){const n=b.dataset.n;closeSheet();S.gpre=n;S.fromNear=false;openCreate()}
});
document.addEventListener('click',e=>{
 if(e.target.closest('#xpFol'))setTimeout(()=>{const f=$('#xpFol'),u=f&&f.dataset.u;if(f){const on=S.following.has(u);f.textContent=on?'Following':'Follow';f.classList.toggle('on',on)}},30);

<script>
/* ===== Create post: one simple screen ===== */
(function(){
const $=s=>document.querySelector(s),PT=window.__PT,PS=window.__PS,A=PT.api;
IC.hash=IC.hash||'<path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/>';
IC.pin=IC.pin||'<path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>';
const BG=['#111111','#ff3d8b','#ff7a2f','#ffc933','#12b886','#2b8cff','#7c4dff','#e11d48'];
const lum=h=>{const n=parseInt(h.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255)};
const fgFor=c=>lum(c)>.45?'#111':'#fff';
const uname=()=>String(P.me&&P.me.h||P.me&&P.me.n||'friend').replace(/^@/,'');
const greet=()=>{const h=new Date().getHours();return 'Good '+(h<12?'morning':h<18?'afternoon':'evening')+', '+uname()};
const _oc=openCreate;
openCreate=function(){_oc();build()};
function setBg(c){
 const w=$('.fbta');if(!w)return;
 PS.CP().bg=c?{k:'c',v:c,fg:fgFor(c)}:null;
 PT.ts.al=c?'center':'left';
 w.style.background=c||'';w.style.color=c?fgFor(c):'';w.classList.toggle('bg',!!c);
 document.querySelectorAll('.fbsw .sw').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.c||'')===(c||'')));
 A.draw();
}
function build(){
 const sh=$('#scrim .sheet'),create=sh&&sh.querySelector('.create');if(!create||create.classList.contains('fb'))return;
 const h3=sh.querySelector('h3');if(h3)h3.textContent='Create post';
 create.classList.add('fb');
 const chips=create.querySelector(':scope>.chips'),ta=$('#newText'),aud=$('#aud'),go=$('#goPost'),capRow=$('#capRow');
 const pinLab=$('#pinPlace').closest('label'),kindRow=$('#xpKindRow'),live=create.querySelector('[data-a=golive]'),line=go.closest('.line'),ptbox=$('#ptbox');
 PT.ph=greet();
 /* head: who is posting + who can see it */
 create.insertAdjacentHTML('afterbegin',`<div class="fbhead">${av('me',44)}<div class="fbwho"><span class="fbaud"></span></div></div>`);
 create.querySelector('.fbaud').appendChild(aud.closest('label'));
 const fw=document.createElement('div');fw.className='fbfs';
 fw.innerHTML=`<button type="button" id="fbsbtn" class="fbsbtn" aria-haspopup="listbox" aria-expanded="false" data-fb="fsopen"><span></span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 9l7 7 7-7"/></svg></button><div class="fbfl" id="fbfl" role="listbox" aria-label="Text styles" hidden>${Object.entries(A.FONTS).map(([k,v])=>`<button type="button" role="option" data-fb="fspick" data-k="${k}">${v[0]}</button>`).join('')}</div>`;
 create.querySelector('.fbaud').appendChild(fw);
 Object.entries(A.FONTS).forEach(([k,v])=>{const o=fw.querySelector('[data-k="'+k+'"]');o.style.fontFamily=v[1];o.style.fontWeight=v[2];if(v[3]==='uppercase')o.style.textTransform='uppercase'});
 /* the big writing box */
 const w=document.createElement('div');w.className='fbta';ta.before(w);w.appendChild(ta);
 w.insertAdjacentHTML('afterend',`<div class="fbaa"><button class="fbaab" data-fb="aa" aria-expanded="false" aria-label="Background colours">Aa</button><div class="fbsw" hidden><button class="sw" data-fb="bg" data-c="" aria-pressed="true" aria-label="No background">✕</button>${BG.map(c=>`<button class="sw" data-fb="bg" data-c="${c}" style="background:${c}" aria-pressed="false" aria-label="Background ${c}"></button>`).join('')}<button class="sw fbmore" data-fb="more" aria-label="More text styles" title="More text styles">+</button></div></div><div class="fbmedia" id="fbmedia" hidden></div>`);
 /* add to your post */
 const items=[['media','image','Photo / video'],['tag','hash','Tag'],['music','music','Music'],['pin','pin','Place'],['cap','lock','Capsule'],['live','play','Go live']];
 const add=document.createElement('div');add.className='fbadd';
 add.innerHTML=`<b>Add to your post</b><div class="fbic">${items.map(([k,i,l])=>`<button data-fb="${k}" aria-pressed="false"><span>${I(i,22)}</span><small>${l}</small></button>`).join('')}</div><input type="file" id="fbfile" accept="image/*,video/*" multiple hidden>`;
 $('#fbmedia').after(add);
 const pan=document.createElement('div');pan.className='fbpan';pan.id='fbpan';pan.hidden=true;add.after(pan);
 const extra=document.createElement('div');extra.className='fbextra';pan.after(extra);
 pinLab.hidden=true;extra.appendChild(pinLab);if(kindRow)extra.appendChild(kindRow);
 capRow.hidden=true;extra.appendChild(capRow);
 extra.after(chips);chips.after(ptbox);chips.style.display='none';
 if(live)live.style.display='none';
 /* one wide Post button */
 go.classList.add('fbpost');go.textContent='Post';create.appendChild(go);if(line)line.style.display='none';
 PT.onDraw=refresh;refresh();
 const preset=PS.CP().bg;if(preset)setBg(preset.v);
 setTimeout(()=>{try{ta.focus()}catch(_){}},60);
}
function refresh(){
 const w=$('.fbta');if(!w)return;
 const tx=$('#newText');if(tx&&!PT.items.length)tx.placeholder=PT.ph;
 const fb_=$('#fbsbtn');if(fb_){const d=A.FONTS[PT.ts.f]||A.FONTS.clean,sp=fb_.firstElementChild;sp.textContent=d[0];sp.style.fontFamily=d[1];sp.style.fontWeight=d[2];fb_.dataset.k=PT.ts.f;document.querySelectorAll('#fbfl [data-k]').forEach(o=>o.setAttribute('aria-selected',o.dataset.k===PT.ts.f))}
 const n=PT.items.length,aa=$('.fbaa');
 if(aa)aa.style.display=(n||PT.cap)?'none':'';
 if(n&&PS.CP().bg)setBg(null);
 w.classList.toggle('compact',!!n||!!PT.cap);
 const m=$('#fbmedia');
 if(m){
  if(!n){m.hidden=true;m.innerHTML=''}
  else{
   m.hidden=false;m.dataset.n=Math.min(n,4);
   m.innerHTML=PT.items.map((it,i)=>`<div class="fbt">${it.k==='p'?`<img src="${A.thumb(it,260)}" alt="Photo ${i+1}">`:`<video src="${it.url}#t=0.1" muted playsinline preload="metadata"></video><span class="fbpl">${I('play',22)}</span>`}<button class="fbx" data-fb="rm" data-i="${i}" aria-label="Remove">${I('close',16)}</button><button class="fbed" data-fb="edit" data-i="${i}">Edit</button></div>`).join('')+(n<10?`<button class="fbt fbplus" data-fb="media" aria-label="Add more">+</button>`:'');
  }
 }
 const on={media:n>0,music:!!PS.CP().music,pin:!!($('#pinPlace')||{}).value,cap:!!PT.cap,tag:!$('#fbpan').hidden};
 document.querySelectorAll('.fbic [data-fb]').forEach(b=>b.setAttribute('aria-pressed',!!on[b.dataset.fb]));
 const mu=document.querySelector('.fbic [data-fb=music] small');if(mu)mu.textContent=PS.CP().music?'Music ✓':'Music';
 const pb=$('#ptbox');if(pb&&pb.firstElementChild&&PT.view&&!pb.querySelector('.fbdone'))pb.insertAdjacentHTML('afterbegin','<button class="fbdone" data-fb="done">Done</button>');
 const g=$('#goPost');if(g)g.disabled=!(($('#newText')||{}).value.trim()||n);
}
function insert(txt){
 const ta=$('#newText');if(!ta)return;
 const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,e=ta.selectionEnd==null?s:ta.selectionEnd,b=ta.value.slice(0,s),pad=b&&!/\s$/.test(b)?' ':'';
 ta.value=b+pad+txt+' '+ta.value.slice(e);const p=(b+pad+txt+' ').length;ta.focus();try{ta.setSelectionRange(p,p)}catch(_){}
 ta.dispatchEvent(new Event('input',{bubbles:true}));
}
function tagPanel(){
 const pan=$('#fbpan'),show=pan.hidden;pan.hidden=!show;
 if(show){
  const tg=(typeof TRENDS!=='undefined'?TRENDS:[]).map(t=>t[0]),mine=Object.keys(P).filter(k=>k!=='me');
  pan.innerHTML=`<b>Add a hashtag</b><div class="fbch">${tg.map(t=>`<button class="chip" data-fb="ins" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div><b>Tag a friend</b><div class="fbch">${mine.map(k=>`<button class="chip" data-fb="ins" data-t="@${esc(P[k].h)}">${av(k,18)} ${esc(P[k].n.split(' ')[0])}</button>`).join('')}</div><small>Or type # or @ in your post.</small>`;
 }
 refresh();
}
document.addEventListener('click',e=>{
 const fl=$('#fbfl');if(fl&&!fl.hidden&&!e.target.closest('.fbfs'))fl.hidden=true;
 const b=e.target.closest('[data-fb]');if(!b||!$('.fb'))return;const k=b.dataset.fb;
 if(k==='fsopen'){const l=$('#fbfl'),o=l.hidden;l.hidden=!o;b.setAttribute('aria-expanded',o);return}
 else if(k==='fspick'){PT.ts.f=b.dataset.k;$('#fbfl').hidden=true;$('#fbsbtn').setAttribute('aria-expanded',false);A.draw();return}
 if(k==='aa'){const s=$('.fbsw');s.hidden=!s.hidden;b.setAttribute('aria-expanded',!s.hidden)}
 else if(k==='bg')setBg(b.dataset.c||null);
 else if(k==='more'){A.setView('text')}
 else if(k==='media'){if(PT.cap){toast('A time capsule holds words only. Turn the capsule off to add photos.');return}$('#fbfile').click()}
 else if(k==='rm'){PT.cur=+b.dataset.i;PT.items.splice(PT.cur,1);PT.cur=Math.max(0,Math.min(PT.cur,PT.items.length-1));if(!PT.items.length&&PT.view==='media')PT.view=null;A.syncVfile();A.draw()}
 else if(k==='edit'){PT.cur=+b.dataset.i;PT.cropOpen=false;PT.view='media';A.draw();const pb=$('#ptbox');if(pb)pb.scrollIntoView({block:'nearest',behavior:'smooth'})}
 else if(k==='done'){A.closeSongs();PT.view=null;A.draw()}
 else if(k==='tag')tagPanel();
 else if(k==='music'){A.setView('music')}
 else if(k==='pin'){const l=$('#pinPlace').closest('label'),sh=l.hidden;l.hidden=!sh;if(!sh){$('#pinPlace').value='';const kr=$('#xpKindRow');if(kr)kr.hidden=true}refresh()}
 else if(k==='cap'){if(!PT.cap&&PT.items.length){toast('A time capsule holds words only. Remove the photos first.');return}PT.cap=!PT.cap;$('#capRow').hidden=!PT.cap;A.draw()}
 else if(k==='live'){const l=document.querySelector('[data-a=golive]');if(l)l.click()}
 else if(k==='ins')insert(b.dataset.t);
});
document.addEventListener('change',e=>{
 if(e.target.id==='fbfile'){const f=[...e.target.files];e.target.value='';if(f.length)A.addFiles(f)}
});
document.addEventListener('input',e=>{if(e.target.id==='newText')setTimeout(refresh,0)});
})();

(function(){

try{if(!localStorage.getItem('blend-theme'))root.setAttribute('data-theme','light')}catch(_){root.setAttribute('data-theme','light')}

<script>
/* Comments that everyone can see: replies, @mentions, likes on comments, and a full post view. */
(function(){
const A=()=>window.__BK&&window.__BK.api&&(window.__BK.api.on()||window.__BK.api.guest())?window.__BK.api:null;
const _oc=openComments;
let cur=null,replyTo=null;
const q=s=>document.querySelector(s);
const pidOf=it=>it.doc||it.id;
const own=it=>it&&it.u==='me';
function userKey(a,u){return u===a.uid()?'me':a.pe(u)}
function avFor(a,u){return a.av2(u)}
function handleMap(a){const m={};Object.keys(a.st.users).forEach(u=>{m[(a.st.users[u].h||'').toLowerCase()]=u});return m}
function richText(a,t){
 const hm=handleMap(a);
 return esc(t).replace(/@([a-z0-9_.]{3,20})/gi,(m,h)=>{const u=hm[h.toLowerCase()];return u?`<a class="cxm" data-xp="person" data-u="${a.pe(u)}">@${h}</a>`:m}).replace(/#(\w+)/g,'<span class="tag">#$1</span>')
}
function likeCount(a,cid){return a.st.clikes.filter(x=>x.c===cid).length}
function iLiked(a,cid){return a.st.clikes.some(x=>x.c===cid&&x.u===a.uid())}
function oneComment(a,c,isReply){

/* ---- pick and open ---- */
function chooser(){
 if(!api())return toast('Finish setting up your profile first.');
 openSheet(`<h3>Add to your story</h3><div class="lb"><div class="syopts">
 <button data-sy="vid"><span class="syo">${I('video',26)}</span><span><b>Video</b><small>Up to 1 minute 30 seconds</small></span></button>
 <button data-sy="pic"><span class="syo">${I('image',26)}</span><span><b>Pictures</b><small>One or more, with writing and music</small></span></button>
 <button data-sy="txt"><span class="syo"><b style="font-size:20px">Aa</b></span><span><b>Words</b><small>Write it, pick a font and background</small></span></button>
 </div></div>`);
}
function pick(accept,multi,cb){
 const i=document.createElement('input');i.type='file';i.accept=accept;if(multi)i.multiple=true;i.style.display='none';document.body.appendChild(i);
 i.onchange=()=>{const f=[...i.files];i.remove();if(f.length)cb(f)};i.click();
}
function startVideo(){
 pick('video/*',false,async f=>{
  const file=f[0];
  if(file.size>MAXMB)return toast('That video is over 50 MB. Choose a shorter one.');
  const url=URL.createObjectURL(file),v=document.createElement('video');v.preload='metadata';
  v.onloadedmetadata=()=>{
   if(isFinite(v.duration)&&v.duration>MAXV+.5){URL.revokeObjectURL(url);return toast('Story videos can be up to 1 minute 30 seconds. Choose a shorter one.')}
   openEditor([{k:'video',blob:file,url,ov:[],mute:false}])
  };
  v.onerror=()=>{URL.revokeObjectURL(url);openEditor([{k:'video',blob:file,url,ov:[],mute:false}])};
  v.src=url;
 });
}
function startPics(){pick('image/*',true,f=>{openEditor(f.slice(0,10).map(file=>({k:'image',blob:file,url:URL.createObjectURL(file),ov:[]})))})}
function startText(){openEditor([{k:'text',text:'',bg:BGS[7],font:FONTS[0][1],ov:[]}])}

/* ---- editor ---- */
function openEditor(slides){
 if(typeof closeSheet==='function')closeSheet();
 SY={slides,i:0,music:null,sel:null,panel:null,busy:false};
 let el=$('#syed');if(!el){el=document.createElement('div');el.id='syed';el.className='syed';el.setAttribute('role','dialog');el.setAttribute('aria-label','Create a story');$('#app').appendChild(el)}
 el.hidden=false;ed();
}
function closeEditor(){
 mstop();if(SY)SY.slides.forEach(s=>{if(s.url)try{URL.revokeObjectURL(s.url)}catch(e){}});
 SY=null;const el=$('#syed');if(el){el.hidden=true;el.innerHTML=''}
}
function ovHTML(o,edit){return `<div class="syov ${edit&&SY.sel===o.id?'sel':''}" data-oid="${o.id}" style="left:${o.x}%;top:${o.y}%;color:${o.c};font-family:${o.f};font-size:calc(var(--u,4px)*${o.s})">${esc(o.t)}</div>`}
function inner(s,edit){
 if(s.k==='image')return `<img class="symed" src="${esc(s.url)}" alt="">`;
 if(s.k==='video')return edit?`<video class="symed" src="${esc(s.url)}" autoplay muted loop playsinline></video>`:'';
 return edit?`<textarea class="syta" id="syta" maxlength="300" placeholder="Type your story" style="font-family:${s.font}" aria-label="Story text">${esc(s.text||'')}</textarea>`:'';
}
function setU(){const st=$('#sySt');if(st)st.style.setProperty('--u',(st.clientWidth/100)+'px')}
function ed(){
 const el=$('#syed');if(!el||!SY)return;
 const s=SY.slides[SY.i],o=SY.panel==='text'&&SY.sel?s.ov.find(x=>x.id===SY.sel):null;
 const strip=SY.slides.length>1||s.k==='image'?`<div class="systrip">${SY.slides.map((x,k)=>`<button class="${k===SY.i?'on':''}" data-sy="go" data-k="${k}" aria-label="Picture ${k+1}"><img src="${esc(x.url)}" alt=""></button>`).join('')}${SY.slides.length<10&&s.k==='image'?`<button class="add" data-sy="more" aria-label="Add more pictures">${I('plus',20)}</button>`:''}${SY.slides.length>1?`<button class="rm" data-sy="rmslide" aria-label="Remove this picture">${I('trash',18)}</button>`:''}</div>`:'';
 let panel='';
 if(SY.panel==='text'){
  panel=`<div class="sypanel"><input id="syti" maxlength="80" placeholder="Type something" value="${o?esc(o.t):''}" aria-label="Text over the story"><div class="sycols">${COLS.map(c=>`<button style="background:${c}" data-sy="ocol" data-c="${c}" aria-label="Colour" ${o&&o.c===c?'aria-pressed="true"':''}></button>`).join('')}</div><div class="syfonts">${FONTS.map(([n,f])=>`<button style="font-family:${f}" data-sy="ofont" data-f="${esc(f)}" ${o&&o.f===f?'aria-pressed="true"':''}>${n}</button>`).join('')}</div><label class="syrange"><span>Size</span><input type="range" id="syos" min="4" max="14" value="${o?o.s:7}"></label><div class="syrow"><button class="mkbtn ghost" data-sy="orm">Remove</button><button class="mkbtn" data-sy="odone">Done</button></div></div>`;
 }else if(SY.panel==='music'){
  const TR=window.__PS?__PS.TR:{};
  panel=`<div class="sypanel"><b class="syh">Background music</b><div class="symus"><button data-sy="mus" data-id="" ${!SY.music?'aria-pressed="true"':''}>No music</button>${Object.keys(TR).map(id=>`<button data-sy="mus" data-id="${id}" ${SY.music&&SY.music.k==='s'&&SY.music.id===id?'aria-pressed="true"':''}>♪ ${esc(TR[id].n)}</button>`).join('')}<button data-sy="musfile" ${SY.music&&SY.music.k==='f'?'aria-pressed="true"':''}>From my device${SY.music&&SY.music.k==='f'?': '+esc(SY.music.name):''}</button></div><div class="syrow"><button class="mkbtn" data-sy="pdone" style="flex:1">Done</button></div></div>`;
 }else if(s.k==='text'){
  panel=`<div class="sypanel"><div class="sycols bgs">${BGS.map(b=>`<button style="background:${b}" data-sy="bg" data-b="${esc(b)}" aria-label="Background" ${s.bg===b?'aria-pressed="true"':''}></button>`).join('')}</div><div class="syfonts">${FONTS.map(([n,f])=>`<button style="font-family:${f}" data-sy="tfont" data-f="${esc(f)}" ${s.font===f?'aria-pressed="true"':''}>${n}</button>`).join('')}</div></div>`;
 }
 el.innerHTML=`<div class="sytop"><button class="ib" data-sy="close" aria-label="Close">${I('close')}</button><b>New story</b><button class="mkbtn" data-sy="share" id="syshare">${SY.busy?'Sharing…':'Share'}</button></div>
 <div class="sywrap"><div class="sy-stage" id="sySt" style="${s.k==='text'?'background:'+s.bg:''}">${inner(s,true)}${s.ov.map(x=>ovHTML(x,true)).join('')}</div></div>
 ${strip}${panel}
 <div class="sytools"><button data-sy="addtext"><b>Aa</b><small>Text</small></button><button data-sy="music"><b>♪</b><small>${SY.music?esc(SY.music.name).slice(0,12):'Music'}</small></button>${s.k==='video'?`<button data-sy="mute"><b>${s.mute?'🔇':'🔊'}</b><small>${s.mute?'Muted':'Sound'}</small></button>`:''}</div>`;
 setU();
 const ta=$('#syta');if(ta)ta.addEventListener('input',()=>{s.text=ta.value});
}
function shrinkImg(file,max){
 return new Promise(res=>{
  if(!/^image\/(jpeg|png|webp)$/.test(file.type))return res(file);
  const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b?new File([b],'s.jpg',{type:'image/jpeg'}):file),'image/jpeg',.86)};
  im.onerror=()=>{URL.revokeObjectURL(u);res(file)};im.src=u});
}
async function share(){
 const a=api();if(!a||!SY||SY.busy)return;
 if(SY.slides.some(s=>s.k==='text'&&!(s.text||'').trim()))return toast('Write something first.');
 if(!window.__SB||!__SB.upload)return toast('Sharing is not available here.');
 SY.busy=true;ed();
 try{
  const out=[];
  for(const s of SY.slides){
   const ov=s.ov.map(x=>({t:x.t.slice(0,80),x:+x.x.toFixed(1),y:+x.y.toFixed(1),c:x.c,f:x.f,s:x.s}));
   if(s.k==='text')out.push({k:'text',text:s.text.trim().slice(0,300),bg:s.bg,font:s.font,ov});
   else{const f=s.k==='image'?await shrinkImg(s.blob,1080):s.blob;const u=await __SB.upload(f,'story');out.push({k:s.k,u,ov,mute:!!s.mute})}
  }
  let music=null;
  if(SY.music){if(SY.music.k==='s')music={k:'s',id:SY.music.id,name:SY.music.name};else music={k:'f',url:await __SB.upload(SY.music.file,'story'),name:SY.music.name}}
  await a.col('stories').add({uid:a.uid(),slides:out,music,ts:a.now()});
  closeEditor();toast('Story shared');
  if(window.__BK&&__BK.storySync)__BK.storySync();
 }catch(e){if(SY){SY.busy=false;ed()}toast('Could not share: '+((e&&(e.message||e.error))||'unknown error').toString().slice(0,90))}
}

/* ---- viewer ---- */
const _os=openStory;
function ago(ts){const m=Math.max(1,Math.round((Date.now()-ts)/60000));return m<60?m+'m':Math.round(m/60)+'h'}
function slideHTML(s){
 if(s.k==='image')return `<img class="symed" src="${esc(s.u)}" alt="">`;
 if(s.k==='video')return `<video class="symed" id="syvid" src="${esc(s.u)}" autoplay playsinline ${s.mute?'muted':''}></video>`;
 return `<div class="sytxt" style="font-family:${s.font}">${esc(s.text||'')}</div>`;
}
function openReal(i,j){
 const el=$('#story'),g=STORIES[i];
 if(!g||!g.slides||!g.slides[j]){openStory(i+1);return}
 const s=g.slides[j];
 S.story=i;clearTimeout(S.timer);
 el.hidden=false;
 const own=g.u==='me';
 el.innerHTML=`<div class="sywrap sv"><div class="sy-stage" id="syv" style="${s.k==='text'?'background:'+s.bg:''}">${slideHTML(s)}${(s.ov||[]).map(x=>ovHTML(x,false)).join('')}</div></div>
 <div class="sbars">${g.slides.map((_,k)=>`<i class="${k<j?'done':k===j?'cur':''}"><b ${k===j?'id="sybar"':''}></b></i>`).join('')}</div>
 <div class="shead">${av(g.u,36)}<b>${esc(P[g.u]?P[g.u].h:'')}</b><small style="opacity:.8">${ago(s.ts||Date.now())}</small>${own?`<button class="ib" data-sy="del" data-doc="${esc(s.doc||'')}" aria-label="Delete this story">${I('trash')}</button>`:''}<button class="ib" data-a="storyclose" aria-label="Close">${I('close')}</button></div>
 <div class="szones"><button style="width:33%" data-sy="vprev" data-i="${i}" data-j="${j}" aria-label="Previous"></button><button style="width:67%" data-sy="vnext" data-i="${i}" data-j="${j}" aria-label="Next"></button></div>`;
 const st=$('#syv');if(st)st.style.setProperty('--u',(st.clientWidth/100)+'px');
 const bar=$('#sybar'),go=()=>{if(S.story===i)openReal(i,j+1)};
 const key=s.music?(s.music.k+(s.music.id||s.music.url||'')):'';
 if(key!==SY_KEY){SY_KEY=key;mstart(s.music,'story')}
 if(s.k==='video'){
  const v=$('#syvid');
  if(bar)bar.style.animationDuration='20s';
  if(v){v.onloadedmetadata=()=>{if(bar)bar.style.animationDuration=Math.min(MAXV,v.duration||20)+'s'};v.onended=go;v.play&&v.play().catch(()=>{});S.timer=setTimeout(go,(MAXV+2)*1000)}
 }else{if(bar)bar.style.animationDuration='5s';S.timer=setTimeout(go,5000)}
}
let SY_KEY='';
openStory=function(i){
 clearTimeout(S.timer);
 const g=STORIES[i];
 if(i>=0&&g&&g.real){openReal(i,0);return}
 if(i<0||!g){SY_KEY='';mstop()}else{if(SY_KEY){SY_KEY='';mstop()}}
 _os(i);
};

/* ---- events ---- */
document.addEventListener('click',e=>{
 const pl=e.target.closest('.stories .story[data-a=create]');
 if(pl){e.preventDefault();e.stopImmediatePropagation();chooser();return}
 const b=e.target.closest('[data-sy]');if(!b)return;
 const k=b.dataset.sy;
 if(k==='vid'){closeSheet();startVideo();return}
 if(k==='pic'){closeSheet();startPics();return}
 if(k==='txt'){closeSheet();startText();return}
 if(k==='vnext'){openReal(+b.dataset.i,+b.dataset.j+1);return}
 if(k==='vprev'){const i=+b.dataset.i,j=+b.dataset.j;if(j>0)openReal(i,j-1);else if(i>0)openStory(i-1);else openReal(i,0);return}
 if(k==='del'){
  if(!confirm('Delete this part of your story?'))return;
  const a=api(),id=b.dataset.doc;if(a&&id){a.guard(()=>a.col('stories').doc(id).delete()).then(()=>{toast('Story deleted');openStory(-1)})}
  return;
 }
 if(!SY)return;
 const s=SY.slides[SY.i];
 if(k==='close'){if(!SY.busy)closeEditor()}
 else if(k==='share')share();
 else if(k==='go'){SY.i=+b.dataset.k;SY.sel=null;SY.panel=null;ed()}
 else if(k==='more'){pick('image/*',true,f=>{f.slice(0,10-SY.slides.length).forEach(file=>SY.slides.push({k:'image',blob:file,url:URL.createObjectURL(file),ov:[]}));SY.i=SY.slides.length-1;ed()})}
 else if(k==='rmslide'){try{URL.revokeObjectURL(s.url)}catch(e){}SY.slides.splice(SY.i,1);SY.i=Math.max(0,SY.i-1);SY.sel=null;ed()}
 else if(k==='addtext'){const o={id:uidn(),t:'Your text',x:50,y:45,c:'#ffffff',f:FONTS[0][1],s:7};s.ov.push(o);SY.sel=o.id;SY.panel='text';ed();const t=$('#syti');if(t){t.focus();t.select()}}
 else if(k==='ocol'){const o=s.ov.find(x=>x.id===SY.sel);if(o){o.c=b.dataset.c;ed()}}
 else if(k==='ofont'){const o=s.ov.find(x=>x.id===SY.sel);if(o){o.f=b.dataset.f;ed()}}
 else if(k==='orm'){s.ov=s.ov.filter(x=>x.id!==SY.sel);SY.sel=null;SY.panel=null;ed()}
 else if(k==='odone'){SY.panel=null;SY.sel=null;ed()}
 else if(k==='bg'){s.bg=b.dataset.b;ed()}
 else if(k==='tfont'){s.font=b.dataset.f;ed()}
 else if(k==='mute'){s.mute=!s.mute;ed()}
 else if(k==='music'){SY.panel='music';SY.sel=null;ed()}
 else if(k==='pdone'){mstop();SY.panel=null;ed()}
 else if(k==='mus'){const id=b.dataset.id;if(!id){SY.music=null;mstop()}else{SY.music={k:'s',id,name:window.__PS.TR[id].n};mstart(SY.music,'sydraft')}ed()}
 else if(k==='musfile'){pick('audio/*',false,f=>{const file=f[0];if(file.size>MAXMB)return toast('That audio file is over 50 MB.');SY.music={k:'f',file,name:(file.name||'My music').replace(/\.[a-z0-9]+$/i,''),blobUrl:URL.createObjectURL(file)};mstart(SY.music,'sydraft');ed()})}
});
document.addEventListener('input',e=>{
 if(!SY)return;
 const s=SY.slides[SY.i];
 if(e.target.id==='syti'){const o=s.ov.find(x=>x.id===SY.sel);if(o){o.t=e.target.value||' ';const n=document.querySelector('.syov[data-oid="'+o.id+'"]');if(n)n.textContent=o.t}}
 else if(e.target.id==='syos'){const o=s.ov.find(x=>x.id===SY.sel);if(o){o.s=+e.target.value;const n=document.querySelector('.syov[data-oid="'+o.id+'"]');if(n)n.style.fontSize='calc(var(--u,4px)*'+o.s+')'}}
});
/* drag text around the picture */
document.addEventListener('pointerdown',e=>{
 const n=e.target.closest('.syov');if(!n||!SY||!$('#syed')||$('#syed').hidden)return;
 const s=SY.slides[SY.i],o=s.ov.find(x=>x.id===n.dataset.oid);if(!o)return;
 const r=$('#sySt').getBoundingClientRect();
 drag={o,n,r,moved:false,sx:e.clientX,sy:e.clientY};try{n.setPointerCapture(e.pointerId)}catch(_){}
 e.preventDefault();
});
document.addEventListener('pointermove',e=>{
 if(!drag)return;
 if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>4)drag.moved=true;
 if(!drag.moved)return;
 drag.o.x=Math.max(5,Math.min(95,(e.clientX-drag.r.left)/drag.r.width*100));
 drag.o.y=Math.max(4,Math.min(94,(e.clientY-drag.r.top)/drag.r.height*100));
 drag.n.style.left=drag.o.x+'%';drag.n.style.top=drag.o.y+'%';
});
document.addEventListener('pointerup',()=>{
 if(!drag)return;const d=drag;drag=null;
 if(!d.moved){SY.sel=d.o.id;SY.panel='text';ed()}
});
window.addEventListener('resize',()=>{setU();const st=$('#syv');if(st)st.style.setProperty('--u',(st.clientWidth/100)+'px')});
window.__SY={open:chooser};
})();

</script>
</body></html>
