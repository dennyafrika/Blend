 else{
  body=`<div class="ptext">${tagify(p.text)}</div>`;
  if(p.type==='group')body=`<div class="grp"><span class="av" style="--c:${(P[p.u].c+120)%360};--s:34px">${p.group[0]}</span><div class="t"><b>${esc(p.group)}</b><small>Group post</small></div><button class="pill ${S.joined.has(p.gid)?'on':''}" data-a="join" data-g="${p.gid}">${S.joined.has(p.gid)?'Joined':'Join'}</button></div>`+body+`<div class="grp" style="margin-top:0"><div class="t"><b>Saturday run · 6:00</b><small>Westcliff stairs · ${S.going.has(p.id)?'You and 23 others are going':'23 going'}</small></div><button class="pill ${S.going.has(p.id)?'on':''}" data-a="going" data-id="${p.id}">${S.going.has(p.id)?'Going':'I\'m going'}</button></div>`;
  else body+=`<div class="art" style="${art(p.c)}">${p.type==='video'?`<button class="playbadge" data-a="${p.vid?'vopen':'vnplay'}" data-id="${p.vid||''}" aria-label="Watch video"><span>${I('play',28)}</span></button><span class="vlen">${p.len}</span><span class="lowb">Audio only</span>`:''}</div>`;
 }
 return `<article class="post ${p.life!==undefined&&p.life<=25?'dim':''}" data-pid="${p.id}"><div class="ph">${av(p.u)}<div class="who"><b>${esc(P[p.u].n)}</b><small>@${esc(P[p.u].h)} · ${p.t} <span class="stamp">${KIND[p.type]||'Post'}</span></small></div>${me?'':`<button class="fbtn" data-a="follow" data-u="${p.u}">${fol?'Following':'Follow'}</button>`}</div>${p.queued?`<div class="why">Queued · sends when you're back online</div>`:''}${p.place?`<div class="why">${I('pin',13)}<span>Pinned to ${esc(p.place)} · only people nearby see this</span></div>`:''}${body}${p.views!==undefined?`<div class="views">${fmt(p.views)} views</div>`:''}${fadeHTML(p)}${actsHTML(p)}${whyHTML(p)}</article>`;
}

/* ----- format switch: read, listen, watch ----- */
const F={id:'',mode:'read',t:0,dur:0,play:false,timer:null,i:0};
function openFormat(id){
 F.id=id;F.mode='read';F.t=0;F.play=false;clearInterval(F.timer);
 openSheet(`<h3>View as</h3><div class="rk" style="justify-content:center">${['read','listen','watch'].map(m=>`<button class="chip" data-a="fmode" data-m="${m}" aria-pressed="${m==='read'}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div><div class="lb fmtbody" id="fmtBody"></div>`);
 renderFmt();
}
function renderFmt(){
 const p=find(F.id),b=$('#fmtBody');if(!b||!p)return;
 clearInterval(F.timer);F.play=false;
 const txt=p.text||p.cap||p.title||'',sn=sentences(txt);
 if(F.mode==='read'){
  b.innerHTML=`<span class="badge">Auto summary · simulated</span><p style="margin-top:10px"><b>In short:</b> ${esc(sn[0]||txt)}</p><p class="q">Full text</p><p>${tagify(txt)}</p>`;
 }else if(F.mode==='listen'){
  F.dur=Math.max(8,Math.round(sn.join(' ').split(/\s+/).length/2.6));F.t=0;
  b.innerHTML=`<span class="badge">Synthetic voice · simulated</span><div class="aud" style="margin-top:10px"><button class="pb" id="fpb" data-a="fplay" aria-label="Play">${I('play',22)}</button><div class="tr"><b>${esc(P[p.u].n)}, read aloud</b><div class="bar"><i id="fbar"></i></div><small><span id="ft">0:00</span><span>${fmtT(F.dur)}</span></small></div></div><p class="q" style="margin-top:12px">Keeps playing while you scroll. Voice and speed controls would live here.</p>`;
 }else{
  const ch=chunks(txt);F.i=0;
  b.innerHTML=`<span class="badge">Auto clip · simulated</span><div class="clipbox" style="${art(p.c||200)}"><span id="clipTxt">${esc(ch[0])}</span></div>`;
  F.timer=setInterval(()=>{F.i=(F.i+1)%ch.length;const e=$('#clipTxt');if(e)e.textContent=ch[F.i]},1600);
 }
}
function fTick(){
 F.t=Math.min(F.dur,F.t+.25);
 const bar=$('#fbar'),ft=$('#ft');if(bar)bar.style.width=(F.t/F.dur*100)+'%';if(ft)ft.textContent=fmtT(F.t);
 if(F.t>=F.dur){clearInterval(F.timer);F.play=false;const pb=$('#fpb');if(pb)pb.innerHTML=I('play',22)}
}

/* ----- mixed-format replies: text, voice, clip ----- */
const R={on:false,sec:0,timer:null,got:0};
const WF=[6,12,8,16,10,14,6,12,18,8,12,6,10,14,8];
function cmText(c){return c.k==='voice'?'Voice note '+fmtT(c.len):c.k==='clip'?'Video reply '+fmtT(c.len):c.t}
function cmItem(c){
 let body;
 if(c.k==='voice')body=`<button class="vn" data-a="vnplay" aria-label="Play voice note"><span class="pp">${I('play',14)}</span><span class="wf">${WF.map(h=>`<i style="height:${h}px"></i>`).join('')}</span><small>${fmtT(c.len)}</small></button>`;
 else if(c.k==='clip')body=`<button class="clipr" style="${art(P[c.u].c)}" data-a="vnplay" aria-label="Play video reply">${I('play',22)}<span class="vlen">${fmtT(c.len)}</span></button>`;
 else body=`<p>${esc(c.t)}</p>`;
 return `<div class="cm">${av(c.u,34)}<div><small>@${esc(P[c.u].h)}${c.queued?' · Waiting to send':''}</small>${body}</div></div>`;
}
function commentsHTML(it){return it.comments.length?it.comments.map(cmItem).join(''):'<div class="empty" style="padding:24px">Be the first to reply.</div>'}
function stopRec(){clearInterval(R.timer);if(R.on){R.on=false;R.got=Math.max(1,R.sec)}}
function openComments(id){
 const it=find(id);S.rk='text';R.on=false;R.got=0;clearInterval(R.timer);
 openSheet(`<h3 id="cmHead">${fmt(it.cc)} replies</h3><div class="lb" id="cmList" style="min-height:120px">${commentsHTML(it)}</div><div id="cmComp" data-id="${id}"></div>`);
 renderComposer();
}
function renderComposer(){
 const el=$('#cmComp');if(!el)return;
 const k=S.rk,rec=k!=='text';let mid;
 if(!rec)mid=`<input id="cmIn" placeholder="Add a reply" autocomplete="off" aria-label="Add a reply">`;
 else if(R.on)mid=`<button type="button" class="rec live" data-a="recstop"><span class="rd"></span>Recording ${fmtT(R.sec)} · tap to stop</button>`;
 else if(R.got)mid=`<button type="button" class="rec" data-a="recstart">${k==='voice'?'Voice note':'Video reply'} ${fmtT(R.got)} ready · record again</button>`;
 else mid=`<button type="button" class="rec" data-a="recstart">${I(k==='voice'?'mic':'play',18)}Tap to record a ${k==='voice'?'voice note':'short clip'}</button>`;
 el.innerHTML=`<div class="rk">${[['text','Text'],['voice','Voice'],['clip','Clip']].map(([a,l])=>`<button class="chip" data-a="rkind" data-k="${a}" aria-pressed="${k===a}">${l}</button>`).join('')}</div><form class="composer" data-a="cform2" data-id="${el.dataset.id}">${av('me',34)}${mid}<button class="send" aria-label="Send reply" ${rec&&(!R.got||R.on)?'disabled':''}>${I('send',18)}</button></form>`;
}

/* ----- create: text, photo, video, capsule, pin to a place ----- */
function openCreate(){
 const ty=[['text','text','Text'],['photo','image','Photo'],['video','play','Video'],['capsule','lock','Capsule']];
 const d1=iso(new Date(Date.now()+864e5)),d30=iso(new Date(Date.now()+30*864e5));
 S.newType='text';
 openSheet(`<h3>New post</h3><div class="lb"><div class="create"><div class="chips">${ty.map(([k,i,l])=>`<button class="chip" data-a="ntype" data-k="${k}" aria-pressed="${S.newType===k}">${I(i,16)}${l}</button>`).join('')}</div>
 <textarea id="newText" placeholder="What's happening?" aria-label="Post text"></textarea>
 <button class="chip" data-a="golive" style="align-self:flex-start">${I('play',16)}Go live instead</button>
 <label class="line" id="capRow" hidden>Unlocks on <input type="date" id="capDate" class="sel" min="${d1}" value="${d30}"></label>
 <label class="line">Pin to a place <select id="pinPlace" class="sel"><option value="">Nowhere</option>${PLACES.map(p=>`<option>${p}</option>`).join('')}</select></label>
 <div class="line"><label>Audience <select id="aud"><option>Everyone</option><option>Friends</option><option>Joburg Runners</option></select></label><button class="go" id="goPost" data-a="post2" disabled>Post</button></div></div></div>`);
 $('#aud').value=S.aud;
 $('#newText').addEventListener('input',e=>{$('#goPost').disabled=!e.target.value.trim()});
 setTimeout(()=>$('#newText')&&$('#newText').focus(),50);
}
function closeSheet(){clearInterval(F.timer);clearInterval(R.timer);R.on=false;$('#scrim').hidden=true;$('#scrim').innerHTML=''}

/* ----- near you (Explore) ----- */
function nearHTML(){
 const kinds=['All','Event','Lost pet','Open now','Tip'];
 const list=NEAR.filter(x=>x.place===S.nearPlace&&(S.nk==='All'||x.kind===S.nk));
 return `<div class="sec"><h3>Near you</h3><select class="place" id="nbPlace" aria-label="Your area">${PLACES.map(p=>`<option ${p===S.nearPlace?'selected':''}>${p}</option>`).join('')}</select><div class="cats" style="padding:0 0 8px;border:0">${kinds.map(k=>`<button class="chip" data-a="nbkind" data-k="${k}" aria-pressed="${S.nk===k}">${k}</button>`).join('')}</div>${list.length?list.map(x=>`<div class="nb">${av(x.u,40)}<div class="t"><div><span class="badge ${x.kind==='Open now'?'live':''}">${x.kind}</span> <span class="q">${x.dist} away</span></div><b>${esc(x.title)}</b><span class="q">${esc(x.text)}<br>${esc(x.t)}</span></div></div>`).join(''):'<div class="empty" style="padding:20px">Nothing pinned here yet.</div>'}<p class="q">Prototype: pick an area to simulate where you are. Pinned posts only show to people nearby.</p></div>`;
}
const _renderExploreBase=renderExplore;
renderExplore=function(){_renderExploreBase();if(!S.q.trim())$('#exploreBody').insertAdjacentHTML('afterbegin',nearHTML())};

/* ----- events for the new features ----- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.tagName==='FORM')return;
 const a=b.dataset.a,id=b.dataset.id;
 if(a==='like'){const p=POSTS.find(x=>x.id===id);if(p&&p.life!==undefined&&S.liked.has(id)){p.life=Math.min(100,p.life+15);repaint(id)}}
 else if(a==='repost'){const p=POSTS.find(x=>x.id===id);if(p&&p.life!==undefined&&S.rep.has(id)){p.life=Math.min(100,p.life+20);repaint(id)}}
 else if(a==='revive'){const p=POSTS.find(x=>x.id===id);p.life=Math.min(100,p.life+30);toast('Revived. It stays visible longer');repaint(id)}
 else if(a==='recipe')openRecipe();
 else if(a==='rsel'){S.recipe={...S.recipes[+b.dataset.i]};openRecipe();renderHome()}
 else if(a==='rorder'){S.recipe.order=b.dataset.o;S.recipe.name='Custom';openRecipe();renderHome()}
 else if(a==='rsave'){
  const nm=$('#rname').value.trim()||'My recipe';S.recipe.name=nm;
  const i=S.recipes.findIndex(x=>x.name===nm),rc={...S.recipe,by:'You'};
  i>=0?S.recipes[i]=rc:S.recipes.push(rc);openRecipe();renderHome();toast('Recipe saved');
 }
 else if(a==='rshare'){
  const link='https://blend.example/recipe/'+encodeURIComponent(S.recipe.name.toLowerCase().replace(/\s+/g,'-'));
  try{navigator.clipboard.writeText(link).then(()=>toast('Recipe link copied'),()=>toast('Copy not available here'))}catch(_){toast('Copy not available here')}
 }
 else if(a==='tb'){S.tb?finishTB():openTB()}
 else if(a==='tbgo'){startTB(+b.dataset.m);closeSheet();if(!$('#panel').hidden)closePanel();setTab('home');$('#homeScroll').scrollTop=0}
 else if(a==='tbdone')finishTB();
 else if(a==='net')openNet();
 else if(a==='setnet')setNet(b.dataset.k);
 else if(a==='fmt')openFormat(id);
 else if(a==='fmode'){F.mode=b.dataset.m;document.querySelectorAll('#scrim .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.m===F.mode));renderFmt()}
 else if(a==='fplay'){
  F.play=!F.play;clearInterval(F.timer);
  if(F.play){if(F.t>=F.dur)F.t=0;F.timer=setInterval(fTick,250)}
  $('#fpb').innerHTML=I(F.play?'close':'play',22);
 }
 else if(a==='cnote'){
  const p=POSTS.find(x=>x.id===id);
  openSheet(`<h3>Add a sealed note</h3><div class="lb"><div class="create"><p class="q">Nobody can read it until ${dateStr(p.unlock)}, including you.</p><textarea id="noteText" placeholder="Write something for the future" aria-label="Sealed note" style="width:100%;min-height:100px;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px"></textarea><div class="line"><span></span><button class="go" id="goNote" data-a="cnotego" data-id="${id}" disabled>Seal note</button></div></div></div>`);
 }
 else if(a==='cnotego'){const p=POSTS.find(x=>x.id===id);p.notes++;closeSheet();repaint(id);toast('Sealed until '+dateStr(p.unlock))}
 else if(a==='copen'){POSTS.find(x=>x.id===id).opened=true;repaint(id)}
 else if(a==='rkind'){stopRec();R.got=0;S.rk=b.dataset.k;renderComposer()}
 else if(a==='recstart'){
  clearInterval(R.timer);R.on=true;R.sec=0;R.got=0;
  R.timer=setInterval(()=>{R.sec++;if(R.sec>=60){stopRec()}renderComposer()},1000);renderComposer();
 }
 else if(a==='recstop'){stopRec();renderComposer()}
 else if(a==='vnplay')toast('Playing (simulated)');
 else if(a==='nbkind'){S.nk=b.dataset.k;renderExplore()}
 else if(a==='post2'){
  const txt=$('#newText').value.trim();if(!txt)return;
  const ty=S.newType;let unlock;
  if(ty==='capsule'){unlock=new Date($('#capDate').value+'T00:00:00').getTime();if(!(unlock>Date.now())){toast('Pick a date in the future');return}}
  S.aud=$('#aud').value;
  const post={id:'n'+Date.now(),u:'me',type:ty,t:'now',text:txt,c:Math.floor(Math.random()*360),len:'0:12',likes:0,cc:0,rp:0,life:100,comments:[]};
  if(ty==='text')post.views=0;
  if(ty==='capsule'){post.unlock=unlock;post.notes=0;post.teaser='Sealed capsule from you.'}
  const pl=$('#pinPlace').value;
  if(pl){post.place=pl;NEAR.unshift({id:'m'+Date.now(),place:pl,kind:'Tip',u:'me',title:txt.slice(0,60),text:'Pinned by you',dist:'0 m',t:'Just now'})}
  if(S.net==='offline'){post.queued=true;S.outbox.push(post)}
  POSTS.unshift(post);closeSheet();setTab('home');$('#homeScroll').scrollTop=0;renderBars();
  toast(S.net==='offline'?'Saved. Sends when you reconnect':ty==='capsule'?'Capsule sealed until '+dateStr(unlock):'Posted to '+S.aud);
 }
});
document.addEventListener('ntype-sync',()=>{});
document.addEventListener('click',e=>{
 if(e.target.closest('[data-a="ntype"]')){const r=$('#capRow');if(r)r.hidden=S.newType!=='capsule'}
});
document.addEventListener('submit',e=>{
 const f=e.target.closest('[data-a="cform2"]');if(!f)return;e.preventDefault();
 const it=find(f.dataset.id),k=S.rk;let c;
 if(k==='text'){const v=$('#cmIn').value.trim();if(!v)return;c={u:'me',k:'text',t:v}}
 else{if(!R.got||R.on)return;c={u:'me',k,len:R.got};R.got=0}
 if(S.net==='offline'){c.queued=true;S.outbox.push(c);toast('Saved. Sends when you\'re back online')}
 it.comments.push(c);it.cc++;if(it.life!==undefined)it.life=Math.min(100,it.life+15);
 $('#cmList').innerHTML=commentsHTML(it);$('#cmList').scrollTop=1e5;$('#cmHead').textContent=fmt(it.cc)+' replies';
 renderComposer();repaint(it.id);renderBars();
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.r){S.recipe[t.dataset.r]=+t.value;S.recipe.name='Custom';$('#rv-'+t.dataset.r).textContent=lvl(+t.value);renderHome()}
 if(t.id==='noteText')$('#goNote').disabled=!t.value.trim();
});
document.addEventListener('change',e=>{if(e.target.id==='nbPlace'){S.nearPlace=e.target.value;renderExplore()}});

renderBars();setTab('home');

document.addEventListener('click',e=>{

  if(L.host)openSheet(`<h3>End your live?</h3><div class="create"><p class="q" style="text-align:center">Your viewers will be disconnected.</p><div class="line"><button class="chip" data-a="closeSheet">Keep going</button><button class="go" data-a="endlive">End live</button></div></div>`);

 }
 else if(a==='closeSheet')closeSheet();
 else if(a==='endlive')endLive();

 else if(a==='buycoins'){S.coins+=+b.dataset.n;const c=$('#cb2');if(c)c.textContent=S.coins;toast('+'+b.dataset.n+' coins (simulated)')}
 else if(a==='sendgift'){
  const g=GIFTS.find(x=>x.id===b.dataset.g);
  if(S.coins<g.p){toast('Not enough coins');openCoins();return}
  S.coins-=g.p;L.raised+=g.p;L.tops.You=(L.tops.You||0)+g.p;
  const now=Date.now();if(L.last&&L.last.g===g.id&&now-L.last.t<3500)L.last.n++;else L.last={g:g.id,n:1};L.last.t=now;

 }

 else if(a==='tops')openTops();

});

<script>
/* theme switch: light (black on white) / dark (white on black) */
(function(){
 const root=document.documentElement,sw=document.getElementById('themeSw');
 if(!sw)return;
 const sys=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
 const isDark=()=>{const t=root.getAttribute('data-theme');return t?t==='dark':!!(sys&&sys.matches)};
 const paint=()=>sw.setAttribute('aria-checked',String(isDark()));
 try{const v=localStorage.getItem('blend-theme');if(v==='dark'||v==='light')root.setAttribute('data-theme',v)}catch(_){}
 paint();
 sw.addEventListener('click',()=>{
  const next=isDark()?'light':'dark';root.setAttribute('data-theme',next);
  try{localStorage.setItem('blend-theme',next)}catch(_){}
  paint();
 });
 if(sys&&sys.addEventListener)sys.addEventListener('change',paint);
})();
</script>

 const act=`<div class="dmsec">Active now</div><div class="dmstrip">${[...ONLINE].map(u=>{const lv=liveBy(u);return `<button class="dmn" data-d="${lv?'golive':'actnow'}" data-u="${u}" ${lv?`data-l="${lv.id}"`:''} aria-label="${first(u)}${lv?', live now':', active now'}">${`<span class="dmav ring"><span class="in">${av(u,48)}</span>${lv?'<i class="dmlive">LIVE</i>':'<i class="dmon"></i>'}</span>`}<span class="nm">${first(u)}</span></button>`}).join('')}</div>`;
 const cnt=k=>TH.filter(t=>!t.arch&&(k==='primary'?t.type==='dm'&&!t.req:k==='groups'?t.type==='group':t.req)&&t.unread).length;
 const tabs=`<div class="dmtabs" role="tablist">${[['primary','Primary'],['groups','Groups'],['req','Requests']].map(([k,l])=>`<button role="tab" data-d="tab" data-k="${k}" aria-selected="${D.tab===k}">${l}${cnt(k)?`<span class="dmcount">${cnt(k)}</span>`:''}</button>`).join('')}</div>`;
 let list=TH.filter(t=>D.arch?t.arch:!t.arch&&(D.tab==='primary'?t.type==='dm'&&!t.req:D.tab==='groups'?t.type==='group':t.req));
 if(q)list=TH.filter(t=>!t.arch&&(nameOf(t).toLowerCase().includes(q)||t.msgs.some(m=>(m.text||'').toLowerCase().includes(q))));
 list.sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.ord-a.ord);
 let rows;
 if(!list.length)rows=`<div class="dmempty">${q?'Nothing found for “'+esc(D.q)+'”.':D.arch?'No archived chats.':D.tab==='req'?'No message requests.':'No chats here yet.'}</div>`;
 else if(D.tab==='req'&&!q&&!D.arch)rows=list.map(t=>`<div class="dmreqrow"><div class="dmfg" style="cursor:default">${avatarFor(t)}<span class="t"><b>${esc(nameOf(t))}</b><span class="pv">${esc(pv(lastM(t)))}</span></span></div><div class="dmreq"><button data-d="decline" data-id="${t.id}">Decline</button><button class="p" data-d="accept" data-id="${t.id}">Accept</button></div></div>`).join('');
 else rows=list.map(rowHTML).join('');
 const na=TH.filter(t=>t.arch).length;
 w.innerHTML=(q?'':strip+act)+(q?'':tabs)+(q?'<div class="dmsec">Results</div>':'')+(q||D.tab!=='req'&&!D.arch?`<div class="dmhint">Swipe a chat left for pin, mute and archive. Press and hold for more.</div>`:'')+rows+
  (D.arch?`<button class="dmlink" data-d="arch-toggle">Back to chats</button>`:na?`<button class="dmlink" data-d="arch-toggle">Archived chats (${na})</button>`:'');
 setDot();
}

/* ---------- chat ---------- */
function canCall(t,k){
 if(S.net==='offline')return 'You are offline. Calls need a connection.';
 if(k==='video'&&!D.set.video)return 'Video calls are turned off in your settings.';
 if(k==='voice'&&!D.set.voice)return 'Voice calls are turned off in your settings.';
 if(t.type==='dm'){const u=t.u[0];if(!FR.has(u))return 'Calls are only for friends. Accept '+first(u)+' as a friend first.';if(D.blocked.has(u))return 'You blocked calls with '+first(u)+'.'}
 return '';
}
function openDM(i){
 const t=get(i);if(!t)return;
 if(t.req){toast('Accept the request to open this chat');return}
 D.cur=t.id;D.view='chat';D.sel=null;t.unread=0;
 const off=k=>canCall(t,k)?'off':'';
 const sub=t.type==='group'?t.u.map(first).join(', ')+' and you':ONLINE.has(t.u[0])?'Active now':'Last seen today';
 put(`<div class="dmhead"><button class="ib" data-d="back" aria-label="Back">${I('back')}</button><button class="who" data-d="chatmenu" aria-label="Chat options">${avatarFor(t,40)}<span style="min-width:0"><b>${esc(nameOf(t))}</b><small id="dmstat">${sub}</small></span></button>
 <button class="ib ${off('voice')}" data-d="call" data-k="voice" aria-label="Voice call">${I('phone')}</button><button class="ib ${off('video')}" data-d="call" data-k="video" aria-label="Video call">${I('video')}</button></div>
 <div class="dm"><div class="dmsub" id="dmsub"></div><div class="dmlist" id="dmlist"></div><div class="dmsched" id="dmsched"></div>
 <div class="dmcomp"><div id="dmreply"></div><div id="dmcomp"></div></div></div>`);
 renderComp();renderMsgs(true);renderSub();renderSched();setDot();
}
function renderSub(){
 const t=get(D.cur),s=$('#dmsub');if(!t||!s)return;
 const bits=[];
 if(t.fade&&t.fade!=='off')bits.push(`<span class="dmpill">${I('timer',14)}Disappearing: ${t.fade==='10'?'10 sec':'24 hours'}</span>`);
 if(S.net==='offline')bits.push(`<span class="dmnote">Offline. Messages send when you reconnect.</span>`);
 if(t.type==='dm'&&D.blocked.has(t.u[0]))bits.push(`<span class="dmnote">Calls with ${first(t.u[0])} are blocked.</span>`);
 s.innerHTML=bits.join('');
 const st=$('#dmstat');if(st&&t.typing)st.textContent='typing…';else if(st&&t.type==='dm')st.textContent=ONLINE.has(t.u[0])?'Active now':'Last seen today';
}
function renderSched(){
 const el=$('#dmsched');if(!el)return;
 el.innerHTML=D.sched.filter(s=>s.th===D.cur).map(s=>`<div class="sd">${I('clock',14)}<span>Scheduled · ${esc(s.props.type==='cap'?'Capsule':'Message')}: ${esc(s.props.text)} · ${s.label}</span><button data-d="unsched" data-id="${s.id}">Cancel</button></div>`).join('');
}
function renderComp(){
 const t=get(D.cur),c=$('#dmcomp');if(!c||!t)return;
 if(D.rec){c.innerHTML=`<div class="dmform"><button class="dmib" data-d="reccancel" aria-label="Cancel recording">${I('trash')}</button><div class="dmrec"><span class="rd"></span><span id="rect">0:00</span>${D.rec.kind==='clip'?'Video reply':'Voice note'}</div><button class="dmib fill" data-d="recsend" aria-label="Send recording">${I('send',18)}</button></div>`;return}
 const old=$('#dmin');const v=old?old.value:'';
 c.innerHTML=`<form class="dmform ${v?'has-text':''}" id="dmform"><button type="button" class="dmib" data-d="attach" aria-label="More">${I('plus')}</button><input class="dmin" id="dmin" placeholder="Message" autocomplete="off" aria-label="Message" value="${esc(v)}"><button type="button" class="dmib dmmic" data-d="mic" aria-label="Voice note">${I('mic')}</button><button type="button" class="dmib dmcam" data-d="cam" aria-label="Video reply">${I('camera')}</button><button class="dmib fill dmsend" aria-label="Send">${I('send',18)}</button></form>`;
 renderReply();
}
function renderReply(){
 const r=$('#dmreply');if(!r)return;
 r.innerHTML=D.reply?`<div class="dmreply"><span>Replying to ${esc(D.reply.who)}: ${esc(D.reply.text)}</span><button class="ib" data-d="unreply" aria-label="Cancel reply">${I('close',16)}</button></div>`:'';
}
function wave(m){const n=26,h=hash(m.id);const prog=m.pl?Math.min(1,(Date.now()-m.pl)/(m.dur*250)):0;let s='';for(let k=0;k<n;k++){const hh=4+((h>>(k%20))+k*7)%16;s+=`<i class="${k/n<prog?'on':''}" style="height:${hh}px"></i>`}return s}
function msgHTML(t,m,i){
 const me=m.from==='me',p=t.msgs[i-1],nx=t.msgs[i+1];
 if(m.type==='sys')return `<div class="msys">${esc(m.text)}</div>`;
 const gap=!p||p.from!==m.from||p.type==='sys'?' gap':'';
 const q=m.reply&&t.msgs.find(x=>x.id===m.reply);
 const qh=q?`<span class="mq">${esc(q.from==='me'?'You':first(q.from))}: ${esc(prev(q))}</span>`:m.rq?`<span class="mq">${esc(m.rq)}</span>`:'';
 let h='',cls='';
 const ref=m.ref&&find(m.ref);
 switch(m.type){
 case 'text':h=qh+esc(m.text)+(m.showTr&&m.en?`<span class="mtr">${esc(m.en)} · translated from ${m.lang}</span>`:'');break;
 case 'voice':h=qh+`<div class="dmvn" data-d="play" data-id="${m.id}"><span class="pp">${I(m.pl&&Date.now()-m.pl<m.dur*250?'pause':'play',14)}</span><span class="wf">${wave(m)}</span><small>${fmtT(m.dur)}</small></div>`;break;
 case 'clip':cls='bare';h=`<button class="mclip" style="${art(m.c||200)}" data-d="viewclip" data-id="${m.id}" aria-label="Play video reply">${I('play',34)}<small style="position:absolute;left:8px;bottom:6px;font-family:var(--font-mono);font-size:11px">${fmtT(m.dur)} · video reply</small></button>`;break;
 case 'photo':cls='bare';h=`<div class="mphoto" style="${art(m.c||90)};filter:grayscale(1)" role="img" aria-label="Photo"></div>`;break;
 case 'once':h=me?`<div class="monce">${I('once',20)}Photo · view once<br></div><span class="mgrey" style="margin-top:4px">${m.seen?'Opened':'Delivered'}</span>`:m.seen?`<div class="mgrey">${I('once',18)}Opened</div>`:`<button class="monce" data-d="viewonce" data-id="${m.id}">${I('once',20)}Tap to view once</button>`;break;
 case 'share':cls='card mshare';h=`<span class="th" style="${art(ref?(ref.c||200):200)}"></span><span class="bd"><b>${esc(ref?(ref.title||ref.text||ref.cap||'Post'):'Shared item')}</b><small>@${esc(ref?P[ref.u].h:'blend')} · ${ref&&ref.id[0]==='v'?'Video':ref&&ref.id[0]==='r'?'Clip':'Post'}</small></span>`;break;
 case 'story':cls='card msr';h=`<span class="th" style="${art(m.c||200)}"></span><span class="bd"><small>${me?'You replied':first(m.from)+' replied'} to ${me?first(t.u[0])+'\'s':'your'} story</small>${esc(m.text)}</span>`;break;
 case 'gift':cls='card';h=`<div class="mgift">${giftSVG(m.g,56)}<b>${me?'You sent':first(m.from)+' sent'} a ${GIFTS.find(g=>g.id===m.g).n}</b><small>${GIFTS.find(g=>g.id===m.g).p} coin${GIFTS.find(g=>g.id===m.g).p>1?'s':''}</small></div>`;break;
 case 'poll':{cls='card';const tot=m.opts.reduce((a,o)=>a+o.v.length,0);h=`<div class="mpoll"><h4>${esc(m.q)}</h4>${m.opts.map((o,k)=>{const pc=tot?Math.round(o.v.length/tot*100):0;return `<button class="popt ${o.v.includes('me')?'mine':''}" data-d="vote" data-id="${m.id}" data-o="${k}"><i style="width:${pc}%"></i><span>${esc(o.t)}<b>${pc}%</b></span></button>`}).join('')}<small>${tot} vote${tot===1?'':'s'}</small></div>`;break}
 case 'evt':{cls='card';const c=k=>m.rsvp[k].length;h=`<div class="mevt"><span class="when">${esc(m.when)}</span><b>${esc(m.title)}</b><small>${esc(m.where)}</small><div class="rsvp">${[['go','Going'],['maybe','Maybe'],['no','Can\'t']].map(([k,l])=>`<button class="${m.rsvp[k].includes('me')?'mine':''}" data-d="rsvp" data-id="${m.id}" data-k="${k}">${l}<small>${c(k)}</small></button>`).join('')}</div></div>`;break}
 case 'cap':{cls='card';const lock=m.unlock===null||Date.now()<m.unlock;h=lock?`<div class="mcap"><span class="lk">${I('lock',20)}</span><b>Time capsule</b><small>${esc(m.label)}</small>${me?'':`<button class="cbtn2" data-d="peek" data-id="${m.id}">Open early (demo)</button>`}</div>`:`<div class="mcap"><span class="lk">${I('check',20)}</span><b>Capsule opened</b><span>${esc(m.text)}</span></div>`;break}
 case 'call':{cls='card';const kd=m.kind==='video'?'Video':'Voice';h=`<div class="mcall"><span class="ic ${m.missed||m.blocked?'miss':''}">${I(m.kind==='video'?'video':'phone',18)}</span><span><b>${m.blocked?'Blocked '+kd.toLowerCase()+' call':m.missed==='cancelled'?'Cancelled '+kd.toLowerCase()+' call':m.missed?'Missed '+kd.toLowerCase()+' call':kd+' call'}</b><small>${m.blocked?'Blocked by your settings':m.missed?m.t:fmtT(m.dur)}</small></span>${m.blocked?'':`<button data-d="call" data-k="${m.kind}">Call back</button>`}</div>`;break}
 default:h=esc(m.text||'')}
 const sel=D.sel===m.id;
 const last=!nx||nx.from!==m.from;
 const rx=m.rx&&Object.keys(m.rx).length?`<div class="mx">${Object.entries(m.rx).map(([e,u])=>`<button class="${u.includes('me')?'mine':''}" data-d="react" data-id="${m.id}" data-e="${e}">${e} ${u.length}</button>`).join('')}</div>`:'';
 const acts=sel?`<div class="emo">${EMO.map(e=>`<button data-d="react" data-id="${m.id}" data-e="${e}" aria-label="React ${e}">${e}</button>`).join('')}</div><div class="macts"><button data-d="doreply" data-id="${m.id}">${I('reply',15)}Reply</button>${m.lang&&D.set.translate?`<button data-d="tr" data-id="${m.id}">${I('translate',15)}${m.showTr?'Hide translation':'Translate'}</button>`:''}${m.type==='text'?`<button data-d="copy" data-id="${m.id}">Copy</button>`:''}${me?`<button data-d="unsend" data-id="${m.id}">${I('trash',15)}Unsend</button>`:''}</div>`:'';
 const meta=last||sel?`<span class="mm">${m.t}${m.queued?' · Waiting to send':me&&m===t.msgs[t.msgs.length-1]&&t.seen?' · Seen':me?' · Sent':''}</span>`:'';
 const fuse=m.exp?`<i class="mfuse" style="width:${Math.max(0,Math.min(100,(m.exp-Date.now())/m.ttl*100))}%"></i>`:'';
 return `<div class="mrow ${me?'me':''}${gap}">${t.type==='group'&&!me&&gap?`<span class="msn">${esc(first(m.from))}</span>`:''}<div class="mb ${cls}" data-d="msg" data-id="${m.id}">${h}${fuse}</div>${rx}${acts}${meta}</div>`;
}
function renderMsgs(bottom){
 const t=get(D.cur),l=$('#dmlist');if(!t||!l)return;
 const keep=l.scrollTop,atB=l.scrollHeight-l.scrollTop-l.clientHeight<80;
 l.innerHTML=`<div class="mday">Today</div>`+t.msgs.map((m,i)=>msgHTML(t,m,i)).join('')+(t.typing?`<div class="mrow"><div class="mb" style="color:var(--muted)">typing…</div></div>`:'');
 if(bottom||atB)l.scrollTop=l.scrollHeight;else l.scrollTop=keep;
}
function sendMsg(t,o){
 const m=mk('me',o.type||'text',o);m.t=nowT();
 const ttl=t.fade==='10'?10000:t.fade==='24'?86400000:0;
 if(ttl&&D.set.fade){m.exp=Date.now()+ttl;m.ttl=ttl}
 if(S.net==='offline'){m.queued=true;S.outbox.push(m)}
 t.msgs.push(m);t.ord=++D.ord;t.seen=false;
 if(D.cur===t.id){renderMsgs(true);renderSched()}
 return m;
}
function sendText(){
 const t=get(D.cur),inp=$('#dmin');if(!t||!inp)return;
 const v=inp.value.trim();if(!v)return;
 const o={type:'text',text:v};
 if(D.reply){if(D.reply.id)o.reply=D.reply.id;else o.rq=D.reply.text;D.reply=null}
 inp.value='';
 sendMsg(t,o);renderComp();$('#dmin')?.focus();
 autoReply(t);
}
const REP=['Haha, yes!','Love that.','Let me check and get back to you.','Sounds good to me.','Send it over.','On my way.'];
function autoReply(t){
 if(t.type==='dm'&&!ONLINE.has(t.u[0]))return;
 if(S.net==='offline')return;
 const who=t.type==='group'?rnd(t.u):t.u[0];
 setTimeout(()=>{t.seen=true;if(D.cur===t.id)renderMsgs()},700);
 setTimeout(()=>{t.typing=who;if(D.cur===t.id){renderMsgs(true);renderSub()}},1000);
 setTimeout(()=>{t.typing=false;const m=mk(who,'text',{text:rnd(REP)});m.t=nowT();t.msgs.push(m);t.ord=++D.ord;if(D.cur===t.id){renderMsgs(true);renderSub()}else{t.unread++;setDot();if(D.view==='inbox')renderInbox()}},2600);
}

/* ---------- attach, recording and sheets ---------- */
function attachSheet(){
 const t=get(D.cur),g=t.type==='group';
 const o=(k,ic,l,ok=true,why='')=>`<button class="dmopt ${ok?'':'off'}" data-d="att" data-k="${k}">${I(ic,22)}<span>${l}</span>${ok?'':`<small>${why}</small>`}</button>`;
 openSheet(`<h3>Send</h3><div class="lb"><div class="create"><div class="dmgrid">
 ${o('photo','image','Photo')}${o('once','once','View-once photo')}
 ${o('voice','mic','Voice note',D.set.vnotes,'Off in settings')}${o('clip','camera','Video reply',D.set.vreplies,'Off in settings')}
 ${o('gift','gift','Gift or tip',D.set.gifts,'Off in settings')}${o('later','clock','Send later')}
 ${o('cap','lock','Time capsule')}${o('poll','poll','Poll',g,'Groups only')}${o('evt','cal','Event',g,'Groups only')}
 </div></div></div>`);
}
function startRec(k){
 if(k==='voice'&&!D.set.vnotes){toast('Voice notes are turned off in your settings');return}
 if(k==='clip'&&!D.set.vreplies){toast('Video replies are turned off in your settings');return}
 if(S.net==='offline'&&k==='clip')toast('Offline: the video reply will send when you reconnect');
 D.rec={kind:k,t0:Date.now()};renderComp();
}
function giftSheet(){
 openSheet(`<h3>Send a gift</h3><div class="lb"><div class="create"><div class="line"><span class="coinrow">${I('coin',20)}<b id="dmcoin">${S.coins}</b> coins</span><button class="chip" data-d="coins">Get coins</button></div><div class="dmgrid">${GIFTS.map(g=>`<button class="dmopt" data-d="gift" data-g="${g.id}">${giftSVG(g.id,40)}<span>${g.n}</span><small style="margin:0">${g.p} coin${g.p>1?'s':''}</small></button>`).join('')}</div><p class="q">Prototype coins only. No payment is taken.</p></div></div>`);
}
function laterSheet(cap){

 if(!v){toast('Type your message first, then choose a time');return}

 openSheet(`<h3>${cap?'Time capsule':'Send later'}</h3><div class="lb"><div class="create"><p class="q" style="margin-top:0">“${esc(v.slice(0,80))}”</p>${opts.map(([l,ms])=>`<button class="dmopt" data-d="schedgo" data-cap="${cap?1:0}" data-ms="${ms}" data-l="${esc(l)}">${I(cap?'lock':'clock',20)}<span>${l}</span></button>`).join('')}<p class="q">${cap?'The message arrives locked and opens at the time you pick.':'Scheduled messages send from your phone, even if the app is closed (simulated here).'}</p></div></div>`);
}
function pollSheet(){
 openSheet(`<h3>New poll</h3><div class="lb"><div class="create"><input class="dmfield" id="pq" placeholder="Ask a question" aria-label="Question"><input class="dmfield" id="po1" placeholder="Option 1" aria-label="Option 1"><input class="dmfield" id="po2" placeholder="Option 2" aria-label="Option 2"><input class="dmfield" id="po3" placeholder="Option 3 (optional)" aria-label="Option 3"><button class="dmbtn" data-d="pollgo">Send poll</button></div></div>`);

function evtSheet(){

function chatMenu(){

 openSheet(`<h3>${esc(nameOf(t))}</h3><div class="lb"><div class="create">
 <div class="dmset col" style="padding:0;border:0;background:none"><b>Disappearing messages</b><small>${D.set.fade?'New messages vanish after the time you choose.':'Turned off in your settings.'}</small><div class="dmseg">${[['off','Off'],['10','10 sec'],['24','24 hours']].map(([k,l])=>`<button data-d="fade" data-k="${k}" aria-pressed="${(t.fade||'off')===k}" ${D.set.fade?'':'disabled'}>${l}</button>`).join('')}</div></div>
 <button class="dmopt" data-d="tmute">${I('mute',20)}<span>Mute notifications</span>${sw(t.muted)}</button>

function rowMenu(i){

}
function catchUp(){
 const un=TH.filter(t=>t.unread&&!t.arch&&!t.req);
 openSheet(`<h3>Catch me up</h3><div class="lb"><div class="create">${un.length?`<ol class="dmsum">${un.map(t=>`<li><b>${esc(nameOf(t))}</b> (${t.unread} new): ${esc(t.sum||pv(lastM(t)))}</li>`).join('')}</ol><button class="dmbtn" data-d="markall">Mark all as read</button>`:'<p class="q">You are all caught up.</p>'}<p class="q">Summaries are made up for this prototype. Nothing is read by a server.</p></div></div>`);
}
function newMsg(){
 openSheet(`<h3>New message</h3><div class="lb"><div class="create">${[...FR].map(u=>`<button class="dmpick" data-d="newto" data-u="${u}">${av(u,40)}<span class="t"><b>${esc(P[u].n)}</b><small>@${esc(P[u].h)}</small></span></button>`).join('')}</div></div>`);
}
function noteSheet(u){
 if(u==='me'){openSheet(`<h3>Your note</h3><div class="lb"><div class="create"><input class="dmfield" id="notein" maxlength="60" placeholder="Share a thought for 24 hours" value="${esc(D.notes.me)}" aria-label="Your note"><button class="dmbtn" data-d="notesave">Share</button>${D.notes.me?`<button class="dmbtn ghost" data-d="notedel" style="margin-left:8px">Delete</button>`:''}</div></div>`);setTimeout(()=>$('#notein')?.focus(),50)}
 else{const t=dmFor(u);openDM(t.id);D.reply={id:null,who:first(u)+'\'s note',text:D.notes[u]};renderReply()}
}
function dmFor(u){let t=TH.find(x=>x.type==='dm'&&x.u[0]===u);if(!t){t={id:'t'+(TH.length+1),type:'dm',u:[u],unread:0,ord:++D.ord,sum:'',msgs:[]};TH.push(t)}if(t.arch)t.arch=false;return t}

/* ---------- viewers ---------- */
function viewer(html){const p=P_();p.insertAdjacentHTML('beforeend',`<div class="pv-view" id="dmview">${html}</div>`)}
function closeViewer(){$('#dmview')?.remove()}

/* ---------- settings ---------- */
function openSettings(){
 closeSheet();D.view='settings';
 put(head('Message and call settings','Control what people can do',true)+`<div class="dm"><div class="lb" id="dmsetb">${settingsBody()}</div></div>`);
}
function row(k,t,s){return `<button class="dmset" role="switch" aria-checked="${!!D.set[k]}" data-d="set" data-k="${k}"><span class="t"><b>${t}</b><small>${s}</small></span>${sw(D.set[k])}</button>`}
function settingsBody(){
 const S_=D.set;
 return `<div class="dmsetg">Calls</div>
 ${row('voice','Voice calls','Allow voice calls with friends. Turn off to block all voice calls, in and out.')}
 ${row('video','Video calls','Allow video calls with friends. Turn off to block all video calls, in and out.')}
 <div class="dmset col"><b>Who can call me</b><small>Only people on your friends list can ever call you. Choose Nobody to stop all incoming calls.</small><div class="dmseg">${[['friends','Friends'],['nobody','Nobody']].map(([k,l])=>`<button data-d="who" data-k="${k}" aria-pressed="${S_.whoCalls===k}">${l}</button>`).join('')}</div></div>
 ${row('dnd','Do not disturb','Calls are silenced and show up as missed calls.')}
 <div class="dmsetg">Allow calls from</div>
 ${[...FR].map(u=>`<button class="dmset" role="switch" aria-checked="${!D.blocked.has(u)}" data-d="ublock" data-u="${u}"><span class="t"><b>${esc(P[u].n)}</b><small>${D.blocked.has(u)?'Blocked. Calls from them are declined.':'Allowed'}</small></span>${sw(!D.blocked.has(u))}</button>`).join('')}
 <div class="dmsetg">Messages</div>
 ${row('vnotes','Voice notes','Send and play voice notes.')}
 ${row('vreplies','Video replies','Send short video replies.')}
 ${row('gifts','Gifts and tips in chat','Send gifts to friends using coins.')}
 ${row('shares','Share posts into chats','Show chats when you tap Share.')}
 ${row('fade','Disappearing messages','Allow chats to use disappearing mode.')}
 ${row('translate','Translate messages','Show a Translate button on messages in other languages.')}
 <div class="dmsetg">Try it</div>
 <div class="dmtry"><button data-d="incoming" data-u="amara" data-k="video">${I('video',20)}Simulate a video call from Amara</button><button data-d="incoming" data-u="kabelo" data-k="voice">${I('phone',20)}Simulate a voice call from Kabelo</button><button data-d="incoming" data-u="jabu" data-k="voice">${I('phone',20)}Simulate a call from Jabu (not a friend)</button></div>
 <div class="dmfoot">Calls, recordings, translations and summaries are simulated in this prototype. No audio or video leaves your device.</div>`;
}

/* ---------- calls ---------- */
function reasonIn(t,k){
 const u=t.u[0];
 if(!D.set[k==='video'?'video':'voice'])return (k==='video'?'Video':'Voice')+' calls are turned off.';
 if(D.set.whoCalls==='nobody')return 'Incoming calls are set to nobody.';
 if(!FR.has(u))return first(u)+' is not on your friends list.';
 if(D.blocked.has(u))return 'You blocked calls from '+first(u)+'.';
 return '';
}
function logCall(t,o){const m=mk('them',  'call',o);m.t=nowT();t.msgs.push(m);t.ord=++D.ord;if(!(D.cur===t.id&&D.view==='chat'))t.unread++;if(D.cur===t.id)renderMsgs(true);setDot()}
function incoming(u,k){
 const t=dmFor(u);
 const why=reasonIn(t,k);
 if(why){logCall(t,{kind:k,blocked:true,missed:false,dur:0});toast('Blocked a call from '+first(u)+'. '+why);if(D.view==='inbox')renderInbox();return}
 if(D.set.dnd){logCall(t,{kind:k,missed:true,dur:0});toast('Do not disturb: missed call from '+first(u));if(D.view==='inbox')renderInbox();return}
 if(D.call)return;
 $('#dmin_')?.remove();
 const el=document.createElement('div');el.className='incv';el.id='dminc';
 el.innerHTML=`<span class="av" style="--c:${P[u].c};--s:96px;font-size:40px">${P[u].n[0]}</span><b>${esc(P[u].n)}</b><small>${k==='video'?'Video':'Voice'} call from a friend</small><div class="ctrls"><button class="cbt end" data-d="decl" data-u="${u}" data-k="${k}"><span class="c">${I('phone',26)}</span>Decline</button>${k==='video'?`<button class="cbt" data-d="accv" data-u="${u}" data-k="voice"><span class="c">${I('phone',24)}</span>Voice only</button>`:''}<button class="cbt acc" data-d="accv" data-u="${u}" data-k="${k}"><span class="c">${I(k==='video'?'video':'phone',24)}</span>Accept</button></div>`;
 $('#app').appendChild(el);
 D.incT=setTimeout(()=>{if($('#dminc')){$('#dminc').remove();logCall(t,{kind:k,missed:true,dur:0});toast('Missed call from '+first(u))}},20000);
}
function startCall(tid,k,live){
 const t=get(tid);if(!t||D.call)return;
 const why=live?'':canCall(t,k);
 if(why){toast(why);return}
 const low=S.net==='low';
 D.call={t,k,cam:k==='video'&&!low,mute:false,spk:false,state:live?'live':'ring',sec:0,low};
 let el=$('#dmcall');if(!el){el=document.createElement('div');el.id='dmcall';el.className='layer callv';$('#app').appendChild(el)}
 renderCall();
 if(!live)D.call.rt=setTimeout(()=>{if(D.call){D.call.state='live';renderCall()}},2200);
}
function renderCall(){
 const c=D.call,el=$('#dmcall');if(!c||!el)return;
 const t=c.t,mem=t.u,vid=c.k==='video';
 const tileFor=(u,big)=>`<div class="ctile ${vid&&!c.low?'':'cam-off'}"><div class="bgf" style="${art(P[u].c)}"></div><div class="big">${av(u,big?96:64)}</div><span class="lab">${esc(first(u))}</span></div>`;
 let stage;
 if(vid)stage=`<div class="cstage ${mem.length>1?'grid2':''}">${mem.map(u=>tileFor(u,mem.length===1)).join('')}<div class="cctile pip ${c.cam?'':'cam-off'}"><div class="bgf" style="${art(P.me.c)}"></div><div class="big">${av('me',44)}</div><span class="lab">You</span></div></div>`;
 else stage=`<div class="cstage voice"><div style="display:flex;gap:18px;flex-wrap:wrap;justify-content:center">${mem.map(u=>`<div class="ctile" style="background:none;overflow:visible"><div class="big">${av(u,mem.length>1?72:120)}</div></div>`).join('')}</div></div>`;
 const stat=c.state==='ring'?'Calling…':'Connected · '+fmtT(c.sec);
 el.innerHTML=`<div class="top"><b>${esc(nameOf(t))}</b><small id="cstat">${stat}</small>${c.low?`<br><span class="lowtag">Low data: audio only</span>`:''}</div>${stage}
 <div class="ctrls"><button class="cbt ${c.mute?'on':''}" data-d="cmute"><span class="c">${I(c.mute?'micoff':'mic',24)}</span>${c.mute?'Unmute':'Mute'}</button>
 ${vid?`<button class="cbt ${c.cam?'':'on'}" data-d="ccam"><span class="c">${I(c.cam?'video':'camoff',24)}</span>${c.cam?'Camera':'Camera off'}</button><button class="cbt" data-d="cflip"><span class="c">${I('flip',24)}</span>Flip</button>`:`<button class="cbt ${c.spk?'on':''}" data-d="cspk"><span class="c">${I('speaker',24)}</span>Speaker</button><button class="cbt" data-d="cup"><span class="c">${I('video',24)}</span>Video</button>`}
 <button class="cbt end" data-d="cend"><span class="c">${I('phone',26)}</span>End</button></div>`;
}
function endCall(){
 const c=D.call;if(!c)return;
 clearTimeout(c.rt);D.call=null;$('#dmcall')?.remove();
 const m=mk('me','call',{kind:c.k,dur:c.sec,missed:c.state==='ring'?'cancelled':false});m.t=nowT();c.t.msgs.push(m);c.t.ord=++D.ord;
 if(D.cur===c.t.id&&D.view==='chat')renderMsgs(true);
 toast(c.state==='ring'?'Call cancelled':'Call ended · '+fmtT(c.sec));
}

/* ---------- ticker ---------- */
setInterval(()=>{
 const now=Date.now();let ch=false;
 if(D.call&&D.call.state==='live'){D.call.sec++;const s=$('#cstat');if(s)s.textContent='Connected · '+fmtT(D.call.sec)}
 if(D.rec){const s=$('#rect');if(s)s.textContent=fmtT(Math.floor((now-D.rec.t0)/1000))}
 D.sched.slice().forEach(s=>{if(s.at&&s.at<=now){D.sched.splice(D.sched.indexOf(s),1);const t=get(s.th);sendMsg(t,s.props);toast('Scheduled message sent');ch=true;renderSched()}});
 TH.forEach(t=>{
  const b=t.msgs.length;t.msgs=t.msgs.filter(m=>!(m.exp&&m.exp<=now));if(t.msgs.length!==b&&D.cur===t.id){ch=true;if(D.sel&&!t.msgs.find(m=>m.id===D.sel))D.sel=null}
  t.msgs.forEach(m=>{if(m.exp&&D.cur===t.id)ch=true;if(m.pl&&now-m.pl<m.dur*250+500&&D.cur===t.id)ch=true;if(m.type==='cap'&&m.unlock&&m.unlock<=now&&!m.opened){m.opened=true;ch=true}})
 });
 if(ch&&D.view==='chat'&&D.cur&&$('#dmlist'))renderMsgs();
},1000);

/* ---------- events ---------- */
function setSet(k,v){D.set[k]=v;const b=$('#dmsetb');if(b){const y=b.scrollTop;b.innerHTML=settingsBody();b.scrollTop=y}}
document.addEventListener('click',e=>{
 if(Date.now()-(D.noclick||0)<300){const x=e.target.closest('[data-d]');if(x&&(x.dataset.d==='open'||x.dataset.d==='msg')){return}}
 const b=e.target.closest('[data-d]');if(!b)return;
 const a=b.dataset.d,i=b.dataset.id,t=get(i||D.cur);
 const mm=()=>get(D.cur).msgs.find(x=>x.id===i);
 switch(a){
 case 'back':if(D.view==='settings'&&D.cur&&D.from==='chat'){openDM(D.cur)}else{openMsgsDM()}D.from=null;break;
 case 'open':{const f=b;if(f.classList.contains('open')){f.classList.remove('open');f.style.transform='';break}if(Date.now()-(D.lp||0)<800)break;openDM(i);break}
 case 'tab':D.tab=b.dataset.k;D.arch=false;renderInbox();break;
 case 'arch-toggle':D.arch=!D.arch;renderInbox();break;
 case 'pin':t.pin=!t.pin;closeSheet();toast(t.pin?'Pinned':'Unpinned');D.view==='chat'?0:renderInbox();break;
 case 'mute':t.muted=!t.muted;closeSheet();toast(t.muted?'Muted':'Unmuted');renderInbox();break;
 case 'arch':t.arch=!t.arch;closeSheet();toast(t.arch?'Archived':'Restored');renderInbox();break;
 case 'read':t.unread=t.unread?0:1;closeSheet();renderInbox();break;
 case 'accept':t.req=false;FR.add(t.u[0]);toast('Accepted. '+first(t.u[0])+' is now a friend');D.tab='primary';renderInbox();break;
 case 'decline':TH.splice(TH.indexOf(t),1);toast('Request declined');renderInbox();break;
 case 'catchup':catchUp();break;
 case 'markall':TH.forEach(x=>x.unread=0);closeSheet();renderInbox();break;
 case 'settings':D.from=D.view==='chat'?'chat':null;openSettings();break;
 case 'newmsg':newMsg();break;
 case 'newto':closeSheet();openDM(dmFor(b.dataset.u).id);break;
 case 'note':noteSheet(b.dataset.u);break;
 case 'notesave':D.notes.me=$('#notein').value.trim();closeSheet();renderInbox();toast(D.notes.me?'Note shared for 24 hours':'Note deleted');break;
 case 'notedel':D.notes.me='';closeSheet();renderInbox();break;
 case 'actnow':openDM(dmFor(b.dataset.u).id);break;
 case 'golive':if(typeof openLive==='function'){P_().hidden=true;P_().innerHTML='';openLive(b.dataset.l)}break;
 case 'chatmenu':chatMenu();break;
 case 'fade':{const T=get(D.cur);T.fade=b.dataset.k;closeSheet();if(T.fade!=='off'){const m=mk('me','sys',{text:'Disappearing messages are on: new messages vanish after '+(T.fade==='10'?'10 seconds':'24 hours')+'.'});T.msgs.push(m)}renderMsgs(true);renderSub();break}
 case 'tmute':{const T=get(D.cur);T.muted=!T.muted;chatMenu();break}
 case 'tpin':{const T=get(D.cur);T.pin=!T.pin;chatMenu();break}
 case 'tblock':{const u=get(D.cur).u[0];D.blocked.has(u)?D.blocked.delete(u):D.blocked.add(u);chatMenu();renderSub();const T=get(D.cur);document.querySelectorAll('.dmhead .ib[data-d="call"]').forEach(x=>x.classList.toggle('off',!!canCall(T,x.dataset.k)));break}
 case 'clear':{const T=get(D.cur);T.msgs=[];closeSheet();renderMsgs();break}
 case 'call':{const T=get(D.cur);startCall(T.id,b.dataset.k);break}
 case 'cmute':D.call.mute=!D.call.mute;renderCall();break;
 case 'ccam':D.call.cam=!D.call.cam;renderCall();break;
 case 'cspk':D.call.spk=!D.call.spk;renderCall();break;
 case 'cflip':toast('Camera flipped');break;
 case 'cup':if(!D.set.video){toast('Video calls are turned off in your settings')}else if(S.net==='low'){toast('Low-data mode keeps calls audio only')}else{D.call.k='video';D.call.cam=true;renderCall()}break;
 case 'cend':endCall();break;
 case 'incoming':{const u=b.dataset.u,k=b.dataset.k;D.from=null;toast('Incoming call in 2 seconds…');setTimeout(()=>incoming(u,k),2000);break}
 case 'decl':clearTimeout(D.incT);$('#dminc')?.remove();logCall(dmFor(b.dataset.u),{kind:b.dataset.k,missed:true,dur:0});toast('Call declined');break;
 case 'accv':{clearTimeout(D.incT);$('#dminc')?.remove();const T=dmFor(b.dataset.u);startCall(T.id,b.dataset.k,true);break}
 case 'set':setSet(b.dataset.k,!D.set[b.dataset.k]);break;
 case 'who':setSet('whoCalls',b.dataset.k);break;
 case 'ublock':{const u=b.dataset.u;D.blocked.has(u)?D.blocked.delete(u):D.blocked.add(u);setSet('x',D.set.x);break}
 case 'msg':{if(e.target.closest('.emo,.macts'))break;D.sel=D.sel===i?null:i;renderMsgs();break}
 case 'react':{const m=mm();m.rx=m.rx||{};const a2=m.rx[b.dataset.e]=m.rx[b.dataset.e]||[];const k=a2.indexOf('me');k<0?a2.push('me'):a2.splice(k,1);if(!a2.length)delete m.rx[b.dataset.e];D.sel=null;renderMsgs();break}
 case 'doreply':{const m=mm();D.reply={id:m.id,who:m.from==='me'?'yourself':first(m.from),text:prev(m)};D.sel=null;renderMsgs();renderReply();$('#dmin')?.focus();break}
 case 'unreply':D.reply=null;renderReply();break;
 case 'tr':{const m=mm();m.showTr=!m.showTr;D.sel=null;renderMsgs();break}
 case 'copy':try{navigator.clipboard.writeText(mm().text).catch(()=>{})}catch(_){}D.sel=null;renderMsgs();toast('Copied');break;
 case 'unsend':{const T=get(D.cur);T.msgs=T.msgs.filter(x=>x.id!==i);D.sel=null;renderMsgs();toast('Message unsent');break}
 case 'attach':attachSheet();break;
 case 'att':{const k=b.dataset.k;closeSheet();
  if(k==='photo'){sendMsg(get(D.cur),{type:'photo',c:Math.floor(Math.random()*360)})}
  else if(k==='once'){sendMsg(get(D.cur),{type:'once',seen:false})}
  else if(k==='voice')startRec('voice');else if(k==='clip')startRec('clip');
  else if(k==='gift'){if(!D.set.gifts){toast('Gifts are turned off in your settings')}else giftSheet()}
  else if(k==='later')laterSheet(false);else if(k==='cap')laterSheet(true);
  else if(k==='poll'){if(get(D.cur).type!=='group')toast('Polls are for group chats');else pollSheet()}
  else if(k==='evt'){if(get(D.cur).type!=='group')toast('Events are for group chats');else evtSheet()}
  break}
 case 'mic':startRec('voice');break;
 case 'cam':startRec('clip');break;
 case 'reccancel':D.rec=null;renderComp();break;
 case 'recsend':{const r=D.rec;D.rec=null;sendMsg(get(D.cur),{type:r.kind==='clip'?'clip':'voice',dur:Math.max(1,Math.round((Date.now()-r.t0)/1000)),c:Math.floor(Math.random()*360)});renderComp();break}
 case 'play':{const m=mm();m.pl=Date.now();renderMsgs();break}
 case 'viewclip':{const m=mm();viewer(`<div class="art2" style="${art(m.c||200)}"></div><p>Video reply · ${fmtT(m.dur)} (simulated)</p><button class="dmbtn" data-d="closeview">Close</button>`);break}
 case 'viewonce':{const m=mm();m.seen=true;viewer(`<div class="art2" style="${art(m.c||20)}"></div><p>View once. It disappears when you close it.</p><button class="dmbtn" data-d="closeview">Close</button>`);break}
 case 'closeview':closeViewer();renderMsgs();break;
 case 'peek':{const m=mm();m.unlock=Date.now();renderMsgs();break}
 case 'vote':{const m=mm();const o=+b.dataset.o;const had=m.opts[o].v.includes('me');m.opts.forEach(x=>{const k=x.v.indexOf('me');if(k>=0)x.v.splice(k,1)});if(!had)m.opts[o].v.push('me');renderMsgs();break}
 case 'rsvp':{const m=mm(),k=b.dataset.k;const had=m.rsvp[k].includes('me');Object.values(m.rsvp).forEach(x=>{const j=x.indexOf('me');if(j>=0)x.splice(j,1)});if(!had)m.rsvp[k].push('me');renderMsgs();break}
 case 'pollgo':{const q=$('#pq').value.trim(),o=['#po1','#po2','#po3'].map(s=>$(s).value.trim()).filter(Boolean);if(!q||o.length<2){toast('Add a question and two options');break}closeSheet();sendMsg(get(D.cur),{type:'poll',q,opts:o.map(x=>({t:x,v:[]}))});break}
 case 'evtgo':{const ti=$('#et').value.trim();if(!ti){toast('Give the event a name');break}closeSheet();sendMsg(get(D.cur),{type:'evt',title:ti,when:$('#ew').value,where:$('#ep').value.trim()||'To be decided',rsvp:{go:['me'],maybe:[],no:[]}});break}
 case 'gift':{const g=GIFTS.find(x=>x.id===b.dataset.g);if(S.coins<g.p){toast('Not enough coins');closeSheet();openCoins();break}S.coins-=g.p;closeSheet();sendMsg(get(D.cur),{type:'gift',g:g.id});toast('Sent '+g.n);break}
 case 'coins':openCoins();break;
 case 'schedgo':{const cap=b.dataset.cap==='1',ms=+b.dataset.ms,inp=$('#dmin');const text=inp?inp.value.trim():'';const T=get(D.cur);
  closeSheet();if(inp){inp.value='';$('#dmform')?.classList.remove('has-text')}
  if(cap){const unlock=ms>0?Date.now()+ms:null;const lab=ms>0?(ms<60000?'Opens in 10 seconds':'Opens '+b.dataset.l.replace('In ','in ')):'Opens '+b.dataset.l;sendMsg(T,{type:'cap',text,label:lab,unlock:unlock===null?Date.now()+3e12:unlock});toast('Capsule sent')}
  else{D.sched.push({id:'s'+(++D.mid),th:T.id,props:{type:'text',text},at:ms>0?Date.now()+ms:0,label:b.dataset.l});renderSched();toast('Scheduled: '+b.dataset.l)}
  break}
 case 'unsched':D.sched=D.sched.filter(x=>x.id!==i);renderSched();break;
 case 'sh-send':{const s=D.share;const T=dmFor(b.dataset.u);sendMsg(T,{type:'share',ref:s});closeSheet();toast('Sent to '+first(b.dataset.u));break}
 case 'storysend':sendStory();break;
 }
});
document.addEventListener('submit',e=>{if(e.target.id==='dmform'){e.preventDefault();sendText()}});
document.addEventListener('input',e=>{
 if(e.target.id==='dmin')$('#dmform')?.classList.toggle('has-text',!!e.target.value.trim());
 if(e.target.id==='dmq'){D.q=e.target.value;renderInbox()}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('dmfg'))openDM(e.target.dataset.id);
 if(e.target.id==='storyin'&&e.key==='Enter'){e.preventDefault();sendStory()}
});
document.addEventListener('contextmenu',e=>{const f=e.target.closest('.dmfg[data-id]');if(f){e.preventDefault();rowMenu(f.dataset.id)}});

/* swipe: rows (left) and bubbles (right to reply) */
let sg=null;
document.addEventListener('pointerdown',()=>{D.noclick=0},true);
document.addEventListener('pointerdown',e=>{
 const f=e.target.closest('.dmfg[data-id]');
 if(f){document.querySelectorAll('.dmfg.open').forEach(x=>{if(x!==f){x.classList.remove('open');x.style.transform=''}});sg={k:'row',f,x:e.clientX,dx:0,mv:false,lt:setTimeout(()=>{if(sg&&!sg.mv){D.lp=Date.now();rowMenu(f.dataset.id);sg=null}},650)};return}
 const bb=e.target.closest('.mb[data-id]');
 if(bb&&!e.target.closest('button')&&!e.target.closest('.dmvn'))sg={k:'msg',f:bb,x:e.clientX,dx:0,mv:false};
});
document.addEventListener('pointermove',e=>{
 if(!sg)return;const dx=e.clientX-sg.x;
 if(Math.abs(dx)>8&&!sg.mv){sg.mv=true;clearTimeout(sg.lt)}
 if(!sg.mv)return;
 if(sg.k==='row'){const base=sg.f.classList.contains('open')?-216:0;sg.dx=Math.max(-216,Math.min(0,base+dx));sg.f.style.transition='none';sg.f.style.transform=`translateX(${sg.dx}px)`}

 const form=k=>{

  ${k==='both'||k==='addc'?`<label class="whide"><input type="checkbox" id="whide" ${A&&A.hidden?'checked':''}><span>Hide my personal account from public view. People will only see my channel.</span></label>`:''}

 let l=allL().filter(x=>(M.cat==='All'||x.cat===M.cat)&&inScope(x.pl,x.off)&&(!q||(x.t+' '+x.cat).toLowerCase().includes(q)));
 if(M.sort==='near')l.sort((a,b)=>dOf(a.pl,a.off)-dOf(b.pl,b.off));
 else if(M.sort==='low')l.sort((a,b)=>a.price-b.price);else if(M.sort==='high')l.sort((a,b)=>b.price-a.price);
 return l;
}

function jobList(){
 const J=M.jobs,q=J.q.trim().toLowerCase();
 return [...M.myJobs.filter(j=>j.st!=='review'),...JOBS].filter(j=>{
  if(J.type!=='Any'&&j.type!==J.type)return false;if(J.field!=='Any'&&j.field!==J.field)return false;
  if(q&&!(j.t+' '+j.co+' '+j.field).toLowerCase().includes(q))return false;
  if(j.remote)return J.remote||J.scope==='world';
  if(J.scope==='world')return true;
  if(J.scope==='country')return PL[j.pl].c===J.country;
  return dist(M.loc,j.pl)<=J.rad;
 });
}

/* ----- activity ----- */
function viewActivity(){
 const T=[['orders','Orders'],['offers','Offers'],['apps','Applications'],['quotes','Quotes'],['mine','My listings'],['saved','Saved']];
 const A=M.act;let b='';const none=t=>`<div class="empty" style="background:var(--surface)">${t}</div>`;
 if(A==='orders')b=M.orders.length?M.orders.map(o=>{const l=getL(o.lid);return `<div class="mkcard"><span class="mkth" style="${art(hue(l.id))};width:56px;flex:none">${I(CICON[l.cat]||'tag',22)}</span><span class="t"><b>${esc(l.t)}</b><small>${R(o.total)} · ${o.del} · ${o.method}</small><span class="mkstatus"><i class="mkdot ${o.st==='held'?'y':o.st==='released'?'g':'w'}"></i>${o.st==='held'?'Paid. Held by Blend':o.st==='released'?'Released to seller':'Dispute open'}</span>${o.st==='held'?`<span style="display:flex;gap:8px;margin-top:8px"><button class="mkbtn sm" data-m="release" data-id="${o.id}">I got it</button><button class="mkbtn sm ghost" data-m="dispute" data-id="${o.id}">Problem</button></span>`:''}</span></div>`}).join(''):none('No orders yet. Buy with Blend Protect to track it here.');
 else if(A==='offers')b=M.offers.length?M.offers.map(o=>{const l=getL(o.lid);return `<div class="mkcard"><span class="t"><b>${esc(l.t)}</b><small>Your offer ${R(o.amt)} · asking ${R(l.price)}</small><span class="mkstatus"><i class="mkdot ${o.st==='Accepted'?'g':o.st==='Pending'?'y':''}"></i>${o.st}${o.st==='Countered'?' at '+R(o.counter):''}</span>${o.st!=='Pending'?`<button class="mkbtn sm" style="margin-top:8px" data-m="item" data-id="${l.id}">View item</button>`:''}</span></div>`}).join(''):none('Offers you make show up here.');
 else if(A==='apps')b=M.applied.length?M.applied.map(a=>{const j=[...M.myJobs,...JOBS].find(x=>x.id===a.id);const steps=['Applied','Viewed','Interview'];const k=steps.indexOf(a.st);return `<button class="mkcard" data-m="job" data-id="${j.id}"><span class="mkmono">${esc(j.co[0])}</span><span class="t"><b>${esc(j.t)}</b><small>${esc(j.co)} · ${a.how==='blend'?'via Blend':'outside Blend'}</small>${steps.map((s,i)=>`<span class="mkstatus"><i class="mkdot ${i<=k?'g':''}"></i>${s==='Viewed'?'Viewed by employer':s==='Interview'?'Interview invite':'Application sent'}</span>`).join('')}</span></button>`}).join(''):none('Apply for a job to track it here.');
 else if(A==='quotes')b=[...M.bookings.map(q=>({...q,k:'Booked'})),...M.requests.map(q=>({...q,k:'Quote'}))].map(q=>{const p=[...M.myServices,...SVC].find(x=>x.id===q.pid);return `<button class="mkcard" data-m="prov" data-id="${p.id}"><span class="mkmono">${esc(p.n[0])}</span><span class="t"><b>${esc(p.n)}</b><small>${q.k==='Booked'?q.when:q.d.slice(0,60)}</small><span class="mkstatus"><i class="mkdot ${q.k==='Booked'||q.st!=='Sent'?'g':'y'}"></i>${q.k==='Booked'?'Booked · deposit held':q.st==='Sent'?'Waiting for a quote':'Quote: '+q.st}</span></span></button>`}).join('')||none('Quotes and bookings show up here.');
 else if(A==='mine')b=(M.incoming.filter(i=>i.st==='open').map(i=>{const l=getL(i.lid);return `<div class="mkcard"><span class="t"><b>Offer from ${i.from}</b><small>${esc(l.t)} · ${R(i.amt)} (asking ${R(l.price)})</small><span style="display:flex;gap:8px;margin-top:8px"><button class="mkbtn sm" data-m="inacc" data-id="${i.id}">Accept</button><button class="mkbtn sm ghost" data-m="indec" data-id="${i.id}">Decline</button></span></span></div>`}).join(''))+(M.mine.length?M.mine.map(l=>`<div class="mkcard"><span class="mkth" style="${art(hue(l.id))};width:56px;flex:none">${I(CICON[l.cat]||'tag',22)}</span><span class="t"><b>${esc(l.t)}</b><small>${R(l.price)} · ${esc(PL[l.pl].n)}</small><span class="mkstatus"><i class="mkdot ${l.st==='live'?'g':l.st==='sold'?'':'w'}"></i>${l.st==='live'?'Live':l.st==='sold'?'Sold':'Held for review'}</span><span style="display:flex;gap:8px;margin-top:8px">${l.st==='live'?`<button class="mkbtn sm ghost" data-m="sold" data-id="${l.id}">Mark sold</button>`:''}<button class="mkbtn sm ghost" data-m="del" data-id="${l.id}">Delete</button></span></span></div>`).join(''):none('Your listings show up here. Tap Sell to add one.'));
 else b=[...M.saved].map(getL).filter(Boolean).map(l=>`<button class="mkcard" data-m="item" data-id="${l.id}"><span class="mkth" style="${art(hue(l.id))};width:56px;flex:none">${I(CICON[l.cat]||'tag',22)}</span><span class="t"><b>${esc(l.t)}</b><small>${R(l.price)} · ${esc(PL[l.pl].n)}</small></span></button>`).join('')+[...M.savedJobs].map(id=>JOBS.find(x=>x.id===id)).filter(Boolean).map(jobCard).join('')||none('Tap the heart on an item or job to save it.');
 page('Your activity','Orders, applications and more',`<div class="mkact">${T.map(([k,l])=>`<button data-m="actab" data-k="${k}" aria-selected="${A===k}">${l}</button>`).join('')}</div>${b}`);
}

 <div class="mkopts" id="lsc">${[['near','Near me'],['country','My country'],['world','Anywhere']].map(([k,l])=>`<button data-m="lscope" data-k="${k}" aria-pressed="${M.scope===k}">${l}</button>`).join('')}</div>
 <div id="lrad" ${M.scope==='near'?'':'hidden'}><span class="mklab">Distance: <b id="lrv">${M.rad} km</b></span><input class="mkrange" id="lr" type="range" min="5" max="200" step="5" value="${M.rad}"></div>

function optToggle(b){const g=b.parentElement;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}
const selOpt=id=>{const e=document.querySelector('#'+id+' [aria-pressed="true"]');return e?e.textContent:''};

/* ----- events ----- */
document.addEventListener('click',e=>{
 const nb=e.target.closest('[data-need]');
 if(nb&&!__ACCT.isIn()){e.stopPropagation();e.preventDefault();closeSheet();__ACCT.gate(nb.dataset.need,nb)}
},true);
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-m]');if(!b)return;
 const a=b.dataset.m,id=b.dataset.id;
 switch(a){
 case 'back':back();break;
 case 'tab':M.tab=b.dataset.k;renderMarket();break;
 case 'loc':locSheet();break;
 case 'lscope':optToggle(b);M.scope=b.dataset.k;$('#lrad').hidden=M.scope!=='near';break;
 case 'locgo':M.loc=$('#lp').value;M.rad=+$('#lr').value;persist();closeSheet();renderMarket();break;
 case 'cat':M.cat=b.dataset.c;renderShop();break;
 case 'sort':M.sort=b.dataset.k;renderShop();break;
 case 'scat':M.svc.cat=b.dataset.c;renderSvc();break;
 case 'ssort':M.svc.sort=b.dataset.k;renderSvc();break;
 case 'jtype':M.jobs.type=b.dataset.k;persist();renderJobs();break;
 case 'flagged':flagSheet(FLAGGED,'Blocked listings today');break;
 case 'jflagged':flagSheet(JFLAG,'Blocked jobs today');break;
 case 'item':go(()=>viewItem(id));break;
 case 'save':{M.saved.has(id)?M.saved.delete(id):M.saved.add(id);toast(M.saved.has(id)?'Saved':'Removed from saved');if(b.dataset.re==='item')viewItem(id);else renderShop();break}
 case 'report':toast('Reported. Thank you, a person will check it');break;
 case 'chat':go(()=>chatView(id));break;
 case 'chatsend':chatSend(id);break;
 case 'offer':offerSheet(id);break;
 case 'offergo':{const amt=+$('#offamt').value;if(!amt){toast('Enter an amount');break}const l=getL(id);const o={id:'of'+(M.offers.length+1),lid:id,amt,st:'Pending'};M.offers.unshift(o);closeSheet();toast('Offer sent');setTimeout(()=>{if(amt>=l.price*.88){o.st='Accepted'}else{o.st='Countered';o.counter=Math.round(l.price*.95)}toast('Seller replied to your offer')},4000);break}
 case 'buy':buySheet(id);break;
 case 'opt':optToggle(b);break;
 case 'buygo':{const l=getL(id),fee=Math.max(10,Math.round(l.price*.03));M.orders.unshift({id:'o'+(M.orders.length+1),lid:id,price:l.price,fee,total:l.price+fee,st:'held',method:selOpt('bpay'),del:selOpt('bdel')});closeSheet();M.act='orders';toast('Paid. Blend is holding your money');go(viewActivity);break}
 case 'release':{const o=M.orders.find(x=>x.id===id);o.st='released';toast('Payment released to the seller');viewActivity();break}
 case 'dispute':{const o=M.orders.find(x=>x.id===id);o.st='disputed';toast('Dispute opened. Money stays held');viewActivity();break}
 case 'activity':M.act=b.dataset.act||M.act;go(viewActivity);break;
 case 'actab':M.act=b.dataset.k;viewActivity();break;
 case 'sell':if(!__ACCT.isIn()){__ACCT.gate('sell',b);break}if(!M.ver.phone)verifySheet(true);else go(sellForm);break;
 case 'vsend':if(($('#vph').value.replace(/\D/g,'')).length<9){toast('Enter a valid number');break}$('#vcode').hidden=false;toast('Code sent (prototype: 1234)');break;
 case 'vcheck':if($('#vcd').value!=='1234'){toast('That code is not right');break}M.ver.phone=true;closeSheet();idSheet();break;
 case 'idyes':M.ver.id=true;SEL.me.id=1;SEL.me.phone=1;closeSheet();toast('ID verified (simulated)');go(sellForm);break;
 case 'idno':SEL.me.phone=1;closeSheet();go(sellForm);break;
 case 'addphoto':SD.photos=Math.min(6,SD.photos+1);{const t=$('#st').value,p=$('#sp').value,d=$('#sd').value;sellForm();$('#st').value=t;$('#sp').value=p;$('#sd').value=d}break;
 case 'sopt':{const k=b.dataset.k,v=b.dataset.v;if(k==='del'){const i=SD.del.indexOf(v);i<0?SD.del.push(v):SD.del.splice(i,1);b.setAttribute('aria-pressed',String(i<0))}else{SD[k]=v;optToggle(b)}break}
 case 'postgo':postGo();break;
 case 'done':M.stack=[];back();break;
 case 'sold':{const l=getL(id);l.st='sold';viewActivity();break}
 case 'del':{M.mine=M.mine.filter(l=>l.id!==id);viewActivity();break}
 case 'inacc':{const i=M.incoming.find(x=>x.id===id);i.st='done';const l=getL(i.lid);l.st='sold';toast('Accepted. The buyer pays through Blend Protect');viewActivity();break}
 case 'indec':{M.incoming.find(x=>x.id===id).st='done';viewActivity();break}
 case 'job':go(()=>viewJob(id));break;
 case 'jobprefs':prefsSheet();break;
 case 'jscope':optToggle(b);M.jobs.scope=b.dataset.k;$('#jarea').hidden=b.dataset.k!=='area';$('#jctry').hidden=b.dataset.k!=='country';break;
 case 'jt2':optToggle(b);M.jobs.type=b.dataset.k;break;
 case 'jrem':M.jobs.remote=!M.jobs.remote;$('#jremp').textContent='Include remote jobs: '+(M.jobs.remote?'on':'off');$('#jremp').classList.toggle('fill',M.jobs.remote);break;
 case 'prefgo':M.loc=$('#jpl').value;M.jobs.rad=+$('#jr').value;M.jobs.country=$('#jcc').value;M.jobs.field=$('#jfd').value;persist();closeSheet();renderMarket();break;
 case 'alert':M.jobs.alert=!M.jobs.alert;toast(M.jobs.alert?'We will alert you about matching jobs':'Alerts off');renderJobs();break;

<script>
/* Custom topics inside the feed recipe */
(function(){
const MODES={more:'More',less:'Less',hide:'Hide'};
let mode='more';
const topics=()=>(S.recipe&&S.recipe.topics)||[];
const norm=t=>String(t).trim().toLowerCase().replace(/^#/,'');
function hay(p){
 let s=[p.text||'',(P[p.u]||{}).n||'',(P[p.u]||{}).h||'',p.type||'',p.group||'',p.cat||'',p.title||'',p.desc||'',p.cap||''];
 if(p.vid){const v=VIDS.find(x=>x.id===p.vid);if(v)s.push(v.title,v.desc,v.cat)}
 return s.join(' ').toLowerCase();
}
const hit=(x,h)=>h.includes(norm(x.t));
function weight(p){let w=0;const h=hay(p);topics().forEach(x=>{if(hit(x,h))w+=x.m==='more'?30:x.m==='less'?-30:0});return w}
const hidden=p=>{const h=hay(p);return topics().some(x=>x.m==='hide'&&hit(x,h))};
const _sc=score;score=function(p){return _sc(p)+weight(p)};
const _fl=feedList;feedList=function(){return _fl().filter(p=>!hidden(p))};
const _why=why;
why=function(p){
 const h=hay(p),m=topics().find(x=>x.m==='more'&&hit(x,h)),l=topics().find(x=>x.m==='less'&&hit(x,h));
 if(m)return 'You asked for more "'+m.t+'" in your recipe';
 if(l)return 'Shown lower: it matches "'+l.t+'", which you want less of';
 return _why(p);
};
const _rw=renderWatchList;
renderWatchList=function(){
 _rw();
 const list=document.querySelector('#s-videos .scroll');if(!list)return;
 const cards=[...list.querySelectorAll('.vc[data-vid]')];if(!cards.length||!topics().length)return;
 const w=cards.map(c=>{const v=VIDS.find(x=>x.id===c.dataset.vid);return{c,v,w:weight(v),h:hidden(v)}});
 w.forEach(x=>{if(x.h)x.c.remove()});
 const keep=w.filter(x=>!x.h).sort((a,b)=>b.w-a.w);
 const anchor=keep.length?keep[0].c.parentNode:null;
 if(anchor)keep.forEach(x=>anchor.appendChild(x.c));
};
function suggestions(q){
 const have=new Set(topics().map(x=>norm(x.t)));
 const tags=TRENDS.map(t=>t[0].replace('#','')),ppl=Object.keys(P).filter(u=>u!=='me').map(u=>P[u].n.split(' ')[0]),cats=['Cooking','Music','Travel','Photo','Tech'];
 const nq=norm(q||'');const all=[...tags,...ppl,...cats].filter(x=>!have.has(norm(x)));return (nq?all.filter(x=>norm(x).includes(nq)):all).slice(0,nq?8:12);
}
function effect(){
 const l=POSTS.filter(p=>hidden(p)).length,b=POSTS.filter(p=>weight(p)>0&&!hidden(p)).length,v=VIDS.filter(x=>hidden(x)).length;
 return `Right now: ${l} post${l===1?'':'s'} and ${v} video${v===1?'':'s'} hidden, ${b} post${b===1?'':'s'} boosted.`;
}
function setT(arr){S.recipe=Object.assign({},S.recipe,{topics:arr,name:'Custom'})}
function panel(){
 const t=topics();
 return `<div class="rtopics"><h4>Your topics</h4><small>Type anything: a hashtag, a person or a subject. Pick how you want to see it, then add it. Your feed changes straight away.</small>
 <input id="rtin" class="rtinput" placeholder="Search or type a topic, e.g. amapiano" autocomplete="off" autocapitalize="none" enterkeyhint="done" aria-label="Add a topic">
 <div class="rtlab">Show it:</div>
 <div class="rtseg" role="group" aria-label="How to show this topic">${Object.entries(MODES).map(([k,l])=>`<button data-x="mode" data-k="${k}" class="m-${k}" aria-pressed="${mode===k}"><i>${k==='more'?'+':k==='less'?'−':'×'}</i>${l}</button>`).join('')}</div>
 <div class="rtmean" id="rtmean">${meaning()}</div>
 <button class="rtgo" data-x="add" id="rtgo">Add topic</button>
 <div class="rtprev" id="rtprev" aria-live="polite"></div>
 ${t.length?`<div class="rtlab">Your topics <span>tap one to switch More, Less or Hide</span></div><div class="rtchips">${t.map((x,i)=>`<span class="rtc ${x.m}"><button class="m" data-x="cyc" data-i="${i}" aria-label="${esc(x.t)}: ${MODES[x.m]}. Tap to change"><i>${MODES[x.m]}</i>${esc(x.t)}</button><button class="x" data-x="del" data-i="${i}" aria-label="Remove ${esc(x.t)}">${I('close',12)}</button></span>`).join('')}</div>`:''}
 <div class="rtsug" id="rtsug">${sugHTML('')}</div>
 <div class="rteff" id="rteff">${effect()}</div></div>`;
}
const meaning=()=>mode==='more'?'You will see more of it, near the top.':mode==='less'?'You will see less of it, lower down.':'It will be hidden from your feed.';
function sugHTML(q){const l=suggestions(q);return (q?'Matches:':'Try:')+(l.length?l.map(x=>`<button data-x="sug" data-t="${esc(x)}">+ ${esc(x)}</button>`).join(''):' <em>nothing matches. Tap Add to use "'+esc(q)+'" anyway.</em>')}
function liveUpdate(){
 const el=document.getElementById('rtin');if(!el)return;const q=el.value.trim();
 const go=document.getElementById('rtgo'),pv=document.getElementById('rtprev'),sg=document.getElementById('rtsug'),mn=document.getElementById('rtmean');
 if(go)go.textContent=q?'Add "'+q+'" as '+MODES[mode]:'Add topic';
 if(mn)mn.textContent=meaning();
 if(sg)sg.innerHTML=sugHTML(q);
 if(pv){if(!q){pv.textContent=''}else{const n=norm(q),c=POSTS.filter(p=>hay(p).includes(n)).length,v=VIDS.filter(p=>hay(p).includes(n)).length;pv.textContent=(c+v)?(c+' post'+(c===1?'':'s')+' and '+v+' video'+(v===1?'':'s')+' match "'+q+'" right now.'):'Nothing matches "'+q+'" right now, but it will apply to new posts.'}}
}
function refresh(){
 const lb=document.querySelector('.sheet .lb'),y=lb?lb.scrollTop:0;
 openRecipe();
 const n=document.querySelector('.sheet .lb');if(n)n.scrollTop=y;
 renderHome();

}
const _or=openRecipe;
openRecipe=function(){
 _or();
 const c=document.querySelector('.sheet .create'),q=c&&c.querySelector('p.q');
 if(q)q.insertAdjacentHTML('beforebegin',panel());
 const note=c&&c.querySelectorAll('p.q')[1];if(note&&mode==='more')note.textContent='Set video or news to 0 to hide it. Topics rank posts only when "Ranked for you" is on; hiding always works.';
};
function add(raw,m){
 const t=raw.trim().replace(/^#/,'');if(!t){toast('Type a topic first');return}
 const cur=topics();if(cur.some(x=>norm(x.t)===norm(t))){toast('Already in your list');return}
 setT([...cur,{t,m}]);toast(MODES[m]+' of "'+t+'"');refresh();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-x]');if(!b)return;
 const a=b.dataset.x;
 if(a==='mode'){mode=b.dataset.k;b.parentElement.querySelectorAll('[data-k]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));liveUpdate();const el=document.getElementById('rtin');if(el&&el.value.trim())toast(MODES[mode]+' selected. Tap Add to apply.')}
 else if(a==='add'){const v=$('#rtin').value;if(!v.trim()){toast('Type a topic first, then tap Add');$('#rtin').focus();return}add(v,mode)}
 else if(a==='sug'){add(b.dataset.t,mode)}
 else if(a==='cyc'){const arr=topics().map(x=>({...x})),x=arr[+b.dataset.i],o=['more','less','hide'];x.m=o[(o.indexOf(x.m)+1)%3];setT(arr);refresh()}
 else if(a==='del'){const arr=topics().filter((_,i)=>i!==+b.dataset.i);setT(arr);refresh()}
});
document.addEventListener('input',e=>{if(e.target.id==='rtin')liveUpdate()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='rtin'){e.preventDefault();add(e.target.value,mode)}});
window.__FX={topics,hidden,weight};
})();

function startWizard(){

function jump(step,msg){T.step=step;wiz();toast(msg)}
function publish(){

 if(!D.n.trim())return jump(1,'Add your name');
 if(!D.headline.trim())return jump(1,'Add a short headline');
 if(!D.fields.length)return jump(2,'Choose at least one field');
 if(D.share==='share'&&!D.email.trim()&&!D.phone.trim()){toast('Add an email or phone, or choose Blend messages only');return}
 const was=!!T.me;
 T.me={...D,n:D.n.trim(),headline:D.headline.trim(),id:'me',ver:{id:false}};delete T.me.xnow;delete T.me.xe;delete T.me.xd;persist();T.draft=null;
 closePanel();refreshJobs();
 const live=T.me.vis==='open';
 openSheet(`<h3>${was?'Profile saved':'Your profile is ready'}</h3><div class="lb"><div class="create" style="text-align:center"><div style="display:grid;place-items:center;margin-bottom:10px">${avatar(T.me,'lg')}</div><p class="q" style="margin:0 0 12px">${live?'Employers can now find you by searching for your skills, field, school or name. You decide who gets your contact details.':'Your profile is hidden. Turn on Employers can find me any time.'}</p><button class="dmbtn" data-tp="seeme" style="width:100%">See what employers see</button><button class="mkbtn ghost" data-tp="done" style="width:100%;margin-top:8px">Done</button></div></div>`);
 if(live&&!T.inbox.length)setTimeout(()=>{T.inbox.push({co:'BrightPath Digital',msg:'Hi '+first(T.me)+', your profile fits a role we are hiring for. Can we chat?',st:'new'});toast('An employer wants to connect');refreshJobs()},6000);

function refreshJobs(){const b=document.querySelector('#s-market .mkseg [data-k=jobs]');if(b&&M.tab==='jobs'){b.click()}}
/* photo to a small square JPEG */
function readPhoto(file){
 if(!file||!/^image\//.test(file.type)){toast('Choose a picture');return}
 const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(im.width,im.height),cv=document.createElement('canvas');cv.width=cv.height=320;cv.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,320,320);collect();T.draft.photo=cv.toDataURL('image/jpeg',.82);wiz()};im.onerror=()=>toast('That picture could not be opened');im.src=fr.result};fr.readAsDataURL(file);
}
/* ----- events ----- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-tp]');if(!b)return;
 const a=b.dataset.tp,id=b.dataset.id,D=T.draft;
 switch(a){
  case 'mode':T.mode=b.dataset.k;if(T.mode==='talent')renderTalent();else refreshJobs();break;
  case 'edit':closeSheet();startWizard();break;
  case 'close':if(document.querySelector('.tpwiz')&&T.draft){collect();toast('Draft kept')}closePanel();break;
  case 'vis':T.me.vis=T.me.vis==='open'?'hidden':'open';persist();refreshJobs();toast(T.me.vis==='open'?'Employers can find you':'Your profile is hidden');break;
  case 'view':viewCand(id);break;
  case 'seeme':closeSheet();viewCand('me');break;
  case 'done':closeSheet();break;
  case 'save':{if(T.saved.has(id)){T.saved.delete(id);toast('Removed from shortlist')}else{T.saved.add(id);toast('Added to your shortlist')}b.setAttribute('aria-pressed',String(T.saved.has(id)));break}

  case 'filters':filterSheet();break;
  case 'fset':{const g=b.dataset.g;let k=b.dataset.k;if(g==='edu')k=+k;if(g==='remote')k=k==='true';T.f[g]=k;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));break}
  case 'freset':T.f={field:T.f.field,edu:0,exp:'any',where:'any',avail:'any',remote:true,sort:'best'};filterSheet();break;
  case 'fdone':closeSheet();fillList();break;
  case 'contact':contactSheet(id);break;
  case 'send':sendReq(id);break;
  case 'reqs':reqSheet();break;
  case 'inbox':inboxSheet();break;
  case 'ans':{const x=T.inbox[+b.dataset.i];x.st=b.dataset.v;inboxSheet();refreshJobs();break}
