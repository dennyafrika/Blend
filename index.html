#splash .springs,#splash .spbits{position:absolute;inset:0;pointer-events:none}

<style>
/* Layout: black-and-white and typographic. Imagery is all monochrome, metadata is set in mono, navigation is a row of words with the current one inverted. Colour is reserved for signals: Live and unread. */
:root{
  --bg:#F2F2F2; --surface:#ffffff; --surface2:#E8E8E8; --ink:#0D0D0D; --muted:#686868; --line:#D9D9D9;
  --accent:#0D0D0D; --accent-ink:#ffffff; --link:#0D0D0D; --reel:#000; --red:#E5242B;
  --font-display:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0B0B; --surface:#141414; --surface2:#1F1F1F; --ink:#F2F2F2; --muted:#9A9A9A; --line:#2A2A2A;
  --accent:#F2F2F2; --accent-ink:#0B0B0B; --link:#F2F2F2; --reel:#000; --red:#FF4D4F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0B0B; --surface:#141414; --surface2:#1F1F1F; --ink:#F2F2F2; --muted:#9A9A9A; --line:#2A2A2A;
  --accent:#F2F2F2; --accent-ink:#0B0B0B; --link:#F2F2F2; --reel:#000; --red:#FF4D4F; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.stage{height:100%;display:grid;place-items:center}
.app{position:relative;width:100%;height:100%;max-width:430px;max-height:880px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:480px){.app{height:min(100%,860px);border-radius:34px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(10,15,30,.18)}}
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:var(--bg)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.03em;display:flex;align-items:baseline;gap:8px}
.logo i{font-style:normal;font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 7px}
.icons{display:flex;gap:4px}
.ib{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.ib:hover{background:var(--surface2)}
.dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.av{--s:40px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:calc(var(--s)*.42);color:#fff;background:linear-gradient(135deg,hsl(var(--c) 80% 60%),hsl(calc(var(--c) + 50) 70% 40%))}
/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px 16px;background:var(--surface);scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;width:66px;flex:none;font-size:12px}
.story span.n{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.ring{padding:3px;border-radius:50%;background:conic-gradient(var(--accent),#ffb020,var(--accent))}
.ring.me{background:var(--line)}
.ring>.in{padding:2px;background:var(--surface);border-radius:50%;position:relative}
.plus{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:2px solid var(--surface)}
/* segmented tabs */
.seg{display:flex;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.seg button{flex:1;padding:12px 0;font-weight:700;color:var(--muted);position:relative}
.seg button[aria-selected="true"]{color:var(--ink)}
.seg button[aria-selected="true"]::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:3px;border-radius:3px;background:var(--accent)}
/* posts */
.post{background:var(--surface);margin-top:8px}
.ph{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.ph .who{flex:1;min-width:0}
.ph b{display:block;font-weight:700;line-height:1.2}
.ph small{color:var(--muted);font-size:12.5px}
.fbtn{font-size:13px;font-weight:700;color:var(--link);padding:6px 10px;border-radius:99px}
.fbtn:hover{background:var(--surface2)}
.ptext{padding:2px 16px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.ptext.big{font-size:18px;line-height:1.35;padding-bottom:12px}
.tag{color:var(--link)}
.art{aspect-ratio:4/5;width:100%;position:relative;overflow:hidden}
.art.wide{aspect-ratio:4/3}
.playbadge{position:absolute;inset:0;display:grid;place-items:center}
.playbadge span{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff;backdrop-filter:blur(4px)}
.vlen{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 8px;border-radius:99px;font-variant-numeric:tabular-nums}
.grp{margin:0 16px 8px;padding:10px 12px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;gap:10px}
.grp .t{flex:1;min-width:0}
.grp b{display:block;font-size:14px}.grp small{color:var(--muted)}
.pill{padding:7px 14px;border-radius:99px;background:var(--ink);color:var(--surface);font-weight:700;font-size:13px}
.pill.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.acts{display:flex;align-items:center;padding:4px 8px 8px}
.act{display:flex;align-items:center;gap:6px;padding:8px;border-radius:99px;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.act:hover{background:var(--surface2)}
.act.on{color:var(--accent)}
.act.on.rp{color:#14a36b}
.act.on.sv{color:var(--link)}
.act svg{flex:none}
.act.on.lk svg{fill:currentColor}
.act.on.sv svg{fill:currentColor}
.sp{flex:1}
.views{font-size:12.5px;color:var(--muted);padding:0 16px 4px;font-variant-numeric:tabular-nums}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
/* nav */
nav{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:grid;place-items:center;height:44px;color:var(--muted);border-radius:12px}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"] svg{stroke-width:2.4}
nav .create{flex:none;width:52px;height:38px;align-self:center;background:var(--accent);color:var(--accent-ink);border-radius:12px}
/* reels */
.reels{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;background:var(--reel);scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;color:#fff;user-select:none;-webkit-user-select:none}
.reel .bg{position:absolute;inset:0}
.blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.75;animation:drift 9s ease-in-out infinite alternate}
.blob.b2{animation-duration:12s;animation-delay:-4s}
@keyframes drift{from{transform:translate(-12%,-8%) scale(1)}to{transform:translate(18%,14%) scale(1.25)}}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),transparent 45%,transparent 75%,rgba(0,0,0,.35));pointer-events:none}
.reeltag{position:absolute;top:14px;left:16px;z-index:2;font-family:var(--font-display);font-weight:700;font-size:20px;display:flex;gap:14px;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.reeltag span{opacity:.6}.reeltag span.cur{opacity:1}
.sample{position:absolute;top:18px;right:16px;z-index:2;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;background:rgba(0,0,0,.4);padding:3px 8px;border-radius:99px}
.rail{position:absolute;right:8px;bottom:24px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px}
.rail .rb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
.rail .rb svg{filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
.rail .rb.on{color:#ff5a6e}.rail .rb.on svg{fill:currentColor}
.rail .rb:not(.avb){padding:4px}
.avb{position:relative;margin-bottom:8px}
.avb .plus{border-color:transparent;bottom:-8px;right:50%;transform:translateX(50%)}
.rcap{position:absolute;left:16px;right:84px;bottom:24px;z-index:2;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.rcap b{display:block;font-size:16px;margin-bottom:4px}
.rcap p{margin:0 0 8px;overflow-wrap:anywhere}
.rcap small{opacity:.9;display:flex;align-items:center;gap:6px}
.burst{position:absolute;z-index:3;font-size:0;pointer-events:none;animation:pop .8s ease-out forwards;color:#ff5a6e}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}40%{transform:translate(-50%,-70%) scale(1.3);opacity:1}100%{transform:translate(-50%,-140%) scale(1);opacity:0}}
/* explore */
.search{display:flex;align-items:center;gap:10px;margin:12px 16px;padding:0 14px;height:44px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.sec{background:var(--surface);margin-top:8px;padding:14px 16px}
.sec h3{margin:0 0 10px;font-family:var(--font-display);font-size:18px;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:12px;padding:8px 0}
.row .t{flex:1;min-width:0}
.row b{display:block;line-height:1.2}.row small{color:var(--muted)}
.trend small{display:block}
.trend b{font-size:16px}
/* profile */
.prof{background:var(--surface);padding:20px 16px 14px;display:flex;flex-direction:column;gap:14px}
.prof .top{display:flex;align-items:center;gap:18px}
.stats{display:flex;flex:1;justify-content:space-around;text-align:center}
.stats b{display:block;font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted)}
.prof h2{margin:0;font-family:var(--font-display);font-size:20px}
.prof p{margin:2px 0 0;color:var(--muted)}
.btns{display:flex;gap:8px}
.btns button{flex:1;padding:9px;border-radius:10px;background:var(--surface2);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--surface)}
.tile{aspect-ratio:1;position:relative;overflow:hidden;display:grid;place-items:center;padding:8px;font-size:12px;line-height:1.3;background:var(--surface2);overflow-wrap:anywhere}
.tile .art{position:absolute;inset:0;aspect-ratio:auto}
/* layers */
.layer{position:absolute;inset:0;z-index:20;background:var(--surface);display:flex;flex-direction:column}
.layer .lh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-family:var(--font-display);font-weight:700;font-size:18px}
.layer .lh .grow{flex:1}
.lb{flex:1;min-height:0;overflow-y:auto}
.thread{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left}
.thread:hover{background:var(--surface2)}
.thread .t{flex:1;min-width:0}
.thread small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{display:flex;gap:12px;padding:12px 16px;align-items:center}
.note.new{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.note p{margin:0;flex:1;min-width:0}
.note small{color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:8px;padding:16px}
.bub{max-width:78%;padding:9px 13px;border-radius:18px;background:var(--surface2);align-self:flex-start;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.composer{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.composer input{flex:1;min-width:0;height:42px;border-radius:99px;border:1px solid var(--line);background:var(--bg);padding:0 16px}
.send{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.4}
.scrim{position:absolute;inset:0;z-index:30;background:rgba(5,8,15,.5);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:82%;background:var(--surface);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
.sheet h3{margin:0;padding:10px 16px;font-family:var(--font-display);font-size:17px;text-align:center}
.cm{display:flex;gap:10px;padding:8px 16px}
.cm p{margin:0;overflow-wrap:anywhere}.cm small{color:var(--muted);display:block}
.create{display:flex;flex-direction:column;gap:12px;padding:4px 16px 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:99px;background:var(--surface2);font-weight:700;display:flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
textarea#newText{width:100%;min-height:110px;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px}
.create .line{display:flex;gap:10px;align-items:center;justify-content:space-between}
select#aud{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px}
.go{padding:11px 22px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.go:disabled{opacity:.4}
#story{background:#000;color:#fff;z-index:40}
.sbars{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:3}
.sbars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.sbars i b{display:block;height:100%;background:#fff;width:0}
.sbars i.done b{width:100%}
.sbars i.cur b{animation:fill 4s linear forwards}
@keyframes fill{to{width:100%}}
.shead{position:absolute;top:28px;left:14px;right:8px;z-index:3;display:flex;align-items:center;gap:10px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.shead b{flex:1}
.szones{position:absolute;inset:0;z-index:2;display:flex}
.szones button{height:100%}
.scap{position:absolute;left:24px;right:24px;bottom:15%;z-index:3;text-align:center;font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.15;text-shadow:0 2px 12px rgba(0,0,0,.4);text-wrap:balance}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:99px;font-weight:500;font-size:14px;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:up .2s ease-out}
/* long-form video (Watch) */
.vsw{display:flex;gap:16px;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em}
.vsw button{opacity:.5}.vsw button[aria-pressed="true"]{opacity:1}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:var(--surface);scrollbar-width:none;border-bottom:1px solid var(--line)}

nav button{flex:1;height:56px;display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:.01em;color:var(--muted);border-radius:0;background:none}
nav button[aria-current="page"]{background:var(--ink);color:var(--surface)}
nav .create{flex:1.2;width:auto;height:42px;align-self:center;margin:0 6px;color:var(--ink);background:none;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--ink)}
nav .create:active{background:var(--ink);color:var(--surface)}
/* ===== Messages and calls ===== */
.dm{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--bg)}
.dmtabs{display:flex;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.dmtabs button{flex:none;display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:99px;font-weight:700;font-size:14px;border:1.5px solid var(--line)}
.dmtabs button[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dmcount{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center;font-family:var(--font-mono)}
.dmsearch{display:flex;align-items:center;gap:8px;margin:12px 16px;padding:0 14px;height:42px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line)}
.dmsearch input{flex:1;min-width:0;border:0;background:none;outline:0;height:100%;color:var(--ink)}
.dmsearch input::placeholder{color:var(--muted)}
.dmstrip{display:flex;gap:14px;overflow-x:auto;padding:16px 16px 12px;scrollbar-width:none;background:var(--surface);border-top:1px solid var(--line)}
.dmstrip::-webkit-scrollbar{display:none}
.dmsec{padding:14px 16px 0;background:var(--surface);font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);display:flex;justify-content:space-between}
.dmn{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.ntw{position:relative;margin-bottom:9px;max-width:76px}
.ntw::after{content:"";position:absolute;left:50%;bottom:-4px;width:9px;height:9px;background:var(--surface2);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.ntb{position:relative;z-index:1;padding:5px 8px;border-radius:12px;background:var(--surface2);font-size:11.5px;line-height:1.2;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:46px}
.ntb.add{background:none;border:1.5px dashed var(--muted);color:var(--muted)}
.dmav{position:relative;display:block;border-radius:50%}
.dmav.ring{padding:3px;background:conic-gradient(#ff3d8b,#ffc933,#12b886,#2b8cff,#8a5cff,#ff3d8b)}
.dmav.ring>span.in{display:flex;padding:2px;background:var(--surface);border-radius:50%}
.dmon{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:#12b886;border:2.5px solid var(--surface)}
.dmlive{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:var(--red);color:#fff;font-size:9px;font-weight:800;letter-spacing:.08em;padding:1px 6px;border-radius:5px;z-index:1}
.dmn .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}
.dmhint{padding:10px 16px;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);background:var(--surface);border-top:1px solid var(--line)}
.dmrow{position:relative;overflow:hidden;background:var(--surface);border-bottom:1px solid var(--line)}
.dmact{position:absolute;right:0;top:0;bottom:0;display:flex;width:216px}
.dmact button{flex:1;font-weight:800;font-size:12px;display:grid;place-items:center;align-content:center;gap:3px}
.dmact .a1{background:#ffc933;color:#14143c}.dmact .a2{background:#2b8cff;color:#fff}.dmact .a3{background:#12b886;color:#14143c}
.dmfg{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;background:var(--surface);text-align:left;touch-action:pan-y;transition:transform .2s;-webkit-user-select:none;user-select:none}
.dmgav{position:relative;width:48px;height:48px;flex:none}
.dmgav .av{position:absolute}
.dmgav .av:first-child{left:0;top:0}.dmgav .av:last-child{right:0;bottom:0;box-shadow:0 0 0 2.5px var(--surface)}
.dmrow .t{flex:1;min-width:0}
.dmrow .t b{display:flex;align-items:center;gap:6px;font-weight:700}
.dmrow.unread .t b,.dmrow.unread .pv{font-weight:800;color:var(--ink)}
.dmrow .pv{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;margin-top:1px}
.dmrow .pv.typing{font-style:italic;color:var(--ink)}
.dmrow .meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);flex:none;min-width:34px}
.dmrow .meta svg{color:var(--muted)}
.dmreq{display:flex;gap:8px;padding:0 16px 14px;background:var(--surface)}
.dmreq button{flex:1;padding:9px;border-radius:99px;font-weight:700;border:1.5px solid var(--ink)}
.dmreq button.p{background:var(--ink);color:var(--surface)}
.dmreqrow{border-bottom:1px solid var(--line);background:var(--surface)}
.dmreqrow .dmfg{cursor:default}
.dmempty{padding:40px 24px;text-align:center;color:var(--muted);background:var(--surface)}
.dmlink{display:block;width:100%;padding:14px 16px;text-align:left;font-family:var(--font-mono);font-size:12.5px;color:var(--muted);background:var(--surface)}
/* chat */
.dmhead{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 4px;border-bottom:1px solid var(--line);background:var(--surface)}
.dmhead .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:2px 4px}
.dmhead .who b{display:block;font-weight:800;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmhead .who small{display:block;font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.dmhead .ib.off{opacity:.35}
.dmsub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.dmsub:empty{display:none}
.dmsub>*{margin:8px 0}
.dmpill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;border:1.5px solid var(--ink);font-weight:700;font-size:12.5px}
.dmnote{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.dmlist{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:3px;background:var(--bg)}
.mday{align-self:center;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 8px}
.msys{align-self:center;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);text-align:center;margin:6px 24px;overflow-wrap:anywhere}
.mrow{display:flex;flex-direction:column;align-items:flex-start;max-width:100%;margin-top:1px}
.mrow.me{align-items:flex-end}
.mrow.gap{margin-top:8px}
.msn{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin:6px 0 2px 6px}
.mb{position:relative;max-width:84%;padding:9px 13px;border-radius:18px 18px 18px 5px;background:var(--surface);border:1px solid var(--line);overflow:hidden;overflow-wrap:anywhere;touch-action:pan-y;transition:transform .15s}
.mrow.me .mb{background:var(--ink);color:var(--surface);border-color:var(--ink);border-radius:18px 18px 5px 18px}
.mb.card{padding:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);width:min(84%,280px)}
.mrow.me .mb.card{background:var(--surface);color:var(--ink)}
.mb.bare{background:none;border:0;padding:0}
.mrow.me .mb.bare{background:none}
.mq{display:block;font-size:12px;padding:5px 9px;margin-bottom:6px;border-left:3px solid currentColor;border-radius:3px;background:rgba(127,127,127,.16);opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtr{display:block;margin-top:6px;padding-top:6px;border-top:1px solid currentColor;font-family:var(--font-mono);font-size:12px;opacity:.85}
.mm{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);margin:3px 6px 0}
.mfuse{position:absolute;left:0;bottom:0;height:3px;background:var(--red)}
.mx{display:flex;gap:4px;margin:-8px 8px 0;position:relative;z-index:1;flex-wrap:wrap}
.mx button{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:13px;font-family:var(--font-mono);color:var(--ink)}
.mx button.mine{border-color:var(--ink)}
.macts{display:flex;gap:6px;margin:6px 4px 2px;flex-wrap:wrap}
.macts button{padding:5px 11px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px;color:var(--ink)}
.emo{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 6px;margin:6px 4px 2px}
.emo button{width:34px;height:34px;font-size:20px;border-radius:50%}
.emo button:hover{background:var(--surface2)}
.dmvn{display:flex;align-items:center;gap:10px;min-width:176px;color:inherit}
.dmvn .pp{width:30px;height:30px;border-radius:50%;background:currentColor;display:grid;place-items:center;flex:none}
.dmvn .pp svg{color:var(--surface)}
.mrow.me .dmvn .pp svg{color:var(--ink)}
.dmvn .wf{display:flex;gap:2px;align-items:center;height:22px;flex:1}
.dmvn .wf i{width:3px;border-radius:2px;background:currentColor;opacity:.35;display:block}
.dmvn .wf i.on{opacity:1}
.dmvn small{font-family:var(--font-mono);font-size:11.5px}
.mclip{position:relative;width:150px;aspect-ratio:9/12;border-radius:14px;display:grid;place-items:center;color:#fff;overflow:hidden}
.mphoto{width:200px;max-width:100%;aspect-ratio:4/5;border-radius:14px}
.monce{display:flex;align-items:center;gap:8px;padding:2px 0;font-weight:700;color:inherit}
.mgrey{display:flex;align-items:center;gap:8px;color:var(--muted);font-family:var(--font-mono);font-size:12.5px}
.mshare .th{display:block;aspect-ratio:16/9;border-radius:0}
.mshare .bd{padding:10px 12px;display:block;text-align:left;width:100%}
.mshare b{display:block;line-height:1.25;margin-bottom:3px}
.mshare small{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.mgift{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px;text-align:center}
.mgift b{font-size:14px}.mgift small{font-family:var(--font-mono);color:var(--muted)}
.mpoll{padding:12px}
.mpoll h4{margin:0 0 10px;font-size:15px;line-height:1.25}
.popt{position:relative;display:block;width:100%;text-align:left;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);margin-bottom:6px;overflow:hidden;font-weight:600}
.popt i{position:absolute;left:0;top:0;bottom:0;background:var(--surface2);z-index:0}
.popt span{position:relative;z-index:1;display:flex;justify-content:space-between;gap:8px}
.popt.mine{border-color:var(--ink)}
.mpoll small{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.mevt{padding:12px}
.mevt .when{display:inline-block;background:var(--ink);color:var(--surface);font-family:var(--font-mono);font-size:11.5px;padding:2px 8px;border-radius:5px;margin-bottom:8px}
.mevt b{display:block;font-size:16px;line-height:1.2}
.mevt small{display:block;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);margin:3px 0 10px}
.rsvp{display:flex;gap:6px}
.rsvp button{flex:1;padding:8px 4px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;font-size:12.5px;display:grid;gap:1px;justify-items:center}
.rsvp button small{margin:0}
.rsvp button.mine{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rsvp button.mine small{color:var(--surface)}
.mcap{position:relative;overflow:hidden;padding:18px 14px;text-align:center;display:grid;gap:4px;justify-items:center;min-height:130px;align-content:center}
.mcap .lk{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center}
.mcap small{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.mcap .cbtn2{margin-top:6px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--ink);font-weight:700;font-size:12.5px}
.mcall{display:flex;align-items:center;gap:10px;padding:10px 12px}
.mcall .ic{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.mcall .ic.miss{background:var(--red);color:#fff}
.mcall b{display:block;font-size:14px}.mcall small{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.mcall button{margin-left:auto;padding:6px 12px;border-radius:99px;border:1.5px solid var(--ink);font-weight:700;font-size:12.5px}
.msr .th{display:block;height:84px}
.msr .bd{padding:8px 12px;display:block}
.msr small{font-family:var(--font-mono);font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
.dmsched{padding:0 12px;background:var(--surface)}
.dmsched:empty{display:none}
.dmsched .sd{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.dmsched .sd span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmsched .sd button{font-weight:700;color:var(--ink)}
.dmcomp{border-top:1px solid var(--line);background:var(--surface);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.dmreply{display:flex;align-items:center;gap:8px;padding:6px 8px 8px;font-size:12.5px;color:var(--muted)}
.dmreply span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--ink);padding-left:8px}
.dmform{display:flex;align-items:center;gap:6px}
.dmin{flex:1;min-width:0;height:42px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;color:var(--ink)}
.dmib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.dmib.fill{background:var(--ink);color:var(--surface)}
.dmform.has-text .dmmic,.dmform.has-text .dmcam{display:none}
.dmform:not(.has-text) .dmsend{display:none}
.dmrec{flex:1;min-width:0;height:42px;border-radius:99px;border:1.5px solid var(--red);color:var(--red);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-family:var(--font-mono);font-size:13px}
.dmrec .rd{width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
.dmoff{padding:12px 14px;text-align:center;color:var(--muted);font-size:13.5px;display:grid;gap:8px;justify-items:center}
.dmoff button{padding:7px 14px;border-radius:99px;border:1.5px solid var(--ink);font-weight:700}
.dmopt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;border-bottom:1px solid var(--line);font-weight:600;text-align:left;color:var(--ink)}
.dmopt:last-child{border-bottom:0}
.dmopt .sw{margin-left:auto}
.dmopt small{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.dmopt.off{opacity:.4}
.dmgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dmgrid .dmopt{border:1.5px solid var(--line);border-radius:12px;padding:12px;flex-direction:column;align-items:flex-start;gap:6px}
.dmfield{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;color:var(--ink);margin-bottom:8px}
.dmbtn{padding:11px 22px;border-radius:99px;background:var(--ink);color:var(--surface);font-weight:700}
.dmbtn.ghost{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.dmbtn:disabled{opacity:.4}
.sw{position:relative;width:48px;height:28px;border-radius:99px;border:1.5px solid var(--ink);background:var(--surface);flex:none;transition:background .2s}
.sw i{position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .25s cubic-bezier(.3,1.3,.5,1),background .2s}
.sw[aria-checked="true"]{background:var(--ink)}
.sw[aria-checked="true"] i{transform:translateX(20px);background:var(--surface)}
.dmsetg{padding:16px 16px 6px;font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dmset{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line)}
.dmset .t{flex:1;min-width:0}
.dmset b{display:block;font-weight:700}
.dmset small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.dmseg{display:flex;gap:6px;margin-top:10px}
.dmseg button{flex:1;padding:8px 4px;border-radius:99px;border:1.5px solid var(--line);font-weight:700;font-size:13px}
.dmseg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dmset.col{display:block}
.dmtry{display:grid;gap:8px;padding:12px 16px 24px;background:var(--surface);border-top:1px solid var(--line)}
.dmtry button{padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;text-align:left;display:flex;align-items:center;gap:10px}
.dmfoot{padding:10px 16px 24px;font-size:12.5px;color:var(--muted);font-family:var(--font-mono)}
.dmpick{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;text-align:left;border-bottom:1px solid var(--line)}
.dmpick .ck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;color:var(--surface)}
.dmpick[aria-pressed="true"] .ck{background:var(--ink)}
.dmpick .t{flex:1;min-width:0}.dmpick b{display:block}.dmpick small{color:var(--muted);font-family:var(--font-mono);font-size:11.5px}
.dmsum{margin:0;padding:0 0 0 18px;display:grid;gap:8px}
.dmsum li{line-height:1.35}
.dmstory{position:absolute;left:12px;right:12px;bottom:14px;z-index:5;display:flex;gap:8px}
.dmstory input{flex:1;min-width:0;height:44px;border-radius:99px;border:1.5px solid rgba(255,255,255,.7);background:rgba(0,0,0,.35);color:#fff;padding:0 16px}
.dmstory input::placeholder{color:rgba(255,255,255,.8)}
.dmstory button{width:44px;height:44px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.pv-view{position:absolute;inset:0;z-index:42;background:#000;color:#fff;display:flex;flex-direction:column}
.pv-view .art2{flex:1;margin:56px 16px 12px;border-radius:12px;filter:grayscale(1)}
.pv-view p{text-align:center;font-family:var(--font-mono);font-size:12.5px;margin:0 16px 16px}
.pv-view button{align-self:center;margin-bottom:24px}
/* calls */
.callv{z-index:45;background:#000;color:#fff}
.callv .top{padding:18px 16px 0;text-align:center;position:relative;z-index:2}
.callv .top b{display:block;font-family:var(--font-display);font-weight:800;font-size:22px}
.callv .top small{font-family:var(--font-mono);font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
.callv .cstage{flex:1;min-height:0;position:relative;margin:12px 12px 0;border-radius:20px;overflow:hidden;display:grid}
.callv .cstage.grid2{grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:6px;border-radius:0;overflow:visible}
.ctile{position:relative;overflow:hidden;border-radius:16px;background:#1b1b1b;display:grid;place-items:center;min-height:0}
.ctile .bgf{position:absolute;inset:0;filter:grayscale(1);opacity:.9}
.ctile .bgf .blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.6;animation:drift 9s ease-in-out infinite alternate}
.ctile .lab{position:absolute;left:10px;bottom:8px;z-index:2;font-size:13px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:6px}
.ctile .big{position:relative;z-index:1;display:grid;place-items:center;gap:10px}
.ctile .big .av{box-shadow:0 0 0 0 rgba(255,255,255,.4);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 22px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.ctile.cam-off .bgf{opacity:.25}
.callv .pip{position:absolute;right:12px;bottom:12px;width:92px;aspect-ratio:3/4;z-index:3;border-radius:14px;border:2px solid #fff;font-size:12px}
.callv .cstage.voice{place-items:center;background:#0f0f0f}

/* ===== Look and feel: palette, writing style, transparency ===== */
:root{--aop:1;--pstr:0}
.ring,.dmav.ring{background:conic-gradient(color-mix(in srgb,#ff3d8b calc(var(--aop)*100%),transparent),color-mix(in srgb,#ffc933 calc(var(--aop)*100%),transparent),color-mix(in srgb,#12b886 calc(var(--aop)*100%),transparent),color-mix(in srgb,#2b8cff calc(var(--aop)*100%),transparent),color-mix(in srgb,#8a5cff calc(var(--aop)*100%),transparent),color-mix(in srgb,#ff3d8b calc(var(--aop)*100%),transparent))}
.gb{background:linear-gradient(90deg,rgba(255,61,139,calc(.92*var(--aop))),rgba(255,140,60,calc(.25*var(--aop))))}
html[data-pal]{--bg:color-mix(in srgb,var(--pal) calc(var(--pstr)*1%),#F2F2F2);--surface:color-mix(in srgb,var(--pal) calc(var(--pstr)*.45%),#ffffff);--surface2:color-mix(in srgb,var(--pal) calc(var(--pstr)*1.1%),#E8E8E8);--line:color-mix(in srgb,var(--pal) calc(var(--pstr)*.8%),#D9D9D9)}
@media (prefers-color-scheme:dark){html[data-pal]:not([data-theme="light"]){--bg:color-mix(in srgb,var(--pal) calc(var(--pstr)*.6%),#0B0B0B);--surface:color-mix(in srgb,var(--pal) calc(var(--pstr)*.35%),#141414);--surface2:color-mix(in srgb,var(--pal) calc(var(--pstr)*.8%),#1F1F1F);--line:color-mix(in srgb,var(--pal) calc(var(--pstr)*.6%),#2A2A2A)}}
html[data-pal][data-theme="dark"]{--bg:color-mix(in srgb,var(--pal) calc(var(--pstr)*.6%),#0B0B0B);--surface:color-mix(in srgb,var(--pal) calc(var(--pstr)*.35%),#141414);--surface2:color-mix(in srgb,var(--pal) calc(var(--pstr)*.8%),#1F1F1F);--line:color-mix(in srgb,var(--pal) calc(var(--pstr)*.6%),#2A2A2A)}
.palbtn{width:40px;height:40px;display:grid;place-items:center;margin-right:2px}
.palbtn .pd{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);background:conic-gradient(#ff3d8b,#ffc933,#12b886,#2b8cff,#8a5cff,#ff3d8b)}
.palgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
.psw{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;background-clip:padding-box}
.psw[aria-pressed="true"]{outline:2.5px solid var(--ink);outline-offset:2px}
.psw.none{background:var(--surface2);color:var(--ink)}
.psw.cust{position:relative;overflow:hidden;background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.psw.cust input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:6px 0 14px;font-weight:700}
.prow b{font-family:var(--font-mono);font-weight:500;color:var(--muted)}
.prow small{grid-column:1/-1;color:var(--muted);font-weight:400;font-size:12.5px}
.prow input{grid-column:1/-1;width:100%;accent-color:var(--ink);height:28px}
.fontlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.fontlist button{padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);text-align:left;font-size:16px;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fontlist button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.palprev{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);margin-bottom:14px}
.palprev b{display:block}
.palprev small{color:var(--muted)}

.mkwarn{display:flex;gap:10px;padding:10px 12px;border:1.5px solid var(--red);color:var(--red);border-radius:12px;margin:8px 0;font-size:13.5px;background:var(--surface)}
.mkwarn svg{flex:none;margin-top:1px}
.mkok{display:flex;gap:10px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:12px;margin:8px 0;font-size:13.5px;background:var(--surface)}
.mkstatus{display:flex;gap:6px;align-items:center;font-family:var(--font-mono);font-size:12px}
.mkdot{width:9px;height:9px;border-radius:50%;background:var(--ink);flex:none}
.mkdot.w{background:var(--red)}.mkdot.g{background:#12b886}.mkdot.y{background:#e0a100}
.mkact{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);background:var(--surface)}
.mkact button{flex:none;padding:12px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.mkact button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.mkrange{width:100%;accent-color:var(--ink)}
.mkc{min-width:0}.mkc>.mkc{width:100%}

.mkfab{position:absolute;z-index:25;width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--surface);border:2px solid var(--surface);box-shadow:0 6px 18px rgba(0,0,0,.35);display:grid;place-items:center;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.mkfab.drag{cursor:grabbing;transform:scale(1.1);box-shadow:0 10px 26px rgba(0,0,0,.45)}
.mkfab.on{background:var(--surface);color:var(--ink);border-color:var(--ink)}
.mkfab:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* ===== Custom feed topics in the recipe ===== */
.rtopics{margin:12px 0 4px;padding:12px;border:1.5px solid var(--ink);border-radius:14px;background:var(--surface)}
.rtopics h4{margin:0 0 2px;font-family:var(--font-display);font-size:16px}
.rtopics>small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:10px}
.rtadd{display:flex;gap:6px;flex-wrap:wrap}
.rtadd input{flex:1 1 100%;min-width:0;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;color:var(--ink)}
.rtseg{display:flex;flex:1;gap:6px}
.rtseg button{flex:1;padding:8px 4px;border-radius:99px;border:1.5px solid var(--line);font-weight:700;font-size:13px}
.rtseg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rtgo{padding:8px 18px;border-radius:99px;background:var(--ink);color:var(--surface);font-weight:800}
.rtgo:disabled{opacity:.4}
.rtchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rtc{display:inline-flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;font-size:13px;font-weight:700}
.rtc button{padding:6px 10px}
.rtc .m{display:flex;align-items:center;gap:6px;font-family:var(--font-mono)}
.rtc .m i{font-style:normal;font-size:11px;padding:0 6px;border-radius:99px;background:var(--ink);color:var(--surface)}
.rtc.less{border-style:dashed}
.rtc.hide{border-color:var(--red);color:var(--red)}
.rtc.hide .m i{background:var(--red);color:#fff}
.rtc .x{border-left:1.5px solid currentColor;padding:6px 9px}
.rtsug{margin-top:12px;font-size:12.5px;color:var(--muted)}
.rtsug button{margin:6px 6px 0 0;padding:4px 10px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;color:var(--ink)}
.rteff{margin-top:10px;font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}

/* clearer topic controls */
.rtopics .rtinput{width:100%;box-sizing:border-box;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;color:var(--ink);font-size:16px}
.rtopics .rtinput:focus{outline:2px solid var(--accent);border-color:transparent}
.rtlab{margin:12px 0 6px;font-size:12.5px;font-weight:800}.rtlab span{font-weight:500;color:var(--muted)}
.rtopics .rtseg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rtopics .rtseg button{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:800;font-size:14px}
.rtopics .rtseg button i{font-style:normal;font-size:17px;line-height:1}
.rtopics .rtseg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rtopics .rtseg .m-more[aria-pressed="true"]{background:#1f9d57;border-color:#1f9d57;color:#fff}
.rtopics .rtseg .m-less[aria-pressed="true"]{background:#d98a00;border-color:#d98a00;color:#fff}
.rtopics .rtseg .m-hide[aria-pressed="true"]{background:#d6336c;border-color:#d6336c;color:#fff}
.rtmean{margin:8px 2px 0;font-size:12.5px;color:var(--muted)}
.rtopics .rtgo{display:block;width:100%;height:48px;margin-top:10px;border-radius:99px;background:var(--grad,var(--ink));color:#fff;font-weight:800;font-size:15px;padding:0 16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtprev{min-height:18px;margin-top:8px;font-size:12.5px;color:var(--ink)}
.rtsug em{font-style:normal}

/* ===== Earnings wallet and virtual card ===== */
.wlmini{display:grid;gap:4px;width:calc(100% - 32px);margin:12px 16px 0;padding:14px;text-align:left;border:1.5px solid var(--ink);border-radius:14px;background:var(--surface)}
.wlmini span.k{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wlmini b{font-family:var(--font-display);font-size:26px;letter-spacing:-.02em}
.wlmini small{color:var(--muted)}
.wlmini .mkbtn{justify-self:start;margin-top:6px}
.wlbal{margin:14px 16px 0;padding:18px;border-radius:18px;background:var(--ink);color:var(--surface)}
.wlbal small{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.wlbal b{display:block;font-family:var(--font-display);font-size:38px;letter-spacing:-.03em;margin:2px 0 10px}
.wlbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:rgba(127,127,127,.35);gap:2px}
.wlbar i{display:block;height:100%}
.wlbar i:nth-child(1){background:#ff3d8b}.wlbar i:nth-child(2){background:#2b8cff}.wlbar i:nth-child(3){background:#ffc933}
.wlkey{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px}
.wlkey span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.wlkey .g::before{background:#ff3d8b}.wlkey .v::before{background:#2b8cff}.wlkey .r::before{background:#ffc933}
.wlacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 16px 0}
.wlacts button{display:grid;justify-items:center;gap:5px;padding:12px 4px;border:1.5px solid var(--ink);border-radius:14px;background:var(--surface);font-weight:700;font-size:12.5px}
.wlh{margin:22px 16px 6px;font-family:var(--font-display);font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.wlh small{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-weight:400}
.wlrow{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);width:100%;text-align:left}
.wlrow .ic{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.wlrow .t{flex:1;min-width:0}.wlrow b{display:block;font-size:14.5px}.wlrow small{display:block;color:var(--muted);font-family:var(--font-mono);font-size:11px}
.wlrow .a{font-family:var(--font-mono);font-weight:500}
.wlrow .a.neg{color:var(--ink)}.wlrow .a.pos{color:#0a8f68}.wlrow .a.dec{color:var(--red);text-decoration:line-through}
.wlcard{position:relative;margin:14px 16px 0;aspect-ratio:1.586;max-width:380px;border-radius:18px;padding:18px;color:#fff;background:radial-gradient(circle at 18% 18%,#4a4a4a 0,transparent 55%),linear-gradient(145deg,#1c1c1c,#050505);box-shadow:0 10px 26px rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.wlcard.frozen{filter:grayscale(1) brightness(.7)}
.wlcard .top{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.wlcard .top small{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;border:1px solid rgba(255,255,255,.6);border-radius:5px;padding:1px 6px;font-weight:500}
.wlcard .chip{width:42px;height:32px;border-radius:7px;background:linear-gradient(135deg,#d9d9d9,#8c8c8c)}
.wlcard .num{font-family:var(--font-mono);font-size:19px;letter-spacing:.08em}
.wlcard .meta{display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--font-mono);font-size:12px}
.wlcard .tapic{position:absolute;right:16px;top:60px;opacity:.8}
.wlcard .badge{position:absolute;left:18px;top:56px;font-family:var(--font-mono);font-size:11px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:99px}
.wlcard.sm{margin:0;max-width:none;padding:14px;aspect-ratio:auto;height:112px;box-shadow:none}
.wlcard.sm .num{font-size:15px}
.wlswitch{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.wlswitch .t{flex:1;min-width:0}.wlswitch b{display:block}.wlswitch small{color:var(--muted);font-size:12.5px}
.wltap{position:absolute;inset:0;z-index:48;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.wltap h2{font-family:var(--font-display);font-size:24px;margin:8px 0 4px;text-align:center}
.wltap p{opacity:.8;margin:0 0 14px;text-align:center;font-size:14px}
.wlwave{position:relative;width:170px;height:170px;display:grid;place-items:center;margin:10px 0 16px}
.wlwave::before,.wlwave::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.7);animation:wlring 2.2s infinite}
.wlwave::after{animation-delay:1.1s}
.wlwave i{width:70px;height:70px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-style:normal}
@keyframes wlring{from{transform:scale(.4);opacity:1}to{transform:scale(1.15);opacity:0}}
.wltap .opts{display:grid;gap:8px;width:100%}
.wltap .opts button{display:flex;justify-content:space-between;padding:13px 14px;border:1.5px solid rgba(255,255,255,.55);border-radius:14px;font-weight:700;text-align:left}
.wltap .opts button[aria-pressed="true"]{background:#fff;color:#000}
.wltap .res{width:100%;padding:16px;border-radius:14px;margin-top:12px;text-align:center;font-weight:700}
.wltap .res.ok{background:#12b886;color:#04261c}.wltap .res.no{background:var(--red);color:#fff}
.wltap .seg2{display:flex;gap:8px;width:100%;margin-bottom:12px}
.wltap .seg2 button{flex:1;padding:9px;border-radius:99px;border:1.5px solid rgba(255,255,255,.55);font-weight:700}
.wltap .seg2 button[aria-pressed="true"]{background:#fff;color:#000}
.wltap .x{align-self:flex-end;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}

/* ===== Talent profiles under Jobs ===== */
.tpseg{display:flex;margin:12px 16px 0;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden}
.tpseg button{flex:1;padding:9px 6px;font-weight:800;font-size:14px}
.tpseg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tpme{margin:12px 16px 0;padding:16px;border-radius:16px;background:var(--ink);color:var(--surface)}
.tpme h4{margin:0 0 4px;font-family:var(--font-display);font-size:19px;letter-spacing:-.01em}
.tpme p{margin:0 0 12px;opacity:.8;font-size:13.5px;line-height:1.4}
.tpme .tpbtn{background:var(--surface);color:var(--ink);height:42px;padding:0 18px;border-radius:99px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.tpme.has{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink)}
.tpme .row1{display:flex;gap:12px;align-items:center}
.tpme .row1 .t{flex:1;min-width:0}.tpme .row1 b{display:block;font-size:16px}.tpme .row1 small{display:block;opacity:.7;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpmeter{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:12px 0 4px}
.tpmeter i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s}
.tpme small.hint{display:block;color:var(--muted);font-size:12.5px;margin-bottom:10px}
.tpme .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tpsw{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0 2px}
.tpsw .t{flex:1}.tpsw b{display:block;font-size:14px}.tpsw small{color:var(--muted);font-size:12px}
.tpsw .k{width:44px;height:26px;border-radius:99px;background:var(--surface2);border:1.5px solid var(--ink);position:relative;flex:none}
.tpsw .k::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .18s}
.tpsw[aria-checked="true"] .k{background:var(--ink)}
.tpsw[aria-checked="true"] .k::after{transform:translateX(18px);background:var(--surface)}
.tpav{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--ink) center/cover no-repeat;color:var(--surface);font-family:var(--font-display);font-weight:800;font-size:20px}
.tpav.lg{width:92px;height:92px;font-size:34px}
.tpav.sm{width:44px;height:44px;font-size:17px}
.tpw{position:relative;border-bottom:1px solid var(--line);background:var(--surface)}
.tpw .mkcard{border-bottom:0;padding-right:54px}
.tpw .tpheart{position:absolute;right:8px;top:10px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.tpw .tpheart[aria-pressed="true"]{color:var(--red)}
.tpw .tpheart[aria-pressed="true"] svg{fill:currentColor}
.tpchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tpchips span{padding:3px 9px;border-radius:99px;background:var(--surface2);font-size:12px;font-weight:600}
.tpchips span.inv{background:var(--ink);color:var(--surface)}
.tpflag{display:inline-block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--ink);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px}
.tpflag.ink{background:var(--ink);color:var(--surface)}
.tpprog{display:flex;gap:5px;padding:0 16px 12px}
.tpprog i{flex:1;height:5px;border-radius:99px;background:var(--surface2)}
.tpprog i.on{background:var(--ink)}
.tpwiz{padding:6px 16px 110px}
.tpwiz h2{margin:6px 0 2px;font-family:var(--font-display);font-size:24px;letter-spacing:-.02em}
.tpwiz>p{margin:0 0 6px;color:var(--muted);font-size:14px}
.tpdock{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.tpdock .mkbtn{flex:1}
.tpph{display:flex;gap:14px;align-items:center;margin:10px 0 4px}
.tpph .mkbtn{flex:none}
.tpcount{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);text-align:right;margin-top:-6px}
.tpitem{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px}
.tpitem .t{flex:1;min-width:0}.tpitem b{display:block;font-size:14px}.tpitem small{display:block;color:var(--muted);font-size:12.5px}
.tpitem button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);flex:none}
.tpadd{border:1.5px dashed var(--line);border-radius:14px;padding:12px;margin-top:8px}
.tprow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpsec{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.tpsec h3{margin:0 0 8px;font-family:var(--font-display);font-size:16px}
.tpsec p{margin:0;line-height:1.5;font-size:14.5px}
.tpsec .kv{display:flex;gap:10px;padding:4px 0;font-size:14px}.tpsec .kv span:first-child{width:112px;color:var(--muted);flex:none}
.tptl{border-left:2px solid var(--ink);margin-left:6px;padding-left:14px}
.tptl>div{position:relative;padding-bottom:14px}
.tptl>div::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--ink)}
.tptl b{display:block;font-size:14.5px}.tptl small{display:block;color:var(--muted);font-size:12.5px}.tptl p{font-size:13.5px;margin-top:3px}
.tphero{padding:18px 16px 14px;text-align:center;background:var(--surface);border-bottom:1px solid var(--line)}
.tphero .tpav{margin:0 auto 10px}
.tphero h2{margin:0;font-family:var(--font-display);font-size:22px}
.tphero p{margin:2px 0 8px;color:var(--muted)}
.tphero .tpchips{justify-content:center}
.tpbanner{margin:12px 16px 0;padding:10px 12px;border:1.5px dashed var(--ink);border-radius:12px;font-size:13px}
.tpreq{padding:12px 0;border-bottom:1px solid var(--line)}
.tpreq .acts{display:flex;gap:8px;margin-top:8px}
.tpreq p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.tpok{margin-top:6px;padding:8px 10px;background:var(--surface2);border-radius:10px;font-size:13px}

/* ===== Context search ===== */
.srchbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.srchbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#s-videos .topbar,#s-explore .topbar{position:relative}
.reeltag .srchbtn{position:static;width:34px;height:34px;margin:-3px 0 0 2px;background:rgba(0,0,0,.45);color:#fff;text-shadow:none}
#s-videos .topbar .srchbtn{position:absolute;right:12px;top:50%;transform:translateY(-50%)}
#s-explore .topbar .srchbtn{position:absolute;right:12px;top:6px}
.srch{position:absolute;inset:0;z-index:45;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;animation:srin .16s ease-out}
@keyframes srin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.srch .sh{display:flex;align-items:center;gap:6px;padding:10px 12px 8px}
.srch .sbox{flex:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:99px;background:var(--surface2);border:1.5px solid transparent;min-width:0}
.srch .sbox:focus-within{border-color:var(--ink)}
.srch .sbox input{flex:1;min-width:0;border:0;background:transparent;color:inherit;font:inherit;font-size:16px;outline:none}
.srch .sbox input::-webkit-search-cancel-button{display:none}
.srch .sx{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--surface)}
.srch .scope{display:flex;gap:6px;padding:0 12px 8px;align-items:center}
.srch .scope .seg{display:flex;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;flex:none}
.srch .scope .seg button{white-space:nowrap;padding:6px 11px;font-weight:700;font-size:13px}
.srch .scope .seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.srch .scope small{color:var(--muted);font-size:12.5px;min-width:0}
.srch .kinds{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.srch .kinds::-webkit-scrollbar{display:none}
.srch .kinds button{flex:none;padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.srch .kinds button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.srch .kinds b{font-family:var(--font-mono);font-weight:500;margin-left:5px;opacity:.7}
.srch .sbody{flex:1;overflow-y:auto;padding-bottom:30px;border-top:1px solid var(--line)}
.srch .sg{margin:16px 16px 4px;font-family:var(--font-display);font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.srch .sg small{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-weight:400}
.srch .srow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 16px;border-bottom:1px solid var(--line)}
.srch .srow:hover,.srch .srow:focus-visible{background:var(--surface2)}
.srch .sth{width:46px;height:46px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;overflow:hidden;font-weight:800;position:relative}
.srch .sth.round{border-radius:50%}

.bkbtnrow{background:none}.bkrow.danger b{color:var(--red)}

/* ===== Ember ===== */
html[data-halo]{--emnav:96px;--font-display:'Plus Jakarta Sans',system-ui,sans-serif;--font-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
html[data-halo][data-theme="dark"]{--bg:#0C0E16;--surface:#151826;--surface2:#1E2136;--ink:#F2F3F8;--muted:#8F96AD;--line:#252A3F;--accent:#8B7DFF;--accent-ink:#0C0E16;--link:#A99FFF;--red:#FF9466;--reel:#000;color-scheme:dark}
html[data-halo][data-theme="light"]{--bg:#F4F5F7;--surface:#FFFFFF;--surface2:#ECEAFF;--ink:#101322;--muted:#667085;--line:#E4E7EC;--accent:#5B4BFF;--accent-ink:#FFFFFF;--link:#5B4BFF;--red:#FF7A45;--reel:#000;color-scheme:light}
html[data-halo] body,html[data-halo] .app,html[data-halo] .scroll,html[data-halo] .screen{background:var(--bg);color:var(--ink);font-family:var(--font-body)}
html[data-halo] .av{filter:none}
/* header */
html[data-halo] .topbar{background:transparent;border:0;padding:max(14px,env(safe-area-inset-top,0px)) 16px 6px}
html[data-halo] .logo{font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:-.03em;font-style:italic}
html[data-halo] .logo::after{content:".";color:var(--accent);font-style:normal}
html[data-halo] .icons{gap:2px}
html[data-halo] .icons .theme{display:none}
html[data-halo] .ib,html[data-halo] .emplus{color:var(--ink)}
html[data-halo] .emplus{width:40px;height:40px;display:grid;place-items:center;margin:0}
html[data-halo] .dot{background:var(--accent);border-color:var(--bg)}
/* look sheet row */
.emth{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 10px}
.emth span{font-weight:700;font-size:14px}
.emseg{display:flex;border:1.5px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.emseg button{padding:6px 14px;border-radius:99px;font-weight:700;font-size:13px;color:var(--muted)}
.emseg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
/* home order: stories, tabs, tools, posts */
html[data-halo] #homeBody{display:flex;flex-direction:column}
html[data-halo] #homeBody>*{order:5;flex:none}
html[data-halo] #homeBody>.stories{order:1;scroll-snap-align:start}
html[data-halo] #homeBody>.seg{order:2}
html[data-halo] #homeBody>.tools{order:3}
html[data-halo] .stories{background:transparent;border:0;padding:8px 16px 10px}
html[data-halo] .ring{background:conic-gradient(#ffb020,#ff6a3d,#ff3d8b,#8a5cff,#ffb020)}
html[data-halo] .ring.me{background:none;box-shadow:inset 0 0 0 1.5px var(--muted)}
html[data-halo] .ring>.in{background:var(--bg)}
html[data-halo] .plus{background:var(--accent);color:var(--accent-ink);border:2px solid var(--bg)}
html[data-halo] .story .n{color:var(--muted);font-size:12px}
html[data-halo] .seg,html[data-halo] .seg.nv3{position:static;margin:4px 14px 0;padding:4px;gap:2px;border-radius:22px;background:var(--surface2);border:1px solid var(--line)}
html[data-halo] .seg button,html[data-halo] .seg.nv3 button{border-radius:18px;padding:10px 0;font-size:14.5px;font-weight:600;color:var(--muted)}
html[data-halo] .seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
html[data-halo] .seg button[aria-selected="true"]::after{display:none}
html[data-halo] .tools{background:transparent;border:0;padding:12px 14px 6px}
html[data-halo] .tool{background:var(--surface2);border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:13px;padding:8px 14px}
html[data-halo] .tool.live{background:var(--surface2);color:var(--ink);border-color:var(--line)}
html[data-halo] .scroll{padding-bottom:calc(var(--emnav) - 10px)}
html[data-halo] #homeScroll{padding-bottom:0}
/* floating pill nav */
html[data-halo] nav#nav{position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:17;display:flex;align-items:center;gap:2px;padding:7px;border:1px solid var(--line);border-radius:32px;background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 12px 34px rgba(0,0,0,.5)}

html[data-halo] nav#nav button .ei{display:grid;place-items:center;flex:none}
html[data-halo] nav#nav button .ei svg{width:23px;height:23px}
html[data-halo] nav#nav button .lb{max-width:0;opacity:0;white-space:nowrap;overflow:hidden;transition:max-width .42s ease,opacity .22s}
html[data-halo] nav#nav button[aria-current="page"]{flex-grow:2.7;gap:8px;background:var(--accent);color:var(--accent-ink)}
html[data-halo] nav#nav button[aria-current="page"] .lb{max-width:70px;opacity:1;transition:max-width .42s ease,opacity .3s .1s}
html[data-halo] nav#nav button[aria-current="page"] svg{stroke-width:2.3}
html[data-halo] nav#nav .emask{flex:0 0 52px;height:52px;border-radius:26px;background:var(--ink);color:var(--bg);transition:flex-basis .42s cubic-bezier(.3,1.25,.4,1),background-color .3s,color .3s,gap .3s;margin:0 3px}
html[data-halo] nav#nav .emask[aria-current="page"]{flex:0 0 104px;background:var(--accent);color:var(--accent-ink);gap:6px}
html[data-halo] nav#nav [data-k=me] .av{--s:30px;filter:none}
html[data-halo] nav#nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* floating new-post button */
html[data-halo] .mkfab{background:var(--accent);color:var(--accent-ink);border:2px solid color-mix(in srgb,var(--bg) 70%,transparent);box-shadow:0 8px 26px rgba(255,140,0,.45)}
html[data-halo] .mkfab.on{background:var(--surface);color:var(--ink);border-color:var(--accent)}
/* assistant panel leaves room for the pill */
html[data-halo] .aip #aform{margin-bottom:calc(var(--emnav) - 14px)}
/* sheets and cards */
html[data-halo] .sheet{background:var(--surface);border-radius:26px 26px 0 0}
@media (max-width:340px){html[data-halo] nav#nav button[aria-current="page"] .lb{max-width:54px;font-size:13px}}

html[data-halo] .art,html[data-halo] .pimg img,html[data-halo] .pvid video,html[data-halo] .pms img,html[data-halo] .cap .cb{filter:none}
html[data-halo] #homeBody .post:not(:has(>.art,>.pimg,>.pvid,>.pmed,>.pcard)) .views{order:3;padding-top:2px}
html[data-halo] #homeBody .post .why{order:3;padding:2px 76px 4px 16px;color:rgba(255,255,255,.8);position:relative}

html[data-halo] .logo{font-family:var(--font-display);font-style:normal;font-weight:800;font-size:26px;letter-spacing:-.04em}

html[data-halo] .icons .theme{display:flex}
html[data-halo] .ring{background:conic-gradient(var(--accent) 0 70%,var(--line) 0)}
html[data-halo] .seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,19,34,.12)}
html[data-halo] .seg,html[data-halo] .seg.nv3{background:var(--surface2);border:0}
html[data-halo] .tool{background:var(--surface);border:1px solid var(--line)}
html[data-halo] #homeBody .post{background:var(--surface);border:1px solid var(--line);border-radius:24px;margin:10px 14px;overflow:hidden}
html[data-halo] #homeBody .post .ph .av{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
html[data-halo] #homeBody .post .ptext .tag{color:var(--accent);font-weight:700}

html[data-halo] nav#nav{background:var(--surface);box-shadow:0 12px 30px rgba(16,19,34,.14);backdrop-filter:none}

const snap=(id,row)=>({id,exists:!!row,data:()=>row?JSON.parse(JSON.stringify(row)):undefined,metadata:{fromCache:false,hasPendingWrites:false}});

async function runQuery(c,f,ord,lim){
 const PAGE=1000,out=[];let from=0;
 for(;;){
  let q=sb.from('docs').select('id,data').eq('col',c);
  f.forEach(([a,op,v])=>{const k='data->>'+a;
   if(op==='==')q=q.eq(k,String(v));else if(op==='!=')q=q.neq(k,String(v));else if(op==='in')q=q.in(k,v.map(String))});
  q=q.order(ord?'data->'+ord[0]:'id',{ascending:ord?ord[1]!=='desc':true});
  const want=lim?Math.min(PAGE,lim-out.length):PAGE;
  const r=await q.range(from,from+want-1);
  if(r.error)throw err(r.error);
  out.push(...r.data);
  if(r.data.length<want||(lim&&out.length>=lim))break;
  from+=want}
 const docs=out.map(x=>snap(x.id,x.data));
 return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}}}

function watch(c,run,fn,onErr){
 let last='',stopped=false,timer=null,ch=null;
 const tick=async()=>{if(stopped)return;try{const r=await run();const s=JSON.stringify(r.docs.map(d=>[d.id,d.data()]));if(s!==last){last=s;fn(r)}}catch(e){onErr&&onErr(e)}};
 const kick=()=>{clearTimeout(timer);timer=setTimeout(tick,200)};
 ready().then(()=>{if(stopped)return;tick();
  try{ch=sb.channel('c'+rid()).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'col=eq.'+c},kick).subscribe()}catch(e){}});
 const poll=setInterval(()=>{if(!document.hidden)tick()},8000);
 return()=>{stopped=true;clearInterval(poll);clearTimeout(timer);try{ch&&sb.removeChannel(ch)}catch(e){}}}

function colRef(path,f=[],ord=null,lim=0){
 const run=async()=>{await ready();return runQuery(path,f,ord,lim)};
 const q={path,
  where:(a,o,v)=>colRef(path,[...f,[a,o,v]],ord,lim),
  orderBy:(a,d)=>colRef(path,f,[a,d||'asc'],lim),
  limit:n=>colRef(path,f,ord,n),
  get:run,
  onSnapshot:(fn,onErr)=>watch(path,run,fn,onErr),
  doc:id=>docRef(path+'/'+(id||rid())),
  add:async d=>{await ready();const id=rid();const r=await sb.from('docs').insert({col:path,id,data:d});if(r.error)throw err(r.error);return docRef(path+'/'+id)}};
 return q}

function docRef(path){
 const s=segs(path),id=s[s.length-1],c=s.slice(0,-1).join('/');
 const get=async()=>{await ready();const r=await sb.from('docs').select('data').eq('col',c).eq('id',id).maybeSingle();if(r.error)throw err(r.error);return snap(id,r.data&&r.data.data)};
 return{id,path,get,
  set:async d=>{await ready();const r=await sb.from('docs').upsert({col:c,id,data:d},{onConflict:'col,id'});if(r.error)throw err(r.error)},
  update:async d=>{await ready();const ex=await get();if(!ex.exists)throw{code:'invalid_argument',message:'missing'};const r=await sb.rpc('docs_merge',{p_col:c,p_id:id,p_patch:d});if(r.error)throw err(r.error)},
  delete:async()=>{await ready();const r=await sb.from('docs').delete().eq('col',c).eq('id',id);if(r.error)throw err(r.error)},
  acquire:async()=>({acquired:true}),
  onSnapshot:(fn,onErr)=>watch(c,get,fn,onErr),
  collection:n=>colRef(path+'/'+n)}}

const db={doc:docRef,collection:n=>colRef(n)};

/* ---------- Home ---------- */

function actsHTML(p){

function postHTML(p){

  else body+=`<div class="art" style="${art(p.c)}">${p.type==='video'?`<button class="playbadge" data-a="vopen" data-id="${p.vid}" aria-label="Watch video"><span>${I('play',28)}</span></button><span class="vlen">${p.len}</span>`:''}</div>`;

function renderHome(){
 const list=POSTS.filter(p=>S.feed==='foryou'||S.following.has(p.u)||p.u==='me');
 $('#homeBody').innerHTML=storiesHTML()+
 `<div class="seg" role="tablist"><button role="tab" data-a="feed" data-f="foryou" aria-selected="${S.feed==='foryou'}">For you</button><button role="tab" data-a="feed" data-f="following" aria-selected="${S.feed==='following'}">Following</button></div>`+
 (list.length?list.map(postHTML).join(''):'<div class="empty">Nothing here yet. Follow people from Explore.</div>');

function repaint(id){
 const el=document.querySelector(`[data-pid="${id}"]`),p=find(id);
 if(el&&p) el.outerHTML=postHTML(p);

/* ---------- Explore ---------- */

 const tr=TRENDS.filter(t=>m(t[0])),pe=Object.keys(P).filter(u=>u!=='me'&&(m(P[u].n)||m(P[u].h))),gr=GROUPS.filter(g=>m(g.n));

 if(pe.length) h+=`<div class="sec"><h3>People</h3>${pe.map(u=>`<div class="row">${av(u,44)}<div class="t"><b>${esc(P[u].n)}</b><small>@${esc(P[u].h)}</small></div><button class="pill ${S.following.has(u)?'on':''}" data-a="follow" data-u="${u}">${S.following.has(u)?'Following':'Follow'}</button></div>`).join('')}</div>`;
 if(gr.length) h+=`<div class="sec"><h3>Groups</h3>${gr.map(g=>`<div class="row"><span class="av" style="--c:${(g.n.length*37)%360};--s:44px">${g.n[0]}</span><div class="t"><b>${esc(g.n)}</b><small>${g.m}</small></div><button class="pill ${S.joined.has(g.id)?'on':''}" data-a="join" data-g="${g.id}">${S.joined.has(g.id)?'Joined':'Join'}</button></div>`).join('')}</div>`;

/* ---------- Long-form video (Watch) ---------- */
const W={id:'',t:0,play:false,speed:1,desc:false,timer:null};
const SUBS={kabelo:'240K',amara:'96K',tom:'1.2M',priya:'58K',jabu:'410K',lindi:'12K'};
const CATS=['All','Music','Cooking','Tech','Travel','Photo'];
const fmtT=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60,p=n=>String(n).padStart(2,'0');return (h?h+':'+p(m):m)+':'+p(r)};
const vsw=()=>`<div class="vsw"><button data-a="vmode" data-m="watch" aria-pressed="${S.vmode==='watch'}">Watch</button><button data-a="vmode" data-m="clips" aria-pressed="${S.vmode==='clips'}">Clips</button><button data-a="vmode" data-m="live" aria-pressed="${S.vmode==='live'}">Live</button></div>`;
const vrow=v=>`<button class="vrow" data-a="vopen" data-id="${v.id}"><span class="thumb sm" style="${art(v.c)}"><span class="vlen">${fmtT(v.len)}</span></span><span class="t"><b>${esc(v.title)}</b><small>${esc(P[v.u].n)}<br>${fmt(v.views)} views · ${v.age}</small></span></button>`;
function vcard(v){
 const L=S.later.has(v.id);
 return `<article class="vc" data-vid="${v.id}"><button class="thumb" style="${art(v.c)}" data-a="vopen" data-id="${v.id}" aria-label="Play ${esc(v.title)}"><span class="vlen">${fmtT(v.len)}</span><span class="lowb">Audio only</span></button><div class="vmeta">${av(v.u,38)}<div class="t"><b>${esc(v.title)}</b><small>${esc(P[v.u].n)} · ${fmt(v.views)} views · ${v.age}</small></div><button class="act sv ${L?'on':''}" data-a="vlater" data-id="${v.id}" aria-label="Watch later" aria-pressed="${L}">${I('clock')}</button></div></article>`;
}
function renderWatchList(){
 const list=VIDS.filter(v=>(S.cat==='All'||v.cat===S.cat)&&(!S.chan||v.u===S.chan)),subs=[...S.subs];
 $('#s-videos').innerHTML=`<div class="topbar">${vsw()}</div><div class="scroll">
 ${subs.length?`<div class="stories" style="padding-bottom:8px">${subs.map(u=>`<button class="story" data-a="chan" data-u="${u}"><span class="ring ${S.chan===u?'':'me'}"><span class="in">${av(u,48)}</span></span><span class="n">${esc(P[u].h)}</span></button>`).join('')}</div>`:''}
 <div class="cats">${CATS.map(c=>`<button class="chip" data-a="cat" data-c="${c}" aria-pressed="${S.cat===c}">${c}</button>`).join('')}</div>
 ${list.length?list.map(vcard).join(''):'<div class="empty">No videos match these filters.</div>'}</div>`;
}
function libHTML(){
 const lat=[...S.later].map(id=>VIDS.find(v=>v.id===id)).filter(Boolean),hist=S.history.map(id=>VIDS.find(v=>v.id===id)).filter(Boolean);
 const none=t=>`<small style="color:var(--muted)">${t}</small>`;
 return `<div class="sec"><h3>Watch later</h3>${lat.length?lat.map(vrow).join(''):none('Tap the clock on any video to add it here.')}</div><div class="sec"><h3>History</h3>${hist.length?hist.map(vrow).join(''):none('Videos you watch show up here.')}</div>`;
}
function updP(){
 const v=VIDS.find(x=>x.id===W.id);if(!v||!$('#pfill'))return;
 $('#pfill').style.width=(W.t/v.len*100)+'%';
 $('#ptime').textContent=fmtT(W.t)+' / '+fmtT(v.len);
 $('#pspd').textContent=W.speed+'x';
 const ended=W.t>=v.len,pb=$('#pbig');
 pb.innerHTML=W.play?'':(ended?I('repost',32):I('play',32));pb.style.display=W.play?'none':'grid';
}
function tick(){
 const v=VIDS.find(x=>x.id===W.id);if(!v||!W.play)return;
 W.t=Math.min(v.len,W.t+0.25*W.speed);
 if(W.t>=v.len){
  W.play=false;
  if(S.auto){const n=VIDS[(VIDS.indexOf(v)+1)%VIDS.length].id;setTimeout(()=>{if(!$('#panel').hidden&&W.id===v.id&&W.t>=v.len)openWatch(n)},1500)}
 }
 updP();
}
function openWatch(id){
 const v=VIDS.find(x=>x.id===id);if(!v)return;
 clearInterval(W.timer);
 Object.assign(W,{id,t:0,play:true,speed:1,desc:false});
 S.history=[id,...S.history.filter(x=>x!==id)];
 const p=$('#panel');p.hidden=false;
 p.innerHTML=`<div class="player" id="wPlayer" data-a="vplay"><div class="bg" style="background:linear-gradient(170deg,hsl(${v.c} 60% 28%),hsl(${(v.c+90)%360} 70% 12%))"><div class="blob" style="width:60%;height:60%;left:-5%;top:0;background:hsl(${v.c} 90% 60%)"></div><div class="blob b2" style="width:50%;height:60%;right:-10%;top:30%;background:hsl(${(v.c+70)%360} 90% 55%)"></div></div>
 <button class="pback" data-a="closePanel" aria-label="Back">${I('back')}</button><div class="sample">Sample video</div><div class="lowb">Audio + still frame</div><span class="pbig" id="pbig"></span>
 <div class="pctl"><div class="ptrack" data-a="vseek" role="slider" aria-label="Seek"><i id="pfill"></i></div><div class="prow"><span id="ptime"></span><button data-a="vspeed" id="pspd" aria-label="Playback speed">1x</button></div></div></div><div class="lb" id="wMeta"></div>`;
 renderWatchMeta();updP();
 W.timer=setInterval(tick,250);
}
function renderWatchMeta(){
 const el=$('#wMeta'),v=VIDS.find(x=>x.id===W.id);if(!el||!v)return;
 const L=S.liked.has(v.id),D=S.dis.has(v.id),sub=S.subs.has(v.u),b=S.bell.has(v.u),lat=S.later.has(v.id);
 el.innerHTML=`<div class="wm"><h1>${esc(v.title)}</h1>
 <button class="wdesc" data-a="vdesc"><span class="m">${fmt(v.views)} views · ${v.age}</span><span class="d ${W.desc?'open':''}">${tagify(v.desc)}</span><small>${W.desc?'Show less':'...more'}</small></button>
 <div class="chrow">${av(v.u,42)}<div class="t"><b>${esc(P[v.u].n)}</b><small>${SUBS[v.u]} subscribers</small></div>${sub?`<button class="bellb ${b?'on':''}" data-a="vbell" data-u="${v.u}" aria-label="Notifications" aria-pressed="${b}">${I('bell',20)}</button>`:''}<button class="pill ${sub?'on':''}" data-a="vsub" data-u="${v.u}">${sub?'Subscribed':'Subscribe'}</button></div>
 <div class="vact"><span class="lpill"><button class="act lk ${L?'on':''}" data-a="vlike" data-id="${v.id}" aria-pressed="${L}" aria-label="Like">${I('thumb')}${fmt(lk(v.id,v.likes))}</button><button class="act ${D?'on':''}" data-a="vdis" data-id="${v.id}" aria-pressed="${D}" aria-label="Dislike"><span style="display:inline-flex;transform:rotate(180deg)">${I('thumb')}</span></button></span>
 <button class="act" data-a="share" data-id="${v.id}">${I('share')}Share</button>
 <button class="act ${lat?'on':''}" data-a="vlater" data-id="${v.id}" aria-pressed="${lat}">${I('clock')}${lat?'Saved':'Watch later'}</button></div>
 <button class="cmcard" data-a="comments" data-id="${v.id}"><b>Comments ${fmt(v.cc)}</b>${v.comments.length?`<span>${av(v.comments[v.comments.length-1].u,24)}${esc(cmText(v.comments[v.comments.length-1]))}</span>`:'<span>Add a comment</span>'}</button>
 <div class="uh"><b>Up next</b><button class="pill ${S.auto?'':'on'}" data-a="vauto">Autoplay ${S.auto?'on':'off'}</button></div>
 ${VIDS.filter(x=>x.id!==v.id).map(vrow).join('')}</div>`;
}

/* ---------- Nav & tabs ---------- */

function closeSheet(){$('#scrim').hidden=true;$('#scrim').innerHTML=''}

/* ----- feed recipes + "why am I seeing this" ----- */
function score(p){
 const r=S.recipe;let s=Math.log10(p.likes+10)*10;
 if(S.following.has(p.u))s+=(r.friends-50)*.6;

 if(p.type==='text')s+=(r.news-50)*.6;

 return s;

 if(S.recipe.order==='time')return 'Newest first, from your recipe "'+S.recipe.name+'"';

 if(S.following.has(p.u))return 'You follow @'+P[p.u].h+(S.recipe.friends>60?' and your recipe favours friends':'');
 const tg=(p.text.match(/#(\w+)/)||[])[1];
 return tg?'Trending in #'+tg:'Popular with people you follow';
}

 let l=POSTS.filter(p=>S.feed==='foryou'||S.following.has(p.u)||p.u==='me');
 l=l.filter(p=>!(p.type==='video'&&r.video===0)&&!(p.type==='text'&&r.news===0));
 return l.slice().sort(r.order==='time'?(a,b)=>mins(a.t)-mins(b.t):(a,b)=>score(b)-score(a));

 `<div class="seg" role="tablist"><button role="tab" data-a="feed" data-f="foryou" aria-selected="${S.feed==='foryou'}">For you</button><button role="tab" data-a="feed" data-f="following" aria-selected="${S.feed==='following'}">Following</button></div>`+

 ${[['friends','Friends and follows'],['video','Video'],['news','News and opinion']].map(([k,l])=>`<div class="sl"><label for="sl-${k}">${l}<span id="rv-${k}">${lvl(r[k])}</span></label><input type="range" id="sl-${k}" data-r="${k}" min="0" max="100" step="10" value="${r[k]}"></div>`).join('')}

/* ----- time-box ----- */
function startTB(m){
 S.tb={min:m,start:Date.now(),end:Date.now()+m*60000,limit:m===5?3:m===10?5:7,l0:new Set(S.liked),f0:new Set(S.following)};
